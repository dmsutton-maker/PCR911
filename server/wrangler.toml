name = "pcr-relay"
main = "worker.js"
compatibility_date = "2026-01-01"

# Nothing secret belongs in this file — it is committed to a public repo.
# The provider keys and squad codes are set as Cloudflare *secrets*, either
# through the dashboard or by the GitHub Actions workflow. See server/README.md.

[vars]
# Which web origins may read a response from this relay. The squad code is the
# real access control; this is a second, weaker fence. Leave it as-is unless you
# host the app somewhere other than GitHub Pages.
ALLOWED_ORIGINS = "https://dmsutton-maker.github.io"

# Requests allowed per person (or per shared code) per day. Enforced once
# ORG_DATA is bound.
DAILY_LIMIT = "300"

# Required for squad accounts — people, roles, invites, and the activity log.
# Create a KV namespace in the Cloudflare dashboard and paste its ID here.
# Without it the relay still proxies requests using a shared squad code, but
# nobody can have an account and nothing can be attributed to a person.
# [[kv_namespaces]]
# binding = "ORG_DATA"
# id = "paste-the-namespace-id-here"
