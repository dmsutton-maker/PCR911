name: Deploy relay

# Publishes server/worker.js to Cloudflare Workers — the small server that holds
# the AI provider key so nobody on the crew has to.
#
# Runs only when the Cloudflare secrets exist, so the repo works fine for anyone
# who has not set up a relay. See server/README.md for what to add and where.
#
# Repository secrets this reads (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   required
#   CLOUDFLARE_ACCOUNT_ID  required
#   GEMINI_API_KEY         at least one provider key required
#   ANTHROPIC_API_KEY      optional
#   BOOTSTRAP_CODE         needed once, to create your squad (docs/SQUAD-ACCOUNTS.md)
#
# The KV namespace squad accounts need is created by this workflow — there is
# nothing to set up in the Cloudflare dashboard.
#   ACCESS_CODES           optional — the old shared-code scheme, kept working
#                          for phones set up before accounts existed

on:
  push:
    branches:
      - claude/build-session-v1mubj
    paths:
      - 'server/**'
      - '.github/workflows/deploy-relay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Secrets are not available to a job-level `if`, so the skip has to happen
      # inside a step and be carried forward as an output.
      - name: Check for Cloudflare credentials
        id: check
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No Cloudflare credentials set — skipping. This is expected if you have not set up a relay."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail early on a relay with no keys
        if: steps.check.outputs.configured == 'true'
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ] && [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "::error::No provider key set. Add GEMINI_API_KEY (free) or ANTHROPIC_API_KEY."
            exit 1
          fi
          if [ -z "${{ secrets.BOOTSTRAP_CODE }}" ] && [ -z "${{ secrets.ACCESS_CODES }}" ]; then
            echo "::error::Nobody could authenticate to this relay. Set BOOTSTRAP_CODE to create a squad with accounts, or ACCESS_CODES for the older shared-code scheme."
            exit 1
          fi

      # Squad accounts need a KV namespace. Creating one by hand means finding
      # the right screen in a dashboard that moves its own navigation around,
      # so the deploy finds or creates it and writes the binding itself.
      - name: Find or create storage
        if: steps.check.outputs.configured == 'true'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          find_id() {
            npx --yes wrangler@4 kv namespace list 2>/dev/null \
              | jq -r '.[] | select(.title | endswith("ORG_DATA")) | .id' \
              | head -1
          }

          ID="$(find_id || true)"

          if [ -z "$ID" ]; then
            echo "No ORG_DATA namespace yet — creating one."
            npx --yes wrangler@4 kv namespace create ORG_DATA || true
            ID="$(find_id || true)"
          fi

          if [ -z "$ID" ]; then
            echo "::error::Could not find or create the ORG_DATA namespace. The API token may lack Workers KV Storage permission — recreate it from the 'Edit Cloudflare Workers' template, which includes it."
            exit 1
          fi

          echo "Using ORG_DATA namespace $ID"

          # wrangler.toml ships with the binding commented out so the repo works
          # for anyone without a Cloudflare account. Append the real one here
          # rather than committing an account-specific id.
          if grep -q '^\[\[kv_namespaces\]\]' wrangler.toml; then
            echo "A namespace binding is already committed; leaving it alone."
          else
            printf '\n[[kv_namespaces]]\nbinding = "ORG_DATA"\nid = "%s"\n' "$ID" >> wrangler.toml
          fi

      - name: Deploy
        if: steps.check.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          # Uploads these as Worker secrets, so they are set on the Worker
          # rather than baked into the script or visible in the dashboard's
          # plaintext variables.
          secrets: |
            ACCESS_CODES
            GEMINI_API_KEY
            ANTHROPIC_API_KEY
            BOOTSTRAP_CODE
        env:
          ACCESS_CODES: ${{ secrets.ACCESS_CODES }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BOOTSTRAP_CODE: ${{ secrets.BOOTSTRAP_CODE }}

      - name: Where it lives
        if: steps.check.outputs.configured == 'true'
        run: |
          echo "Relay deployed. Its address is in the Deploy step's log, as"
          echo "  https://pcr-relay.<your-subdomain>.workers.dev"
          echo ""
          echo "Next: open https://dmsutton-maker.github.io/PCR911/setup on your phone"
          echo "and fill in that address, your BOOTSTRAP_CODE, a squad name, and your name."
