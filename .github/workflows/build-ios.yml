name: Build iOS app

# Builds the real iPhone app and, optionally, sends it to TestFlight so testers
# install it from a link like any other beta.
#
# You run this by hand — it is not on every push, because a native build takes
# 15-30 minutes and costs a slot on Expo's free build queue. Day-to-day code
# changes reach the installed app through "Publish OTA update" instead, which
# takes about a minute and needs no rebuild.
#
# Rebuild only when something *native* changes: a new native module, a
# permission string, an icon, or the app version.
#
# Setup (one time, all of it from a browser — see docs/INSTALL-ON-PHONE.md):
#   EXPO_TOKEN             expo.dev → Account settings → Access tokens
#   APPLE_ASC_KEY_P8       the .p8 file's contents, pasted whole
#   APPLE_ASC_KEY_ID       shown next to the key on App Store Connect
#   APPLE_ASC_ISSUER_ID    shown above the key list
#   APPLE_TEAM_ID          developer.apple.com → Membership details
#
# The App Store Connect API key lets EAS create and renew the signing
# certificate and provisioning profile on its own. Without it the first build
# stops to ask a question no one is there to answer.
#
# Optional, and the reason testers never see a settings screen:
#   PCR_RELAY_URL + PCR_SQUAD_CODE    or    PCR_GEMINI_API_KEY

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Which build profile'
        type: choice
        options:
          - preview
          - production
        default: preview
      submit:
        description: 'Send to TestFlight when the build finishes'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Check the setup before spending a build slot
        run: |
          missing=""
          for name in EXPO_TOKEN APPLE_ASC_KEY_P8 APPLE_ASC_KEY_ID APPLE_ASC_ISSUER_ID APPLE_TEAM_ID; do
            case "$name" in
              EXPO_TOKEN)          value="${{ secrets.EXPO_TOKEN }}" ;;
              APPLE_ASC_KEY_P8)    value="${{ secrets.APPLE_ASC_KEY_P8 }}" ;;
              APPLE_ASC_KEY_ID)    value="${{ secrets.APPLE_ASC_KEY_ID }}" ;;
              APPLE_ASC_ISSUER_ID) value="${{ secrets.APPLE_ASC_ISSUER_ID }}" ;;
              APPLE_TEAM_ID)       value="${{ secrets.APPLE_TEAM_ID }}" ;;
            esac
            [ -z "$value" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — see docs/INSTALL-ON-PHONE.md"
            exit 1
          fi

          if [ -z "${{ secrets.PCR_RELAY_URL }}" ] && [ -z "${{ secrets.PCR_GEMINI_API_KEY }}" ]; then
            echo "::warning::No connection baked in. Testers will be asked for an API key on first launch, which is probably not what you want. Set PCR_RELAY_URL + PCR_SQUAD_CODE, or PCR_GEMINI_API_KEY."
          fi

      # Written to the runner's temp directory, never the working tree, so it
      # cannot be picked up by a build step or committed. The runner is
      # destroyed when the job ends.
      - name: Stage the App Store Connect key
        run: |
          printf '%s' "${{ secrets.APPLE_ASC_KEY_P8 }}" > "$RUNNER_TEMP/asc-key.p8"
          chmod 600 "$RUNNER_TEMP/asc-key.p8"

      - name: Build
        run: |
          eas build \
            --platform ios \
            --profile "${{ inputs.profile }}" \
            --non-interactive \
            --wait
        env:
          EXPO_ASC_API_KEY_PATH: ${{ runner.temp }}/asc-key.p8
          EXPO_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # A personal developer account, per the project's separation from any
          # employer. Change this only if the account itself changes.
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
          PCR_RELAY_URL: ${{ secrets.PCR_RELAY_URL }}
          PCR_SQUAD_CODE: ${{ secrets.PCR_SQUAD_CODE }}
          PCR_GEMINI_API_KEY: ${{ secrets.PCR_GEMINI_API_KEY }}
          PCR_ANTHROPIC_API_KEY: ${{ secrets.PCR_ANTHROPIC_API_KEY }}

      - name: Send to TestFlight
        if: ${{ inputs.submit }}
        run: eas submit --platform ios --profile "${{ inputs.profile }}" --latest --non-interactive
        env:
          EXPO_ASC_API_KEY_PATH: ${{ runner.temp }}/asc-key.p8
          EXPO_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc-key.p8"
