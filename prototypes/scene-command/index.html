<title>Scene Command Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-screen command board. Incident header with clocks across the top, a rail of views on the left,
   and panels that scroll inside themselves on a landscape tablet, then stack into one column on a phone.
   Night is the default (the PCR911 palette); Day is a high-contrast mode for direct sunlight. */
:root {
  --bg: #0B1B2B;
  --surface: #12293D;
  --raised: #183449;
  --line: #25506E;
  --fg: #EAF2F8;
  --muted: #9FB6C8;
  --faint: #6F8AA0;
  --accent: #4FA3E3;
  --accent-ink: #04121E;
  --ok: #4CC38A;
  --warn: #E8B14C;
  --crit: #E8695C;
  --scrim: rgb(2 8 14 / 0.62);

  --red: #D7373F;     --red-ink: #FFFFFF;
  --yellow: #F2C230;  --yellow-ink: #1D1600;
  --green: #2DB86A;   --green-ink: #03180B;
  --black: #000000;   --black-ink: #FFFFFF;  --black-edge: #8DA3B5;

  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;

  --tap: 56px;
  --r: 12px;
  color-scheme: dark;
}
:root[data-mode="day"] {
  --bg: #FFFFFF;
  --surface: #F2F5F8;
  --raised: #E2E9F0;
  --line: #8EA4B8;
  --fg: #06131F;
  --muted: #2E4558;
  --faint: #536A7D;
  --accent: #0B5FA5;
  --accent-ink: #FFFFFF;
  --ok: #0E7A45;
  --warn: #8C5A00;
  --crit: #B3261E;
  --scrim: rgb(6 19 31 / 0.5);
  --red: #C62828;     --red-ink: #FFFFFF;
  --yellow: #F2C230;  --yellow-ink: #1D1600;
  --green: #1E9E55;   --green-ink: #FFFFFF;
  --black: #000000;   --black-ink: #FFFFFF;  --black-edge: #000000;
  color-scheme: light;
}

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 500 16px/1.4 var(--body);
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- shell ---------- */
.app {
  height: 100%;
  box-sizing: border-box;
  display: grid;
  grid-template-columns: 88px minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "head head" "rail main";
  gap: 12px;
  padding-inline: 16px;
  padding-block: 12px;
}
.head { grid-area: head; }
.rail { grid-area: rail; }
.main { grid-area: main; min-height: 0; overflow: auto; overscroll-behavior: contain; }

/* ---------- header ---------- */
.head {
  display: flex;
  align-items: stretch;
  gap: 16px;
  flex-wrap: wrap;
}
.inc { flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 4px; justify-content: center; }
.inc-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.inc h1 {
  margin: 0;
  font: 700 27px/1.1 var(--display);
  letter-spacing: 0.01em;
  text-wrap: balance;
}
.titlebtn { all: unset; cursor: pointer; border-radius: 6px; }
.titlebtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.inc-sub { color: var(--muted); font-size: 15px; }
.inc-sub b { color: var(--fg); font-weight: 600; }
.tag {
  display: inline-flex; align-items: center; gap: 6px;
  font: 700 13px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase;
  padding: 6px 9px; border-radius: 6px;
  border: 1.5px solid var(--line); color: var(--muted); background: transparent;
}
button.tag { min-height: 32px; }
.tag.mci { background: var(--crit); border-color: var(--crit); color: var(--accent-ink); }
:root[data-mode="day"] .tag.mci { color: #FFFFFF; }
.tag.suggest { border-color: var(--warn); color: var(--warn); }
.tag.sample { border-style: dashed; }

.clocks { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
.clock, .par, .iconbtn {
  display: flex; flex-direction: column; justify-content: center; gap: 2px;
  min-width: 96px; padding: 8px 12px; border-radius: var(--r);
  background: var(--surface); border: 1px solid var(--line);
  text-align: left;
}
.clock .v, .par .v { font: 700 24px/1 var(--mono); font-variant-numeric: tabular-nums; }
.lbl { font: 600 12px/1 var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
.par { min-width: 118px; }
.par.due { border-color: var(--warn); }
.par.due .v { color: var(--warn); }
.par.over { background: var(--crit); border-color: var(--crit); }
.par.over .v, .par.over .lbl { color: var(--accent-ink); }
:root[data-mode="day"] .par.over .v, :root[data-mode="day"] .par.over .lbl { color: #FFFFFF; }
.iconbtn { min-width: 64px; align-items: center; }
.iconbtn svg { width: 26px; height: 26px; }

/* ---------- rail ---------- */
.rail { display: flex; flex-direction: column; gap: 6px; min-height: 0; overflow: auto; }
.rail button {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  min-height: 70px; border-radius: var(--r);
  background: transparent; border: 1px solid transparent; color: var(--muted);
  font: 600 13px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase;
}
.rail button svg { width: 28px; height: 28px; }
.rail button[aria-current="page"] { background: var(--raised); border-color: var(--line); color: var(--fg); }
.rail button[aria-current="page"] svg { color: var(--accent); }
.rail .spacer { flex: 1; }
.badge {
  min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; box-sizing: border-box;
  background: var(--crit); color: var(--accent-ink); font: 700 12px/20px var(--mono); text-align: center;
}
:root[data-mode="day"] .badge { color: #FFFFFF; }
.rail .ico { position: relative; }
.rail .ico .badge { position: absolute; top: -6px; right: -14px; }

svg.i { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- panels ---------- */
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 14px;
  display: flex; flex-direction: column; gap: 12px;
  min-width: 0;
}
.ph { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.ph h2 {
  margin: 0; font: 700 15px/1 var(--display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
}
.ph .meta { color: var(--faint); font-size: 14px; }
.empty { color: var(--faint); font-size: 15px; padding: 6px 0; }

.btn {
  min-height: var(--tap); padding: 0 18px; border-radius: 10px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--raised); border: 1.5px solid var(--line); color: var(--fg);
  font: 700 18px/1 var(--display); letter-spacing: 0.04em;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { border-color: var(--crit); color: var(--crit); background: transparent; }
.btn.small { min-height: 44px; font-size: 16px; padding: 0 14px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn svg { width: 22px; height: 22px; }

/* ---------- board ---------- */
.board {
  display: grid;
  grid-template-columns: minmax(300px, 1fr) minmax(320px, 1.12fr) minmax(320px, 1.12fr);
  gap: 12px;
  height: 100%;
  min-height: 0;
}
.col { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: auto; overscroll-behavior: contain; }

/* triage */
.tri-sum { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.tri-total { font: 700 44px/1 var(--display); }
.tri-total small { font: 600 16px/1 var(--body); color: var(--muted); margin-left: 6px; }
.est { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; }
.est button { width: 36px; height: 36px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--raised); font: 700 20px/1 var(--mono); }
.bar { height: 8px; border-radius: 4px; background: var(--raised); overflow: hidden; display: flex; }
.bar span { display: block; height: 100%; }

.tri {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 10px;
  padding: 10px 10px 10px 14px;
  border-radius: var(--r);
  border: 2px solid var(--c);
  background: color-mix(in srgb, var(--c) 14%, var(--surface));
}
.tri-R { --c: var(--red); --ink: var(--red-ink); }
.tri-Y { --c: var(--yellow); --ink: var(--yellow-ink); }
.tri-G { --c: var(--green); --ink: var(--green-ink); }
.tri-B { --c: var(--black-edge); --ink: var(--black-ink); background: color-mix(in srgb, var(--black) 55%, var(--surface)); }
:root[data-mode="day"] .tri-B { background: #2A2F35; color: #FFFFFF; }
:root[data-mode="day"] .tri-B .tri-sub { color: #D3DCE4; }
.tri-head { display: flex; align-items: center; gap: 8px; }
.swatch {
  font: 700 13px/1 var(--display); letter-spacing: 0.1em; text-transform: uppercase;
  padding: 5px 8px; border-radius: 5px; background: var(--c); color: var(--ink);
}
.tri-B .swatch { background: var(--black); color: var(--black-ink); border: 1.5px solid var(--black-edge); }
:root[data-mode="day"] .tri-B .swatch { border-color: #FFFFFF; }
.tri-name { font: 700 19px/1 var(--display); letter-spacing: 0.04em; text-transform: uppercase; }
.tri-count { font: 700 56px/0.95 var(--display); font-variant-numeric: tabular-nums; margin-top: 2px; }
.tri-sub { font-size: 14px; color: var(--muted); }
.tri-sub b { color: var(--fg); }
:root[data-mode="day"] .tri-B .tri-sub b { color: #FFFFFF; }
.tri-btns { display: flex; gap: 8px; }
.tri-btns button {
  width: 64px; height: 72px; border-radius: 10px;
  font: 700 34px/1 var(--display);
  border: 2px solid var(--c); background: var(--surface); color: var(--fg);
}
.tri-btns button.plus { background: var(--c); color: var(--ink); }
.tri-B .tri-btns button.plus { background: var(--black); color: var(--black-ink); border-color: var(--black-edge); }
:root[data-mode="day"] .tri-B .tri-btns button { background: #000; color: #FFF; border-color: #FFF; }

/* key/value strip */
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 15px; }
.kv dt { color: var(--faint); font: 600 13px/1.6 var(--display); letter-spacing: 0.08em; text-transform: uppercase; }
.kv dd { margin: 0; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.hz {
  font: 600 14px/1 var(--display); letter-spacing: 0.04em; padding: 6px 9px; border-radius: 6px;
  border: 1.5px solid var(--warn); color: var(--warn);
}

/* benchmarks */
.bench { display: flex; flex-direction: column; }
.bench button {
  display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px;
  min-height: 52px; padding: 4px 4px; text-align: left;
  background: transparent; border: 0; border-bottom: 1px solid var(--line);
}
.bench button:last-child { border-bottom: 0; }
.tick {
  width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center;
}
.tick svg { width: 18px; height: 18px; opacity: 0; }
.bench .done .tick { background: var(--ok); border-color: var(--ok); color: var(--accent-ink); }
:root[data-mode="day"] .bench .done .tick { color: #FFFFFF; }
.bench .done .tick svg { opacity: 1; }
.bench .b-label { font-size: 16px; font-weight: 600; }
.bench .todo .b-label { color: var(--muted); font-weight: 500; }
.bench .ready .b-label { color: var(--warn); font-weight: 600; }
.bench .b-time { text-align: right; font: 700 15px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
.bench .b-time small { display: block; font-size: 12px; color: var(--faint); font-weight: 500; }

/* stat row */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 8px; }
.stat { background: var(--raised); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 4px; }
.stat .v { font: 700 30px/1 var(--display); font-variant-numeric: tabular-nums; }
.stat.R { background: var(--red); color: var(--red-ink); }
.stat.Y { background: var(--yellow); color: var(--yellow-ink); }
.stat.G { background: var(--green); color: var(--green-ink); }
.stat.R .lbl, .stat.Y .lbl, .stat.G .lbl { color: inherit; opacity: 0.85; }

/* list rows */
.rows { display: flex; flex-direction: column; }
.row {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px;
  min-height: 52px; padding: 6px 2px; border-bottom: 1px solid var(--line);
  background: transparent; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%;
}
.row:last-child { border-bottom: 0; }
.row .t1 { font-weight: 600; }
.row .t2 { font-size: 14px; color: var(--muted); }
.row .r { text-align: right; }
.dot { width: 14px; height: 14px; border-radius: 4px; background: var(--c); border: 1.5px solid var(--c); }
.dot.B { background: var(--black); border-color: var(--black-edge); }
.c-R { --c: var(--red); } .c-Y { --c: var(--yellow); } .c-G { --c: var(--green); } .c-B { --c: var(--black-edge); }

.pill {
  display: inline-block; font: 700 12px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase;
  padding: 5px 7px; border-radius: 5px; border: 1.5px solid var(--line); color: var(--muted); white-space: nowrap;
}
.pill.requested { border-color: var(--warn); color: var(--warn); }
.pill.ack { border-color: var(--accent); color: var(--accent); }
.pill.enroute { border-color: var(--accent); color: var(--accent); }
.pill.onscene, .pill.done { border-color: var(--ok); color: var(--ok); }
.pill.cancelled { text-decoration: line-through; }
.pill.solid { background: var(--raised); }

/* hospital load */
.load { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.load:last-child { border-bottom: 0; }
.load .nm { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.load .ct { font: 600 14px/1 var(--mono); color: var(--muted); }
.load .bar { grid-column: 1 / -1; height: 10px; }

/* ---------- generic view layouts ---------- */
.view { display: flex; flex-direction: column; gap: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: start; }
.grid-hosp { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; align-items: start; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar .grow { flex: 1; }
.view-title { margin: 0; font: 700 26px/1 var(--display); letter-spacing: 0.02em; }

/* units board */
.lanes { display: grid; grid-template-columns: repeat(5, minmax(170px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.lane { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.lane h3 { margin: 0; display: flex; justify-content: space-between; font: 700 14px/1 var(--display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.unit {
  display: flex; flex-direction: column; gap: 4px; text-align: left;
  padding: 10px; border-radius: 10px; background: var(--raised); border: 1.5px solid var(--line);
  min-height: var(--tap);
}
.unit .u1 { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.unit .uid { font: 700 21px/1 var(--display); letter-spacing: 0.02em; }
.unit .ut { font-size: 14px; color: var(--muted); }
.unit .task { font: 600 14px/1.2 var(--body); color: var(--fg); }
.kind { font: 700 12px/1 var(--display); letter-spacing: 0.08em; padding: 4px 6px; border-radius: 4px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.kind.ALS { color: var(--crit); border-color: var(--crit); }
.kind.SUP, .kind.MCI { color: var(--warn); border-color: var(--warn); }

/* hospitals */
.hosp { gap: 10px; }
.hosp h3 { margin: 0; font: 700 21px/1.1 var(--display); }
.hosp .sub { color: var(--muted); font-size: 14px; }
.caps { display: flex; flex-wrap: wrap; gap: 5px; }
.cap { font: 600 13px/1 var(--display); letter-spacing: 0.04em; padding: 5px 7px; border-radius: 5px; background: var(--raised); color: var(--fg); }
.cap.trauma { background: var(--crit); color: var(--accent-ink); }
:root[data-mode="day"] .cap.trauma { color: #FFFFFF; }
.capgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.capcell { border-radius: 10px; padding: 8px; border: 2px solid var(--c); display: flex; flex-direction: column; gap: 2px; }
.capcell .v { font: 700 22px/1 var(--mono); font-variant-numeric: tabular-nums; }
.capcell.over { background: color-mix(in srgb, var(--crit) 22%, var(--surface)); }
.note { font-size: 14px; color: var(--faint); }
.note b { color: var(--muted); }
.ok-t { color: var(--ok); } .warn-t { color: var(--warn); } .crit-t { color: var(--crit); }

/* ICS chart */
.ics { display: flex; flex-direction: column; gap: 14px; }
.tier { display: flex; flex-direction: column; gap: 8px; }
.tier > .lbl { padding-left: 2px; }
.tier-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.pos {
  display: flex; flex-direction: column; gap: 4px; text-align: left;
  padding: 10px 12px; border-radius: 10px; min-height: 64px;
  background: var(--surface); border: 1.5px solid var(--line);
}
.pos .pn { font: 700 14px/1.1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.pos .pw { font: 600 18px/1.2 var(--body); }
.pos.vacant { border-style: dashed; }
.pos.vacant .pw { color: var(--faint); font-weight: 500; font-size: 15px; }
.pos.lead { border-color: var(--accent); }
.branch { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.branch-col { display: flex; flex-direction: column; gap: 8px; }
.branch-col .subs { display: flex; flex-direction: column; gap: 8px; padding-left: 12px; border-left: 2px solid var(--line); }

/* radio scripts */
.script { font: 500 19px/1.5 var(--body); margin: 0; white-space: pre-wrap; }
.script b { font-family: var(--display); letter-spacing: 0.06em; color: var(--accent); }
.script .k { display: inline-block; min-width: 1.4em; font: 700 19px/1 var(--display); color: var(--accent); }

/* log */
.log { display: flex; flex-direction: column; }
.log .entry { display: grid; grid-template-columns: 64px 92px 1fr; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); align-items: baseline; }
.log .entry:last-child { border-bottom: 0; }
.log .lt { font: 700 15px/1 var(--mono); }
.log .lk { font: 700 12px/1 var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
.log .lx { min-width: 0; }
.composer { display: flex; gap: 8px; }
.composer input { flex: 1; min-width: 0; }

/* inputs */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > .lbl { padding-left: 2px; }
input[type="text"], input[type="search"], input[type="number"], input:not([type]), textarea {
  min-height: var(--tap); box-sizing: border-box; padding: 0 14px; border-radius: 10px;
  border: 1.5px solid var(--line); background: var(--bg); font-size: 18px; width: 100%;
}
textarea { padding: 12px 14px; min-height: 96px; resize: vertical; }
.opt {
  min-height: 52px; padding: 0 16px; border-radius: 10px;
  background: var(--raised); border: 1.5px solid var(--line);
  font: 700 17px/1.1 var(--display); letter-spacing: 0.03em; text-align: left;
  display: inline-flex; align-items: center; gap: 8px;
}
.opt[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt[aria-pressed="true"] .kind { background: transparent; color: inherit; border-color: currentColor; }
.opt small { font: 500 13px/1.2 var(--body); opacity: 0.85; letter-spacing: 0; }
.opt.tall { min-height: 64px; flex-direction: column; align-items: flex-start; justify-content: center; gap: 3px; padding: 8px 14px; }
.opt.cat-R[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: var(--red-ink); }
.opt.cat-Y[aria-pressed="true"] { background: var(--yellow); border-color: var(--yellow); color: var(--yellow-ink); }
.opt.cat-G[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--green-ink); }
.opt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.opt-grid.wide { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }

/* toast */
.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);

  } catch (e) { /* storage unavailable: run in memory */ }
  return null;
}

  if (S.bench[id]) return false;
  if (id === 'reds') return S.triage.R > 0 && remaining('R') === 0;
  if (id === 'allpts') return totalPts() > 0 && remainingTx() === 0;
  if (id === 'mci') return suggestedLevel() > 0;
  return false;
}

/* =====================================================================
   Rendering
   ===================================================================== */
const app = document.getElementById('app');
const sheetRoot = document.getElementById('sheet-root');
const toastRoot = document.getElementById('toast-root');

function render() {
  const scrolls = {};
  document.querySelectorAll('[data-scroll]').forEach(el => { scrolls[el.dataset.scroll] = [el.scrollTop, el.scrollLeft]; });
  document.documentElement.dataset.mode = S.mode;

  app.innerHTML = header() + rail() + `<main class="main" data-scroll="main-${UI.view}">${view()}</main>`;
  sheetRoot.innerHTML = UI.sheet ? sheetHtml() : '';

  document.querySelectorAll('[data-scroll]').forEach(el => {
    const v = scrolls[el.dataset.scroll];
    if (v) { el.scrollTop = v[0]; el.scrollLeft = v[1]; }
  });
  tick();
}

function header() {
  const I = S.incident;
  const lvl = I.mciLevel, sug = suggestedLevel();
  const mci = lvl
    ? `<button class="tag mci" data-act="sheet" data-arg="mci">MCI · ${esc(levelLabel(lvl))}</button>`
    : `<button class="tag" data-act="sheet" data-arg="mci">No MCI declared</button>`;
  const suggest = sug > lvl ? `<button class="tag suggest" data-act="sheet" data-arg="mci">Count suggests ${esc(levelLabel(sug))}</button>` : '';
  const sample = S.sample ? `<span class="tag sample">Sample incident</span>` : '';
  const title = [I.type, I.location].filter(Boolean).join(' · ') || 'New incident';
  const sub = [
    I.municipality && esc(I.municipality),
    I.commandName && `<b>${esc(I.commandName)}</b>`,
    I.ic && `EMS Command: ${esc(I.ic)}`,
  ].filter(Boolean).join(' · ');
  return `<header class="head">
    <div class="inc">
      <div class="inc-top">${mci}${suggest}${sample}</div>
      <h1><button class="titlebtn" data-act="sheet" data-arg="incident">${esc(title)}</button></h1>
      <div class="inc-sub">${sub || 'Tap the title to fill in incident details'}</div>
    </div>
    <div class="clocks">
      <div class="clock"><span class="lbl">Time</span><span class="v" data-clock="now">--:--</span></div>
      <div class="clock"><span class="lbl">Since dispatch</span><span class="v" data-clock="elapsed">--:--</span></div>
      <button class="par" id="par-btn" data-act="sheet" data-arg="par"><span class="lbl" data-clock="par-lbl">PAR due</span><span class="v" data-clock="par">--:--</span></button>
      <button class="iconbtn" data-act="mode" aria-label="Switch to ${S.mode === 'day' ? 'night' : 'day'} mode">${icon(S.mode === 'day' ? 'moon' : 'sun')}<span class="lbl">${S.mode === 'day' ? 'Night' : 'Day'}</span></button>
    </div>
  </header>`;
}

const VIEWS = [
  { id: 'board',     label: 'Board',     icon: 'board' },
  { id: 'transport', label: 'Transport', icon: 'amb' },
  { id: 'units',     label: 'Units',     icon: 'units' },
  { id: 'hospitals', label: 'Hospitals', icon: 'hosp' },
  { id: 'ics',       label: 'ICS',       icon: 'ics' },
  { id: 'radio',     label: 'Radio',     icon: 'radio' },
  { id: 'log',       label: 'Log',       icon: 'log' },
];
function rail() {
  const badge = id => {
    if (id === 'transport') { const r = remaining('R'); return r ? `<span class="badge" aria-label="${r} Immediate awaiting transport">${r}</span>` : ''; }
    if (id === 'units') { const n = openRequests().filter(r => r.status === 'requested').length; return n ? `<span class="badge" aria-label="${n} requests not acknowledged">${n}</span>` : ''; }
    return '';
  };
  return `<nav class="rail" aria-label="Views">
    ${VIEWS.map(v => `<button data-act="view" data-arg="${v.id}" ${UI.view === v.id ? 'aria-current="page"' : ''}><span class="ico">${icon(v.icon)}${badge(v.id)}</span>${v.label}</button>`).join('')}
    <span class="spacer"></span>
    <button data-act="sheet" data-arg="menu">${icon('menu')}Menu</button>
  </nav>`;
}

function view() {
  switch (UI.view) {
    case 'transport': return transportView();
    case 'units': return unitsView();
    case 'hospitals': return hospitalsView();
    case 'ics': return icsView();
    case 'radio': return radioView();
    case 'log': return logView();
    default: return boardView();
  }
}

function triagePanel() {

  const seg = CATS.map(c => `<span style="width:${(S.triage[c.k] / denom) * 100}%;background:var(--${c.k === 'R' ? 'red' : c.k === 'Y' ? 'yellow' : c.k === 'G' ? 'green' : 'black-edge'})"></span>`).join('');

      <div class="est">Est. <button data-act="est" data-arg="-1" aria-label="Lower estimate">−</button><span class="num" style="min-width:2ch;text-align:center;font-weight:700;color:var(--fg)">${est}</span><button data-act="est" data-arg="1" aria-label="Raise estimate">+</button></div>

function listCounts(get, cats = CATS) {
  const parts = cats.map(c => ({ c, n: get(c.k) })).filter(x => x.n > 0).map(x => `${x.n} ${x.c.name}`);
  return parts.length ? parts.join(', ') : 'none';
}
function radioScripts() {
  const I = S.incident;
  const cmd = I.commandName || 'Command';
  const loc = [I.location, I.municipality].filter(Boolean).join(', ') || '[location]';
  const n = totalPts();
  const onScene = S.units.filter(u => u.status === 'onscene' || u.status === 'staged');
  const amb = onScene.filter(u => TRANSPORT_KINDS.includes(u.kind));
  const reqs = openRequests();
  const reqText = reqs.length ? reqs.map(r => `${r.qty > 1 ? r.qty + ' ' : ''}${r.what} (${reqStatusName(r.status).toLowerCase()})`).join('; ') : 'nothing further at this time';
  const counts = n ? `${n} patients: ${listCounts(k => S.triage[k])}` : `estimated ${I.est || 'unknown number of'} patients, triage under way`;
  const mciLine = I.mciLevel ? `${cmd} is declaring a mass casualty incident, ${levelLabel(I.mciLevel)}.` : `No MCI declared at this time.`;

  const methane = [
    ['M', 'Major incident', mciLine],
    ['E', 'Exact location', `${loc}.`],
    ['T', 'Type', `${I.type}.`],
    ['H', 'Hazards', I.hazards.length ? `${I.hazards.join(', ')}.` : 'None noted.'],
    ['A', 'Access', [I.access, I.staging && `Staging at ${I.staging}`].filter(Boolean).join('. ') + '.'],
    ['N', 'Number of casualties', `${counts}.`],
    ['E', 'Emergency services', `On scene: ${amb.length} transport units, ${S.units.filter(u => u.kind === 'FIRE' && u.status === 'onscene').length ? 'Fire, ' : ''}${S.units.filter(u => u.kind === 'PD' && u.status === 'onscene').length ? 'Police. ' : ''}Requesting: ${reqText}.`],
  ];

  const sentList = listCounts(sentCat, CATS.filter(c => c.k !== 'B'));
  const can = [
    ['C', 'Conditions', `${counts}. ${I.hazards.length ? 'Hazards: ' + I.hazards.join(', ') + '.' : ''}`],
    ['A', 'Actions', `${BENCHMARKS.filter(b => S.bench[b.id]).slice(-3).map(b => b.label + ' ' + hhmm(S.bench[b.id])).join('; ')}. Transported ${totalSent()} (${sentList}). Remaining on scene: ${listCounts(remaining, CATS.filter(c => c.k !== 'B'))}.`],
    ['N', 'Needs', `${reqText}.`],
  ];

  const hospLine = `This is ${cmd}. We have an MCI at ${loc}, ${I.type.toLowerCase()}. ${counts}. First patients are ${totalSent() ? 'already en route' : 'about to leave'}. How many Red, Yellow and Green can you accept right now? Our transport officer will call each unit in with a tag number.`;

  const handoff = `${cmd} · ${loc}\n${I.type}. Dispatched ${hhmm(I.dispatchAt)}, ${mins(now() - I.dispatchAt)} ago.\nEMS Command: ${I.ic || 'unassigned'}. ${I.mciLevel ? 'MCI ' + levelLabel(I.mciLevel) + '.' : 'No MCI declared.'}\nPatients: ${counts}. Transported ${totalSent()}; ${remainingTx()} awaiting transport.\nPositions: ${ICS_POSITIONS.filter(p => S.ics[p.id]).map(p => p.label + ' – ' + S.ics[p.id].who).join('; ') || 'none assigned'}.\nUnits: ${S.units.filter(u => u.status !== 'released').length} assigned (${unitsBy('onscene').length} on scene, ${unitsBy('staged').length} staged, ${unitsBy('enroute').length} en route, ${unitsBy('transporting').length} transporting).\nOpen requests: ${reqText}.\nStaging: ${I.staging || 'not set'}. Hazards: ${I.hazards.join(', ') || 'none noted'}.`;

  const fmt = rows => rows.map(([k, label, text]) => `<span class="k">${k}</span><b>${esc(label.toUpperCase())}</b> ${esc(text)}`).join('\n');
  const plain = rows => rows.map(([k, label, text]) => `${label}: ${text}`).join('\n');

  return [
    { title: 'Initial report · METHANE', when: 'First arriving officer to dispatch. Re-send if the picture changes a lot.', html: fmt(methane), text: plain(methane) },
    { title: 'Progress report · CAN', when: 'Every 10 to 15 minutes, or when asked for an update.', html: fmt(can), text: plain(can) },
    { title: 'Hospital MCI notification', when: 'Medical Communications to each receiving ED.', html: esc(hospLine), text: hospLine },
    { title: 'Command transfer briefing', when: 'Read to the officer taking over command, or paste into the after-action file.', html: esc(handoff), text: handoff },
  ];
}

/* =====================================================================
   Actions
   ===================================================================== */
function commit(msg, kind, fn, { toast = true } = {}) {
  undoSnap = JSON.stringify(S);
  fn();
  if (msg) S.log.push({ t: now(), kind, text: msg });
  save();
  render();
  if (toast && msg) showToast(msg, true);
}
function openSheet(name) { UI.sheet = name; UI.form = {}; render(); const first = sheetRoot.querySelector('.sheet'); if (first) first.focus?.(); }
function closeSheet() { UI.sheet = null; UI.form = {}; render(); }

function showToast(msg, canUndo) {
  clearTimeout(toastTimer);
  toastRoot.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${canUndo ? '<button data-act="undo">Undo</button>' : ''}</div>`;
  toastTimer = setTimeout(() => { toastRoot.innerHTML = ''; }, 5000);
}

const A = {
  view(id) { UI.view = id; saveUi(); render(); app.querySelector('.main')?.scrollTo?.(0, 0); },
  sheet(name) { openSheet(name); },
  close() { closeSheet(); },
  backdrop(_, el, e) { if (e.target === el) closeSheet(); },
  mode() { S.mode = S.mode === 'day' ? 'night' : 'day'; save(); render(); },
  'mode-set'(m) { S.mode = m; save(); render(); },
  undo() {
    if (!undoSnap) return;
    S = JSON.parse(undoSnap); undoSnap = null; save(); render(); showToast('Undone', false);
  },

  tri(arg) {
    const k = arg[0], d = arg[1] === '+' ? 1 : -1, c = cat(k);
    if (d < 0 && S.triage[k] <= (k === 'B' ? 0 : sentCat(k))) {
      showToast(S.triage[k] ? `Can't go below the ${sentCat(k)} already transported` : `No ${c.name} patients to remove`, false);
      return;
    }
    commit(`Triage ${d > 0 ? '+1' : '−1'} ${c.color} (${c.name}): now ${S.triage[k] + d}`, 'triage', () => { S.triage[k] += d; });
  },
  est(d) {
    const v = Math.max(0, (S.incident.est || 0) + Number(d));
    S.incident.est = v; save(); render();
  },
  bench(id) {
    const b = BENCHMARKS.find(x => x.id === id);
    if (S.bench[id]) commit(`Benchmark cleared: ${b.label}`, 'bench', () => { delete S.bench[id]; });
    else commit(`${b.label}`, 'bench', () => { S.bench[id] = now(); });
  },
  'mci-set'(lvl) {
    const L = Number(lvl);
    if (L === S.incident.mciLevel) return;
    commit(L ? `MCI declared: ${levelLabel(L)}` : 'MCI stood down', 'bench', () => {
      S.incident.mciLevel = L;
      if (L && !S.bench.mci) S.bench.mci = now();
    });
  },

  'f-set'(arg) {
    const i = arg.indexOf('='), k = arg.slice(0, i), v = arg.slice(i + 1);
    UI.form[k] = UI.form[k] === v && k !== 'cat' && k !== 'type' && k !== 'kind' && k !== 'status' && k !== 'lz' ? '' : v;
    if (k === 'cat') UI.form.n = 1;
    render();
  },
  'f-toggle'(arg) {
    const i = arg.indexOf('='), k = arg.slice(0, i), v = arg.slice(i + 1);
    const a = UI.form[k] = (UI.form[k] || []).slice();
    const j = a.indexOf(v); if (j >= 0) a.splice(j, 1); else a.push(v);
    render();
  },
  step(arg) {
    const [name, d, min, max] = arg.split(':');
    const path = name.split('.');
    let obj = UI.form; for (let i = 0; i < path.length - 1; i++) obj = obj[path[i]];
    const key = path[path.length - 1];
    const def = name === 'n' || name === 'qty' ? 1 : name === 'crew' ? 2 : 0;
    obj[key] = Math.min(Number(max), Math.max(Number(min), (obj[key] ?? def) + Number(d)));
    render();
  },

  'tx-with'(unitId) { openSheet('transport'); UI.form.unit = unitId; UI.form.cat = TX_CATS.find(k => remaining(k) > 0); UI.form.n = 1; render(); },
  'tx-save'() {
    const f = UI.form, u = unitById(f.unit), h = hosp(f.hosp), n = Math.min(f.n || 1, remaining(f.cat));
    if (!u || !h || !f.cat || n < 1) return;
    UI.sheet = null;
    commit(`${u.name} departed: ${n} ${cat(f.cat).name} → ${h.short}${f.tags ? ` (tag ${f.tags})` : ''}`, 'transport', () => {
      S.transports.push({ id: uid(), cat: f.cat, n, tags: (f.tags || '').trim(), unit: u.id, hosp: h.id, t: now() });
      u.status = 'transporting'; u.task = 'To ' + h.short; u.t = now();
    });
    UI.form = {};
  },

  'par-toggle'(id) { UI.form.par = UI.form.par || {}; UI.form.par[id] = !UI.form.par[id]; render(); },
  'par-all'() { UI.form.par = {}; S.units.filter(u => u.status === 'onscene' || u.status === 'staged').forEach(u => { UI.form.par[u.id] = true; }); render(); },
  'par-save'() {
    const units = S.units.filter(u => u.status === 'onscene' || u.status === 'staged');
    const ok = units.filter(u => UI.form.par && UI.form.par[u.id]);
    const missing = units.filter(u => !(UI.form.par && UI.form.par[u.id])).map(u => u.name);
    UI.sheet = null;
    commit(`PAR complete: ${ok.length} of ${units.length} units accounted for${missing.length ? '. NOT accounted: ' + missing.join(', ') : ''}`, 'par', () => { S.par.last = now(); });
    UI.form = {};
  },
  'par-int'(m) { S.par.interval = Number(m); save(); render(); },

  'unit-status'(arg) {
    const [id, st] = arg.split('='), u = unitById(id);
    if (!u || u.status === st) return;
    commit(`${u.name}: ${statusName(st)}`, 'units', () => { u.status = st; u.t = now(); if (st === 'released' || st === 'staged') u.task = ''; });
  },
  'unit-task'(arg) {
    const i = arg.indexOf('='), id = arg.slice(0, i), task = arg.slice(i + 1), u = unitById(id);
    if (!u || u.task === task) return;
    commit(task ? `${u.name} assigned: ${task}` : `${u.name}: assignment cleared`, 'units', () => { u.task = task; if (task && u.status !== 'onscene') { u.status = 'onscene'; u.t = now(); } });
  },
  'unit-remove'(id) {
    const u = unitById(id); if (!u) return;
    UI.sheet = null;
    commit(`${u.name} removed from the board`, 'units', () => { S.units = S.units.filter(x => x.id !== id); });
  },
  'unit-save'() {
    const f = UI.form, name = (f.name || '').trim().toUpperCase();
    if (!name) { showToast('Give the unit an ID first', false); document.getElementById('unit-name')?.focus(); return; }
    UI.sheet = null;
    commit(`${name} (${f.kind}) added: ${statusName(f.status)}`, 'units', () => {
      S.units.push({ id: uid(), name, kind: f.kind, agency: (f.agency || '').trim() || 'Mutual aid', crew: f.crew ?? 2, status: f.status, task: '', t: now() });
    });
    UI.form = {};
  },

  'req-save'() {
    const f = UI.form; if (!f.what) return;
    UI.sheet = null;
    commit(`Requested ${(f.qty || 1) > 1 ? (f.qty) + ' × ' : ''}${f.what}${f.note2 ? ' (' + f.note2 + ')' : ''}`, 'request', () => {
      S.requests.push({ id: uid(), what: f.what, qty: f.qty || 1, status: 'requested', t: now(), note: (f.note2 || '').trim() });
    });
    UI.form = {};
  },
  'req-next'(id) {
    const r = S.requests.find(x => x.id === id); if (!r) return;
    const i = REQ_FLOW.indexOf(r.status); if (i < 0 || i === REQ_FLOW.length - 1) return;
    const nx = REQ_FLOW[i + 1];
    commit(`${r.what}: ${reqStatusName(nx)}`, 'request', () => { r.status = nx; });
  },

  'ics-save'(id) {
    const who = (UI.form.who || '').trim(), p = ICS_POSITIONS.find(x => x.id === id);
    if (!who) { showToast('Enter a name or pick a crew', false); return; }
    UI.sheet = null;
    commit(`${p.label}: ${who}`, 'units', () => { S.ics[id] = { who, t: now() }; });
    UI.form = {};
  },
  'ics-clear'(id) {
    const p = ICS_POSITIONS.find(x => x.id === id);
    UI.sheet = null;
    commit(`${p.label} vacated`, 'units', () => { delete S.ics[id]; });
    UI.form = {};
  },

  'hosp-notify'(id) {
    const h = hosp(id);
    commit(`${h.short} notified`, 'note', () => { S.hospitals[id] = { ...(S.hospitals[id] || {}), notifiedAt: now() }; });
  },
  'hosp-save'(id) {
    const h = hosp(id), c = UI.form.cap;
    UI.sheet = null;
    commit(`${h.short} capacity: Red ${c.R}, Yellow ${c.Y}, Green ${c.G}`, 'note', () => { S.hospitals[id] = { ...(S.hospitals[id] || {}), cap: { ...c }, capAt: now() }; });
    UI.form = {};
  },

  'inc-save'() {
    const f = UI.form;
    UI.sheet = null;
    commit('Incident details updated', 'note', () => {
      for (const k of ['type', 'location', 'municipality', 'commandName', 'ic', 'staging', 'access', 'hazards', 'lz', 'lzLocation']) S.incident[k] = typeof f[k] === 'string' ? f[k].trim() : f[k];
    });
    UI.form = {};
  },
  'inc-new'() {
    const f = UI.form;
    undoSnap = JSON.stringify(S);
    S = blankState({ ...f, location: (f.location || '').trim(), commandName: (f.commandName || '').trim(), ic: (f.ic || '').trim() });
    S.log[0].text = `Command established${S.incident.commandName ? ': ' + S.incident.commandName : ''}${S.incident.ic ? ', ' + S.incident.ic : ''}`;
    UI.sheet = null; UI.form = {}; UI.view = 'board';
    save(); render(); showToast('New incident started. Clock running.', true);
  },
  'load-sample'() {
    undoSnap = JSON.stringify(S);
    S = sampleState(); UI.sheet = null; UI.form = {};
    save(); render(); showToast('Sample incident loaded', true);
  },

  'log-filter'(k) { UI.logFilter = k; render(); },
  'quick-note'(text) { commit(text, 'note', () => {}); },

  copy(i) {
    const s = radioScripts()[Number(i)];
    const done = () => showToast('Copied', false);
    const fallback = () => {
      const el = document.getElementById('script-' + i);
      const r = document.createRange(); r.selectNodeContents(el);
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      showToast('Selected. Use your copy command.', false);
    };
    try { navigator.clipboard.writeText(s.text).then(done, fallback); } catch (e) { fallback(); }
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  if (act === 'backdrop' && e.target !== el) return;
  if (A[act]) { e.preventDefault(); A[act](el.dataset.arg, el, e); }
  wake();
});
document.addEventListener('input', e => {
  const f = e.target.dataset && e.target.dataset.field;
  if (f) UI.form[f] = e.target.value;
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.dataset.form === 'note') {
    const text = (UI.form.note || '').trim();
    if (!text) return;
    UI.form.note = '';
    commit(text, 'note', () => {});
    document.getElementById('note-input')?.focus();
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && UI.sheet) closeSheet(); });

/* =====================================================================
   Clocks
   ===================================================================== */
function tick() {
  const t = now();
  const set = (k, v) => document.querySelectorAll(`[data-clock="${k}"]`).forEach(el => { if (el.textContent !== v) el.textContent = v; });
  set('now', hhmm(t));
  set('elapsed', dur(t - S.incident.dispatchAt));
  const due = S.par.last + S.par.interval * 60000, left = due - t;
  set('par', left >= 0 ? dur(left) : '+' + dur(-left));
  set('par-lbl', left >= 0 ? 'PAR due in' : 'PAR overdue');
  const b = document.getElementById('par-btn');
  if (b) { b.classList.toggle('due', left >= 0 && left < 120000); b.classList.toggle('over', left < 0); }
}

/* Keep the screen awake while the board is open, where the browser allows it. */
let lock = null;
async function wake() {
  try { if (!lock && navigator.wakeLock && document.visibilityState === 'visible') { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } } catch (e) { /* not granted */ }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { wake(); tick(); } });

/* =====================================================================
   Boot
   ===================================================================== */
S = load() || sampleState();
loadUi();
render();
setInterval(tick, 1000);
})();
</script>
