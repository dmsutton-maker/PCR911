/* =====================================================================
   Map (Leaflet). One map instance moves between the board corner and the
   full Map view, so it never reloads.
   ===================================================================== */
let MAP = null, mapKind = null;
const ML = {};
const mapBox = document.createElement('div');
mapBox.className = 'mapbox';
const mapPark = document.getElementById('map-park');
mapPark.appendChild(mapBox);
const NJ_ORTHO = 'https://maps.nj.gov/arcgis/rest/services/Basemap/Orthos_Natural_2020_NJ_WM/MapServer/tile/{z}/{y}/{x}';

const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const unpack = flat => { const out = []; for (let i = 0; i < flat.length; i += 2) out.push([flat[i] / 1e4, flat[i + 1] / 1e4]); return out; };
const insideSample = ll => !!(ll && SAMPLE_SCENE && L_ok() && L.latLngBounds(SAMPLE_SCENE.bounds).contains(ll));
const L_ok = () => typeof window.L !== 'undefined';
const roadLabel = n => n.replace('Garden State Pkwy', 'Garden State Parkway').replace('New Jersey Tpke', 'NJ Turnpike').replace(/^I- /, 'I-').replace(/^State (Rte|Hwy) /, 'Route ').replace(/^US Hwy /, 'US ');

function ensureMap() {
  if (MAP || !L_ok()) return;
  MAP = L.map(mapBox, { preferCanvas: true, zoomControl: true, attributionControl: true, minZoom: 8, maxZoom: 20, zoomSnap: 0.5, center: [40.27, -74.17], zoom: 10 });
  MAP.attributionControl.setPrefix(false);
  /* Leaflet draws vectors on a canvas that sits above image layers, so town fills get their own pane under the
     imagery (tiles are 200) and roads one above it. */
  MAP.createPane('towns').style.zIndex = 150;
  MAP.createPane('aerial').style.zIndex = 250;
  MAP.createPane('roads').style.zIndex = 300;
  const townCanvas = L.canvas({ padding: 0.3, pane: 'towns' });
  const roadCanvas = L.canvas({ padding: 0.3, pane: 'roads' });

  ML.vector = L.layerGroup().addTo(MAP);
  ML.roadLayer = L.layerGroup().addTo(MAP);
  if (GEO) {
    ML.towns = GEO.towns.map(t => L.polygon(t.r.map(unpack), { pane: 'towns', renderer: townCanvas, interactive: false, weight: t.m ? 1.2 : 0.6 }).addTo(ML.vector));
    ML.roads = GEO.roads.map(r => L.polyline(unpack(r.p), { pane: 'roads', renderer: roadCanvas, interactive: false, weight: r.k ? 3 : 1.6 }).addTo(ML.roadLayer));
    ML.labels = L.layerGroup(TOWNS.filter(t => t.home).map(t => L.marker(t.ll, { interactive: false, keyboard: false, icon: L.divIcon({ className: '', html: `<div class="town-label">${esc(t.name.replace(/ (Township|Borough|City|Village)$/, ''))}</div>`, iconSize: [0, 0] }) })));
    MAP.attributionControl.addAttribution('Boundaries & roads: US Census 2023');
  }
  if (SAMPLE_SCENE) ML.sample = L.imageOverlay(SAMPLE_SCENE.img, SAMPLE_SCENE.bounds, { pane: 'aerial', interactive: false, attribution: 'Aerial: NJ Office of GIS, 2020' });

  ML.live = L.tileLayer(NJ_ORTHO, { maxZoom: 20, maxNativeZoom: 20, attribution: 'Aerial: NJ Office of GIS, 2020', crossOrigin: false });
  ML.live.on('tileload', () => { if (UI.live !== 'ok') { UI.live = 'ok'; refreshChips(); syncRoads(); } });
  ML.live.on('tileerror', () => { if (UI.live === 'unknown') { UI.live = 'blocked'; refreshChips(); } });

  ML.pins = L.layerGroup().addTo(MAP);
  ML.hosp = L.layerGroup().addTo(MAP);

  MAP.on('zoomend', () => { syncLabels(); syncRoads(); });
  MAP.on('click', e => {
    if (!UI.pinMode) return;
    const k = UI.pinMode, ll = [+e.latlng.lat.toFixed(6), +e.latlng.lng.toFixed(6)];
    UI.pinMode = null;
    const field = k === 'scene' ? 'll' : k === 'staging' ? 'stagingLL' : 'lzLL';
    dispatch('pin', { field, ll }, `${k === 'scene' ? 'Scene' : k === 'staging' ? 'Staging' : 'LZ'} pinned at ${fmtLL(ll)}`, 'note');
  });
  styleMap();
  syncLayer();
}

function styleMap() {
  if (!MAP || !GEO) return;
  const land = css('--land'), home = css('--land-home'), edge = css('--town-edge'), major = css('--road-major'), road = css('--road');
  GEO.towns.forEach((t, i) => ML.towns[i].setStyle({ color: edge, fillColor: t.m ? home : land, fillOpacity: 1 }));
  GEO.roads.forEach((r, i) => ML.roads[i].setStyle({ color: r.k ? major : road, opacity: r.k ? 0.95 : 0.8 }));
}
function syncLayer() {
  if (!MAP) return;
  const sat = UI.mapLayer === 'sat';
  if (sat) { ML.live.addTo(MAP); if (ML.sample) ML.sample.addTo(MAP); }
  else { ML.live.remove(); if (ML.sample) ML.sample.remove(); }
  syncRoads();
}
/* Over imagery the simplified roads only add clutter once you are zoomed in to street level. */
function syncRoads() {
  if (!MAP || !ML.roadLayer) return;
  const show = UI.mapLayer !== 'sat' || MAP.getZoom() < 14;
  if (show && !MAP.hasLayer(ML.roadLayer)) ML.roadLayer.addTo(MAP);
  if (!show && MAP.hasLayer(ML.roadLayer)) ML.roadLayer.remove();
}
function syncLabels() {
  if (!MAP || !ML.labels) return;
  const show = MAP.getZoom() >= 11 && MAP.getZoom() <= 15;
  if (show && !MAP.hasLayer(ML.labels)) ML.labels.addTo(MAP);
  if (!show && MAP.hasLayer(ML.labels)) ML.labels.remove();
}
function pinIcon(cls, text, size) { return L.divIcon({ className: '', html: `<div class="pin ${cls}">${text}</div>`, iconSize: [size, size], iconAnchor: [size / 2, size / 2] }); }
function syncMarkers() {
  if (!MAP) return;
  const I = S.incident;
  ML.pins.clearLayers();
  if (DEV.me) L.marker(DEV.me.ll, { icon: pinIcon('me', '', 22), keyboard: false, title: 'You' }).addTo(ML.pins);
  if (I.lzLL) L.marker(I.lzLL, { icon: pinIcon('lz', 'LZ', 34), title: 'Landing zone' }).addTo(ML.pins);
  if (I.stagingLL) L.marker(I.stagingLL, { icon: pinIcon('staging', 'S', 34), title: 'Staging' }).addTo(ML.pins);
  if (I.ll) L.marker(I.ll, { icon: pinIcon('scene', 'SCENE', 40), title: 'Scene', zIndexOffset: 1000 }).addTo(ML.pins);
  COUNTY_STAGING.forEach(c => L.marker(c.ll, { icon: pinIcon('cstage', 'S', 30), title: c.name }).bindTooltip(`County staging: ${c.name}`, { direction: 'top', offset: [0, -14] }).addTo(ML.pins));
  C.cameras.filter(c => c.ll).forEach(c => L.marker(c.ll, { icon: pinIcon('cam', 'CAM', 30), title: c.name }).bindTooltip(`Camera: ${c.name}`, { direction: 'top', offset: [0, -14] }).on('click', () => openSheet('cam:' + c.id)).addTo(ML.pins));
  ML.hosp.clearLayers();
  filteredHospitals().forEach(h => L.marker(h.ll, { icon: pinIcon('hosp' + (h.trauma ? ' trauma' : ''), 'H', 28), title: h.name })
    .bindTooltip(`${h.short}${hospMiles(h) != null ? ' · ' + hospMiles(h).toFixed(1) + ' mi' : ''}`, { direction: 'top', offset: [0, -14] }).addTo(ML.hosp));
}
function refreshChips() {
  document.querySelectorAll('.mapcard.mini .mapctl.bl').forEach(el => { el.innerHTML = mapChips(); });
  if (UI.view === 'map') render();
}

function parkMap() { if (mapBox.parentNode !== mapPark) mapPark.appendChild(mapBox); }
function placeMap() {
  const slot = document.querySelector('[data-map-slot]');
  if (!slot) return;
  if (!L_ok()) { slot.innerHTML = '<div class="map-fallback">The map library did not load. Check the connection; everything else on the board still works.</div>'; return; }
  ensureMap();
  slot.appendChild(mapBox);
  const kind = slot.dataset.mapSlot;
  MAP.invalidateSize(false);
  syncMarkers();
  if (kind !== mapKind) { mapKind = kind; frameMap(kind); }
}
function frameMap(kind) {
  const I = S.incident;
  const center = sceneLL();
  if (kind === 'mini') { if (center) MAP.setView(center, I.ll ? 16.5 : 13); else MAP.setView([40.27, -74.17], 10); }
  else {
    const pts = [I.ll, I.stagingLL, I.lzLL].filter(Boolean);
    if (pts.length > 1) MAP.fitBounds(L.latLngBounds(pts).pad(0.6), { maxZoom: 17.5 });
    else if (center) MAP.setView(center, I.ll ? 17 : 13);
    else MAP.setView([40.27, -74.17], 10);
  }
  syncLabels();
}

const opt = (act, arg, pressed, label, cls = '') => `<button class="opt ${cls}" data-act="${act}" data-arg="${esc(arg)}" aria-pressed="${pressed ? 'true' : 'false'}">${label}</button>`;
const field = (label, inner) => `<div class="field"><span class="lbl">${label}</span>${inner}</div>`;
const stepper = (name, value, min = 0, max = 999, cls = '') => `<div class="stepper ${cls}"><button data-act="step" data-arg="${name}:-1:${min}:${max}" aria-label="Decrease">−</button><span class="v">${value}</span><button data-act="step" data-arg="${name}:1:${min}:${max}" aria-label="Increase">+</button></div>`;
const input = (id, fieldName, value, ph, extra = '') => `<input id="${id}" type="text" placeholder="${esc(ph)}" data-field="${fieldName}" value="${esc(value || '')}" autocomplete="off" ${extra}>`;

function transportSheet() {
  const f = UI.form, units = readyUnits(), k = f.cat;
  const o = sceneLL();
  const hs = HOSPITALS.slice().sort((a, b) => hospRank(a, k, o) - hospRank(b, k, o));
  const maxN = k ? remaining(k) : 1;
  return {
    title: 'Log a transport',
    body: `
      ${field('Category', `<div class="opt-grid">${TX_CATS.map(c => opt('f-set', 'cat=' + c, k === c, `${cat(c).color} · ${cat(c).name} <small>${remaining(c)} left</small>`, 'tall cat-' + c)).join('')}</div>`)}
      <div class="grid2">
        ${field('Patients on this unit', stepper('n', f.n || 1, 1, Math.max(1, maxN)))}
        ${field('Triage tag number', input('tx-tag', 'tags', f.tags, 'Optional', 'inputmode="numeric"'))}
      </div>
      ${field('Age group · optional', `<div class="chips">${['Adult', 'Child', 'Infant'].map(a => opt('f-set', 'age=' + a, f.age === a, a, 'small')).join('')}</div>`)}
      ${field('Unit', units.length ? `<div class="opt-grid">${units.map(u => opt('f-set', 'unit=' + u.id, f.unit === u.id, `${kindTag(u.kind)} ${esc(u.name)}`)).join('')}</div>` : '<div class="empty">No transport units are on scene or staged.</div>')}
      ${field('Destination · nearest and best fit first', `<div class="opt-grid wide">${hs.map(h => {
        const cap = hospCap(h.id), c = k && cap ? cap[k] : null, s = k ? hospSent(h.id, k) : 0;
        const left = c != null ? c - s : null, mi = o ? miles(o, h.ll) : null, ed = hospState(h.id).ed;
        const exempt = (k === 'R' && h.trauma) || (f.burn && h.tags.includes('burn')), live = liveEd(h);
        const capTxt = liveDiverted(live) && !exempt ? `<span class="crit-t">${esc(live.status)}${live.reason ? ' · ' + esc(live.reason) : ''}</span>` : isDivert(ed) && !exempt ? `<span class="crit-t">${esc(ed)}</span>` : left == null ? (live ? `ED ${esc(live.status.toLowerCase())}` : 'capacity not reported') : left > 0 ? `${left} ${cat(k).color} open` : '<span class="crit-t">at capacity</span>';
        return opt('f-set', 'hosp=' + h.id, f.hosp === h.id, `${esc(h.short)}${mi != null ? ` · ~${estMin(mi)} min` : ''}<small>${capTxt}${k === 'R' && h.trauma ? ' · ' + esc(h.trauma) : ''}</small>${capPills(h, k)}`, 'tall');
      }).join('')}</div>`)}`,
    foot: `<button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="tx-save" ${k && f.unit && f.hosp ? '' : 'disabled'}>Log departure</button>`,
  };

/* Red, yellow and green at a glance: what each hospital can still take, in its triage color. */
function capPills(h, k) {
  const cap = hospCap(h.id);
  return `<span class="cps">${TX_CATS.map(c => {
    const s = hospSent(h.id, c), m = cap ? cap[c] : null, left = m != null ? Math.max(0, m - s) : null;
    return `<span class="cp c-${c}${k === c ? ' sel' : ''}${left === 0 ? ' zero' : ''}">${cat(c).color} ${left == null ? (s ? s + ' sent' : '—') : left + ' open'}</span>`;
  }).join('')}</span>`;
}
function hospRank(h, k, o) {
  let r = o ? estMin(miles(o, h.ll)) : 60;
  if (k === 'R' && h.trauma) r -= 30;
  const cap = hospCap(h.id), ed = hospState(h.id).ed;
  if (k && cap && hospSent(h.id, k) >= cap[k]) r += 200;
  if (isDivert(ed) && !(k === 'R' && h.trauma)) r += 300;
  if (edAvoid(h, k, UI.form.burn)) r += 300;
  if (liveEd(h) && /closed/i.test(liveEd(h).status)) r += 1000;
  if ((UI.form.age === 'Child' || UI.form.age === 'Infant') && (h.tags || []).includes('peds')) r -= 15;
  return r;
}

/* Paste a list of units, one per line: "29-56 BLS Squad 29" or "MICU 9, ALS, RWJBH". */
function parseUnits(text) {
  const kinds = UNIT_KINDS.map(k => k.k);
  const guess = (id, rest) => {
    const all = (id + ' ' + rest).toUpperCase();
    const explicit = kinds.find(k => new RegExp(`(^|[\\s,;|])${k}($|[\\s,;|])`).test(all));
    if (explicit) return explicit;
    if (/^(M|MEDIC|MICU)[-\s]?\d/.test(id.toUpperCase()) || /^59-/.test(id) || /MEDIC|PARAMEDIC|MICU/.test(all)) return 'ALS';
    if (/^\d{2}-5[0-4]$/.test(id)) return 'SUP';
    if (/^\d{2}-55$/.test(id) || /^(RV|FR)[-\s]?\d/.test(id.toUpperCase()) || /RESPONSE|FLY ?CAR/.test(all)) return 'RV';   // county pattern: 50 captain/chief, 51-54 officers
    if (/^(E|ENG|ENGINE)[-\s]?\d/.test(id.toUpperCase())) return 'ENG';
    if (/^(L|T|TRK|TRUCK|LADDER|TOWER)[-\s]?\d/.test(id.toUpperCase())) return 'TRK';
    if (/^(R|RES|RESCUE)[-\s]?\d/.test(id.toUpperCase())) return 'RES';
    if (/HAZ/.test(all)) return 'HAZ';
    return 'BLS';
  };
  return text.split(/\n+/).map(l => l.trim()).filter(Boolean).map(line => {
    const parts = line.split(/[,\t;|]+/).map(s => s.trim()).filter(Boolean);
    let id, rest;
    if (parts.length > 1) { id = parts[0]; rest = parts.slice(1).join(' '); }
    else { const m = line.match(/^(\S+(?:\s\d[\w-]*)?)\s*(.*)$/); id = m[1]; rest = m[2]; }
    const kind = guess(id, rest);
    const agency = rest.split(/\s+/).filter(w => w.toUpperCase() !== kind).join(' ').trim();
    return { name: id.toUpperCase(), kind, agency: agency || 'Mutual aid' };
  });
}

        <button class="opt tall" data-act="load-sample">Load the sample incident<small>Bus crash, Ocean Township, 19 patients</small></button>
      </div>
      <div class="note"><b>Prototype.</b> ${IN_CLAUDE ? 'Tablets that open this same page share one board through it.' : RELAY ? `Tablets signed in to ${esc(RELAY.org || 'the squad')} share one board through the squad's relay.` : 'This tablet keeps its own board, saved in this browser, until it is signed in to the squad.'} Nothing is sent to CAD, EMTrack, or anyone else. Use practice data.</div>`,
    foot: `<button class="btn primary" data-act="close">Done</button>`,
  };
}

/* =====================================================================
   Shared boards. Every change is an event; each tablet keeps its own list
   of events and every tablet replays all of them over the board's starting
   state. Two tablets tapping at once can't overwrite each other, counts add
   up, and undo takes back one event.

   There are two boards, each its own stream of events: the MCI incident
   (scene command) and the everyday shift (supervisor).
   ===================================================================== */
let seq = 0;
const byTime = (a, b) => a.t - b.t || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);

function Stream(name, opts) {
  Object.assign(this, opts);              // root, pointer, key, R, label
  this.name = name;
  this.base = null; this.events = new Map(); this.state = null;
  this.id = null; this.shared = false; this.unsub = null;
  this.written = {}; this.writing = false; this.dirty = false; this.error = ''; this.booted = false;
}
Stream.prototype.undone = function () { return new Set([...this.events.values()].filter(e => e.type === 'undo').map(e => e.p.target)); };
Stream.prototype.rebuild = function () {
  const st = JSON.parse(JSON.stringify(this.base)), undone = this.undone();
  for (const e of [...this.events.values()].sort(byTime)) {
    if (undone.has(e.id)) continue;
    if (e.type !== 'undo' && this.R[e.type]) { try { this.R[e.type](st, e.p); } catch (err) { console.warn('Skipped an event that no longer applies', e.type, err); } }
    if (e.text) st.log.push({ t: e.t, kind: e.kind, text: e.text, role: e.role });
  }
  this.state = st;
  if (this.name === 'incident') S = st; else SH = st;
};
Stream.prototype.saveLocal = function () { write(this.key, this.base); write(K.ev(this.base.id), [...this.events.values()]); };
Stream.prototype.load = function (fallback) {
  const b = read(this.key);
  this.base = b && b.id ? b : fallback();
  this.events.clear();
  (read(K.ev(this.base.id)) || []).forEach(e => this.events.set(e.id, e));
  this.rebuild();
};
Stream.prototype.dispatch = function (type, p, text, kind = 'note', { toast = true } = {}) {
  const e = { id: `${DEV.id}.${Date.now().toString(36)}.${(seq++).toString(36)}`, dev: DEV.id, role: DEV.role, t: now(), type, p, text: text || '', kind };
  this.events.set(e.id, e);
  this.rebuild(); this.saveLocal(); render();
  if (toast && text) showToast(text, e.id);
  Sync.push(this);
  return e;
};
Stream.prototype.start = function (base) {
  this.base = base; this.events.clear(); this.rebuild(); this.saveLocal();
  if (Sync.db) Sync.announce(this);
};
Stream.prototype.mine = function () { return [...this.events.values()].filter(e => e.dev === DEV.id).sort(byTime); };
Stream.prototype.pending = function () {
  const mine = this.mine();
  let n = 0;
  for (let i = 0; i * CHUNK < mine.length; i++) n += Math.min(CHUNK, mine.length - i * CHUNK) - (this.written[`${this.id}:${i}`] || 0);
  return n;
};

const unitIn = (st, id) => st.units.find(u => u.id === id);
/* Reducers: how each event changes the incident. They depend only on the event, never on the clock. */
const R = {
  tri(st, p) { st.triage[p.k] = Math.max(0, (st.triage[p.k] || 0) + p.d); },
  retriage(st, p) { if ((st.triage[p.from] || 0) > 0) { st.triage[p.from]--; st.triage[p.to] = (st.triage[p.to] || 0) + 1; } },
  est(st, p) { st.incident.est = p.v; },
  bench(st, p) { if (p.on) st.bench[p.id] = p.at; else delete st.bench[p.id]; },
  mci(st, p) { st.incident.mciLevel = p.L; if (p.L >= 2 && !st.bench.mci) st.bench.mci = p.at; if (st.fresh && p.L) { st.fresh = false; st.incident.dispatchAt = p.at; } },
  method(st, p) { st.method = p.m; if (p.m !== 'SALT' && st.triage.X) { st.triage.B = (st.triage.B || 0) + st.triage.X; st.triage.X = 0; } },
  white(st, p) { st.white = p.on; },
  pin(st, p) { st.incident[p.field] = p.ll; },
  staging(st, p) { st.incident.staging = p.staging; st.incident.stagingLL = p.ll; if (!st.bench.staging) st.bench.staging = p.at; },
  tx(st, p) {
    st.transports.push({ id: p.id, cat: p.cat, n: p.n, tags: p.tags, age: p.age, unit: p.unit, hosp: p.hosp, t: p.at });
    const u = unitIn(st, p.unit);
    if (u) { u.status = 'transporting'; u.task = 'To ' + ((hosp(p.hosp) || {}).short || 'hospital'); u.t = p.at; }
  },
  par(st, p) { st.par.last = p.at; },
  parInterval(st, p) { st.par.interval = p.m; },
  unitStatus(st, p) { const u = unitIn(st, p.id); if (!u) return; u.status = p.st; u.t = p.at; if (p.clearTask) u.task = ''; },
  unitTask(st, p) { const u = unitIn(st, p.id); if (!u) return; u.task = p.task; if (p.task && u.status !== 'onscene') { u.status = 'onscene'; u.t = p.at; } },
  unitCrew(st, p) { const u = unitIn(st, p.id); if (u) u.crew = p.crew; },
  unitRemove(st, p) { st.units = st.units.filter(x => x.id !== p.id); },
  unitAdd(st, p) { p.units.forEach(u => { if (!st.units.some(x => x.name === u.name)) st.units.push({ ...u }); }); },
  personAdd(st, p) { if (!st.people.some(x => x.id === p.person.id)) st.people.push({ ...p.person }); },
  personEdit(st, p) { const x = st.people.find(q => q.id === p.id); if (x) Object.assign(x, p.fields); },
  personOut(st, p) { const x = st.people.find(q => q.id === p.id); if (x) x.out = p.at; },
  reqAdd(st, p) { st.requests.push({ ...p.req }); },
  reqStatus(st, p) { const r = st.requests.find(x => x.id === p.id); if (r) r.status = p.st; },
  icsSet(st, p) { st.ics[p.pos] = { who: p.who, t: p.at }; },
  icsClear(st, p) { delete st.ics[p.pos]; },
  hospNotify(st, p) { st.hospitals[p.id] = { ...(st.hospitals[p.id] || {}), notifiedAt: p.at }; },
  hospReport(st, p) { st.hospitals[p.id] = { ...(st.hospitals[p.id] || {}), cap: p.cap, beds: p.beds, ed: p.ed, capAt: p.at }; },
  incEdit(st, p) { Object.assign(st.incident, p.fields); if (st.fresh && p.at) { st.fresh = false; st.incident.dispatchAt = p.at; } },
  note() {},
};

/* Reducers for the everyday shift board. */
const callIn = (st, id) => st.calls.find(c => c.id === id);
const RS = {
  respAdd(st, p) {
    const c = callIn(st, p.id); if (!c) return;
    c.resp = c.resp || [];
    const again = c.resp.find(r => r.pid === p.r.pid);
    if (again) { if (again.st === 'clear') { again.st = 'enroute'; again.enroute = p.at; again.via = p.r.via; } return; }
    c.resp.push({ ...p.r, st: 'enroute', t: p.at, enroute: p.at });
    if (!c.times.enroute) c.times.enroute = p.at;
    if (c.status === 'disp') c.status = 'enroute';
  },
  respStep(st, p) {
    const c = callIn(st, p.id), r = c && (c.resp || []).find(x => x.pid === p.pid); if (!r) return;
    r.st = p.st; r[p.st] = p.at;
    if (p.st === 'onscene') {                      // the first member to arrive puts the call on scene
      if (!c.times.onscene) c.times.onscene = p.at;
      if (c.status === 'disp' || c.status === 'enroute') { c.status = 'onscene'; if (!c.times.enroute) c.times.enroute = p.at; }
    }
  },
  callReq(st, p) { const c = callIn(st, p.id); if (!c) return; c.reqs = c.reqs || []; c.reqs.push({ rid: p.rid, what: p.what, st: 'requested', t: p.at }); },
  callReqStep(st, p) { const c = callIn(st, p.id), q = c && (c.reqs || []).find(x => x.rid === p.rid); if (q) { q.st = p.st; q[p.st] = p.at; } },
  unitStatus(st, p) { const u = unitIn(st, p.id); if (u) { u.status = p.st; u.since = p.at; u.note = p.note || ''; } },
  unitAdd(st, p) { p.units.forEach(u => { if (!st.units.some(x => x.name === u.name)) st.units.push({ ...u }); }); },
  callAdd(st, p) { st.calls.push({ ...p.call }); },
  callStep(st, p) { const c = callIn(st, p.id); if (!c) return; c.status = p.st; c.times[p.st] = p.at; if (p.hosp) c.hosp = p.hosp; },
  callUnit(st, p) { const c = callIn(st, p.id); if (c) c.unit = p.unit; },
  callClose(st, p) { const c = callIn(st, p.id); if (!c) return; c.status = 'clear'; c.times.clear = p.at; c.outcome = p.outcome; c.mutualAid = p.ma || ''; },
  crewIn(st, p) { if (!st.crew.some(x => x.id === p.person.id)) st.crew.push({ ...p.person }); },
  crewEdit(st, p) { const x = st.crew.find(q => q.id === p.id); if (x) Object.assign(x, p.fields); },
  crewOut(st, p) { const x = st.crew.find(q => q.id === p.id); if (x) x.out = p.at; },
  note() {},
};

const INC = new Stream('incident', { root: 'mci', pointer: 'now/incident', key: NS + 'incident', R, label: 'incident' });
const SHIFT = new Stream('shift', { root: 'days', pointer: 'now/day', key: NS + 'shift', R: RS, label: 'supervisor board' });
const STREAMS = [INC, SHIFT];
const dispatch = (...a) => INC.dispatch(...a);
const sdispatch = (...a) => SHIFT.dispatch(...a);
const streamOfView = () => (UI.view === 'shift' || UI.view === 'member' ? SHIFT : INC);

/* =====================================================================
   Sync between tablets, through this page's shared store.

   now/incident, now/day                  which incident and which day's board every tablet follows
   mci/<id>, days/<id>                    each one's starting state
   …/<id>/devices/<tablet>~<n>            that tablet's events, written only by it
   squad/config                           squad, unit roster, members, settings, extra numbers

   (Before the clean start these were live/…, incidents/…, shifts/… and
   config/agency; boards stored there are left behind.)

   Without the store (signed out, or the page opened somewhere else) the
   boards run on this tablet alone.
   ===================================================================== */
const CONFIG_DOC = 'squad/config';
const STOP_CODES = ['revoked', 'not_granted', 'capability_disabled', 'capability_removed'];
const CHUNK = 300;   // events per document, well under the store's 256 KiB per document
const Sync = {
  db: null, room: null, state: 'local', peers: [], cfgWriting: null,

  async start() {
    const use = IN_CLAUDE ? n => window.claude.use(n) : relayConn ? relayConn.use : null;
    if (!use) return;
    this.state = 'connecting'; syncChip();
    let db = null;
    try { db = await use('db'); } catch (e) { db = null; }
    if (!db) { this.state = 'local'; syncChip(); return; }
    this.db = db; this.state = 'ready';
    STREAMS.forEach(str => db.doc(str.pointer).onSnapshot(s => this.onPointer(str, s), e => this.stop(e)));
    db.doc(CONFIG_DOC).onSnapshot(s => this.onConfig(s), () => {});
    syncChip();
    try {
      const room = await use('room');
      if (room) {
        this.room = room;
        room.presence({ role: DEV.role, dev: DEV.id }).catch(() => {});
        room.onPeers(ch => { this.peers = ch.peers; syncChip(); }, () => { this.room = null; this.peers = []; syncChip(); });
      }
    } catch (e) { this.room = null; }
  },

  onPointer(str, snap) {
    const d = snap.exists ? snap.data() : null, id = d && (d.id || d.incident);
    const booted = str.booted;
    str.booted = true;
    if (!id) { syncChip(); if (str === SHIFT) maybeNewDay(); return; }
    if (id === str.id) return;
    this.follow(str, id, booted);
  },

  async follow(str, id, announce) {
    str.id = id;
    if (str.unsub) { str.unsub(); str.unsub = null; }
    if (!str.base || str.base.id !== id) {
      let snap;
      try { snap = await this.db.doc(`${str.root}/${id}`).get(); } catch (e) { return this.fail(str, e); }
      if (!snap.exists || str.id !== id) return;
      const was = str.base && str.base.id;
      str.base = snap.data().base;
      str.events.clear();
      (read(K.ev(id)) || []).forEach(e => str.events.set(e.id, e));
      if (str === INC) { UI.sheet = null; UI.form = {}; mapKind = null; }
      str.rebuild(); str.saveLocal(); render();
      showToast(announce ? (str === SHIFT ? (/^day-/.test(was || '') && /^day-/.test(id) ? 'The supervisor board turned over to a new day.' : 'This tablet now shows the supervisor board the other tablets share.') : `Another tablet started a new ${str.label}. This board now follows it.`) : `Joined the live ${str.label}.`, false);
    }
    str.written = {};
    if (str === SHIFT) setTimeout(maybeNewDay, 1500);   // a tablet opening on a new day turns the shared board over
    str.unsub = this.db.collection(`${str.root}/${id}/devices`).onSnapshot(qs => {
      let changed = false;
      qs.docs.forEach(d => {
        const b = d.data();
        ((b && b.events) || []).forEach(e => { if (!str.events.has(e.id)) { str.events.set(e.id, e); changed = true; } });
      });
      if (changed) { str.rebuild(); str.saveLocal(); if (!UI.sheet || str === streamOfView()) render(); }
    }, e => this.stop(e));
    str.shared = true; syncChip();
    this.flush(str);
  },

  /* Make this tablet's board the one every tablet follows. */
  async announce(str) {
    if (!this.db) return;
    const id = str.base.id;
    str.sharing = true; syncChip();
    try {
      await this.db.doc(`${str.root}/${id}`).set({ base: str.base, createdAt: now(), by: DEV.id });
      str.id = id;
      await this.db.doc(str.pointer).set({ id, at: now(), by: DEV.id });
      str.sharing = false;
      this.follow(str, id, false);
    } catch (e) { str.sharing = false; this.fail(str, e); }
  },

  push(str) {
    if (!this.db) return;
    if (!str.shared || str.id !== str.base.id) return str.sharing ? null : this.announce(str);
    return this.flush(str);
  },

  /* One write at a time to each document; a burst of taps becomes one write. */
  async flush(str) {
    if (!this.db || !str.shared || !str.id) return;
    if (str.writing) { str.dirty = true; return; }
    str.writing = true;
    try {
      do {
        str.dirty = false;
        const id = str.id, mine = str.mine();
        for (let i = 0; i * CHUNK < mine.length; i++) {
          const part = mine.slice(i * CHUNK, (i + 1) * CHUNK), key = `${id}:${i}`;
          if (str.written[key] === part.length) continue;
          await this.db.doc(`${str.root}/${id}/devices/${DEV.id}~${i}`).set({ dev: DEV.id, role: DEV.role, events: part, at: now() });
          str.written[key] = part.length;
        }
      } while (str.dirty);
      str.error = '';
    } catch (e) { this.fail(str, e); }
    str.writing = false;
    syncChip();
  },
  flushAll() { STREAMS.forEach(str => { if (str.shared) this.flush(str); else if (str.error) this.announce(str); }); },

  fail(str, e) {
    const code = (e && e.code) || 'unavailable';
    if (STOP_CODES.includes(code)) return this.stop(e);
    str.error = code;
    if (code === 'quota_exceeded') showToast(str === SHIFT ? `The shared supervisor board is full. It starts fresh at ${DAY_STARTS} AM.` : `The shared board is full. Start a new ${str.label} to keep sharing.`, false);
    clearTimeout(str.retry);
    str.retry = setTimeout(() => (str.shared ? this.flush(str) : this.announce(str)), 4000 + Math.random() * 4000);
    syncChip();
  },
  stop() { this.state = 'local'; this.db = null; this.peers = []; STREAMS.forEach(s => { s.shared = false; }); syncChip(); },

  onConfig(snap) {
    if (!snap.exists) return;
    C = migrateConfig({ ...defaultConfig(), ...snap.data() });
    write(K.cfg, C);
    if (!UI.sheet) render();
  },
  pushConfig() {
    if (!this.db) return;
    const go = () => this.db.doc(CONFIG_DOC).set(JSON.parse(JSON.stringify(C))).catch(() => {});
    this.cfgWriting = (this.cfgWriting || Promise.resolve()).then(go);
  },
  setRole() { if (this.room) this.room.presence({ role: DEV.role, dev: DEV.id }).catch(() => {}); },
  tablets() { return this.peers.filter(p => p.kind !== 'agent'); },
};

function syncChipHtml() {
  if (DEMO && !IN_CLAUDE) return '<span class="tag sample" id="sync-chip">Practice · not shared</span>';
  const str = streamOfView(), n = Sync.tablets().length;
  if (!IN_CLAUDE && Sync.state === 'local') return planEnded()
    ? `<button class="tag suggest" id="sync-chip" data-act="sheet" data-arg="connect">${RELAY.plan && RELAY.plan.tier === 'trial' ? 'Trial ended' : 'Sharing off'} · this tablet only</button>`
    : `<button class="tag" id="sync-chip" data-act="sheet" data-arg="connect">${RELAY ? 'Sign in again to share' : 'Share with other tablets'}</button>`;
  if (relayConn && Sync.state === 'ready' && !relayConn.isOpen()) return `<button class="tag suggest" id="sync-chip" data-act="sheet" data-arg="connect">Reconnecting…${str.pending() ? ' · ' + str.pending() + ' waiting' : ''}</button>`;
  if (Sync.state === 'connecting' || str.sharing) return `<span class="tag" id="sync-chip">Connecting…</span>`;
  if (Sync.state === 'ready' && str.error) return `<button class="tag suggest" id="sync-chip" data-act="sheet" data-arg="role">Sync paused · ${str.pending()} waiting</button>`;
  if (Sync.state === 'ready' && str.shared) return `<button class="tag live" id="sync-chip" data-act="sheet" data-arg="role">● Live${n ? ' · ' + plural(n, 'tablet') : ''}</button>`;
  if (Sync.state === 'ready') return `<button class="tag" id="sync-chip" data-act="share">Share this board</button>`;
  return `<button class="tag" id="sync-chip" data-act="sheet" data-arg="role">This tablet only</button>`;
}
function syncChip() { const el = document.getElementById('sync-chip'); if (el) el.outerHTML = syncChipHtml(); }

function startIncident(base, msg) {
  UI.sheet = null; UI.form = {}; mapKind = null;
  INC.start(base);
  UI.view = DEV.role === 'supervisor' ? 'board' : homeView();
  render(); showToast(msg, false);
}

/* =====================================================================
   Shift board: the supervisor's view of everyday calls.
   ===================================================================== */
const CALL_TYPES = ['Sick person', 'Fall', 'Breathing problem', 'Chest pain', 'Stroke', 'Unconscious / fainting', 'Seizure', 'Overdose', 'Psych / behavioral', 'Motor vehicle crash', 'Lift assist', 'Fire standby', 'Other'];
const STEPS = ['disp', 'enroute', 'onscene', 'transport', 'hospital', 'clear'];
const STEP_SHORT = { disp: 'Disp', enroute: 'En rt', onscene: 'Scene', transport: 'Trans', hospital: 'Hosp' };
const STEP_NAMES = { disp: 'Dispatched', enroute: 'En route', onscene: 'On scene', transport: 'Transporting', hospital: 'At hospital', clear: 'Clear' };
const CALL_SOURCES = ['Our hotline', 'County Communications', 'Mutual aid request'];
const CALL_REQS = ['ALS', 'Ambulance', 'Mutual aid ambulance', 'Sheriff MedStar', 'Police', 'Fire', 'Supervisor'];
const OUTCOMES = ['Transported', 'Refusal (RMA)', 'Lift assist / no transport', 'No patient found', 'Cancelled', 'Mutual aid covered'];
const OOS_REASONS = ['Mechanical', 'Restocking', 'Cleaning', 'No crew', 'Fuel', 'Other'];
const NO_ENROUTE_WARN = 5 * 60000;   // dispatched with nobody en route
const WALL_WARN = 30 * 60000;        // at the hospital, waiting to offload
const CALL_TO_INCIDENT = { 'Motor vehicle crash': 'Motor vehicle crash', 'Fire standby': 'Fire / smoke', 'Overdose': 'Hazmat / CO' };

/* The supervisor's board has no shifts to start. It is one board per day, and
   the day turns over by itself at DAY_STARTS, carrying units, crew still on
   duty and any open call to the next one. Every tablet names a day's board the
   same way, so two tablets turning the day over at once land on the same board. */
const DAY_STARTS = 6;   // hours: the board's day runs 6 AM to 6 AM, like most EMS shifts
const dayKey = t => { const d = new Date(t - DAY_STARTS * 3600000); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const dayStart = t => { const d = new Date(t - DAY_STARTS * 3600000); d.setHours(DAY_STARTS, 0, 0, 0); return d.getTime(); };
function blankShift(t = now()) {
  return {
    v: 1, id: 'day-' + dayKey(t), day: dayKey(t), kind: 'shift', startedAt: t, sample: false,
    units: C.roster.map(r => ({ id: uid(), name: r.name, kind: r.kind, status: 'in', since: t, note: '' })),
    calls: [], crew: [],
    log: [{ t, kind: 'note', text: `${C.agency.name} · ${new Date(t).toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' })}` }],
  };
}
function nextDay(prev, t = now()) {
  const b = blankShift(t);
  if (prev.units.length) b.units = JSON.parse(JSON.stringify(prev.units));
  b.crew = JSON.parse(JSON.stringify(prev.crew.filter(p => !p.out)));
  b.calls = JSON.parse(JSON.stringify(prev.calls.filter(c => c.status !== 'clear')));
  const carried = [b.crew.length ? plural(b.crew.length, 'member') + ' still on duty' : '', b.calls.length ? plural(b.calls.length, 'open call') : ''].filter(Boolean);
  if (carried.length) b.log.push({ t, kind: 'note', text: `Carried over from ${dayKey(prev.startedAt)}: ${carried.join(', ')}` });
  return b;
}
let turningDay = false;
function maybeNewDay() {
  const t = now();
  // Only ever forward: a tablet whose clock is behind must not drag the squad back to an older day's board.
  if (!SH || SH.sample || turningDay || dayKey(t) <= (SH.day || dayKey(SH.startedAt))) return;
  // A tablet that was closed for days must not turn yesterday's stale copy
  // into today's board; wait to hear what the other tablets have.
  if (Sync.state === 'connecting' || (Sync.state === 'ready' && (!SHIFT.booted || (SHIFT.id && !SHIFT.shared)))) return;
  // Calls still running at 6 AM finish on the old day's board, unless they run past noon.
  if (SH.calls.some(c => c.status !== 'clear') && t - dayStart(t) < 6 * 3600000) return;
  const next = nextDay(SH, t);
  const begin = () => { SHIFT.start(next); render(); };
  if (!Sync.db) return begin();
  turningDay = true;
  Sync.db.doc(`${SHIFT.root}/${next.id}`).get()

    .catch(() => {})
    .finally(() => { turningDay = false; });

    const c = SH.calls.find(x => x.id === id), name = (UI.form.rname || '').trim(), cert = UI.form.rcert || 'EMT'; if (!c) return;
    if (!name) { showToast('Type their name, or pick a member', false); document.getElementById('resp-name')?.focus(); return; }

  },
  'resp-step'(arg) {

    const r = c && (c.resp || []).find(x => x.pid === pid); if (!r) return;
    const nx = r.st === 'enroute' ? 'onscene' : 'clear';
    sdispatch('respStep', { id, pid, st: nx, at: now() }, `${r.name} ${nx === 'onscene' ? 'on scene' : 'clear'}: ${c.address}`, 'people');
  },
  'call-req'(arg) {
    const i = arg.indexOf('='), id = arg.slice(0, i), what = arg.slice(i + 1), c = SH.calls.find(x => x.id === id); if (!c) return;

  },
  'req-step'(arg) {

    sdispatch('callReqStep', { id, rid, st: 'onscene', at: now() }, `${q.what} on scene: ${c.address}`, 'request');

  'call-save'() {

    sdispatch('callClose', { id, outcome: 'Transported', at: now() }, `${c.unit || 'Unit'} back in service after ${c.address}`, 'units');
  },
  'call-unit'(arg) {

    render();

  'sunit-status'(arg) {
    const [id, st] = arg.split('='), u = SH.units.find(x => x.id === id); if (!u || u.status === st) return;
    sdispatch('unitStatus', { id, st, at: now(), note: '' }, `${u.name} ${st === 'in' ? 'in service' : 'out of service'}`, 'units');
  },
  'sunit-oos'(arg) {
    const i = arg.indexOf('='), id = arg.slice(0, i), why = arg.slice(i + 1), u = SH.units.find(x => x.id === id); if (!u) return;
    sdispatch('unitStatus', { id, st: 'oos', at: now(), note: why }, `${u.name} out of service: ${why.toLowerCase()}`, 'units');
  },
  'crew-save'(id) {
    const f = UI.form, num = memNum(f.num), name = (f.name || '').trim();
    if (!num && !name) { showToast('Enter a member number or a name', false); return; }
    if (!id && SH.crew.some(p => !p.out && p.num && p.num === num)) { showToast(`#${num} is already on duty`, false); return; }
    UI.sheet = null; UI.form = {};
    if (id) sdispatch('crewEdit', { id, fields: { num, name, cert: f.cert, unit: f.unit || '' } }, `${name}: ${f.unit || 'no unit'}`, 'people');

      sdispatch('crewIn', { person: { id: uid(), num, name, cert: f.cert, unit: f.unit || '', t: now() } }, `On duty: #${num || '?'} ${name} (${f.cert})${f.unit ? ' on ' + f.unit : ''}`, 'people');
    }
  },
  'crew-out'(id) {
    const p = SH.crew.find(x => x.id === id); if (!p) return;
    UI.sheet = null; UI.form = {};
    sdispatch('crewOut', { id, at: now() }, `Off duty: #${p.num} ${p.name}`, 'people');
  },
  'shift-new'() {
    UI.sheet = null; UI.form = {};
    SHIFT.start(blankShift());
    if (UI.view !== 'member') UI.view = 'shift';
    render();
    showToast('Sample cleared', false);
  },
};

/* =====================================================================
   Squad sharing for the web address. Outside Claude, the board shares
   through the squad's own relay (server/worker.js): a WebSocket to a small
   document store with the same shape as the one Claude provides, so the
   sync code above runs unchanged on either.
   ===================================================================== */
const BAKED_RELAY_URL = "";
const RELAY_KEY = 'sc3:relay';
let RELAY = DEMO ? null : read(RELAY_KEY);   // { url, token, name, org, role } once this tablet has joined
const relayBase = u => String(u || '').trim().replace(/\/+$/, '');

function relayClient(url, token) {

async function relayCall(path, body, headers = {}) {
  const url = relayBase(UI.form.rurl || (RELAY && RELAY.url) || BAKED_RELAY_URL);
  if (!/^https?:\/\//i.test(url)) throw new Error('Enter the relay address, starting with https://');
  let res;
  try {
    res = await fetch(url + path, { method: 'POST', headers: { 'content-type': 'application/json', ...headers }, body: JSON.stringify(body || {}) });

}

function parseInvite(text) {

}

/* Free on one tablet, for good. Sharing between tablets and phones is the squad
   plan: free for TRIAL_DAYS from the first time the squad shares a board, then
   paid. The relay decides (server/worker.js, boardPlan); this only shows it. */
const TRIAL_DAYS = 60;   // the relay's default
const planEnded = () => !!(relayConn && relayConn.refused() === 'plan_ended');
const fmtDate = iso => new Date(/^\d{4}-\d{2}-\d{2}$/.test(iso) ? iso + 'T12:00:00' : iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });

function planWords(p) {
  if (!p) return '';
  if (!p.active) return p.tier === 'trial' ? 'Free trial ended' : p.tier === 'off' ? 'Sharing turned off' : 'Squad plan lapsed';
  if (p.tier === 'trial') return `Free trial · ${plural(daysLeft(p.endsAt), 'day')} left`;
  if (p.tier === 'squad') return p.grace ? 'Squad plan · payment due' : 'Squad plan';
  return 'Squad plan · no end date';
}

    head = planWords(p); cls = 'crit-t';
    note = 'Each tablet keeps working on its own, with everything it already had. Sharing comes back as soon as the squad plan is on; then tap Try again.';
  } else if (p.tier === 'trial') {
    head = planWords(p); cls = daysLeft(p.endsAt) <= 14 ? 'warn-t' : '';
    note = `Sharing between your tablets and members' phones is free until ${fmtDate(p.endsAt)}. After that each tablet keeps working on its own until the squad plan is on.`;
  } else if (p.tier === 'squad') {
    head = planWords(p); cls = p.grace ? 'warn-t' : 'ok-t';
    note = p.grace ? `Paid through ${fmtDate(p.paidThrough)}. Sharing keeps working until ${fmtDate(p.endsAt)}.` : p.paidThrough ? `Paid through ${fmtDate(p.paidThrough)}.` : 'Active.';
  } else {
    head = planWords(p); cls = 'ok-t'; note = 'Sharing has no end date for this squad.';

}
/* Once a day, on admin tablets, near the end of the trial or after a missed payment. */
function planNotice() {
  const p = RELAY && RELAY.plan;
  if (!p || !p.active || RELAY.role !== 'admin') return;
  const soon = p.tier === 'trial' && daysLeft(p.endsAt) <= 14, due = p.tier === 'squad' && p.grace;
  if (!soon && !due) return;
  const today = new Date().toDateString();
  if (read(NS + 'plan-notice') === today) return;
  write(NS + 'plan-notice', today);
  showToast(soon ? `Free trial: ${plural(daysLeft(p.endsAt), 'day')} of sharing left. Menu → Squad sharing.` : `Squad plan payment is due. Sharing stops ${fmtDate(p.endsAt)}.`, false);
}

const RELAY_ACTIONS = {

/* Opening an invite link fills in the join form. The fragment never reaches the web server. */
function takeInviteFromAddress() {
  const inv = parseInvite(location.href);
  if (!inv || IN_CLAUDE || DEMO) return;
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* not allowed here */ }
  if (RELAY && RELAY.token) { showToast(`This tablet is already signed in to ${RELAY.org || 'the squad'}.`, false); return; }
  UI.sheet = 'connect';
  UI.form = { _init: true, rmode: 'join', rurl: inv.url, rinvite: inv.code };
  render();
}

function openSheet(name) { UI.sheet = name; UI.form = {}; render(); }

function showToast(msg, undoId) {
  clearTimeout(toastTimer);
  toastRoot.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${undoId ? `<button data-act="undo" data-arg="${esc(undoId)}">Undo</button>` : ''}</div>`;
  toastTimer = setTimeout(() => { toastRoot.innerHTML = ''; }, 5000);
}
function copyText(text, el) {
  const ok = () => showToast('Copied', false);
  const fallback = () => {
    if (el && el.id && el.id.startsWith('script-')) { const r = document.createRange(); r.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }
    showToast(text.length <= 48 ? `Couldn't copy here. ${text}` : "Couldn't copy here. The text is selected; use your copy command.", false);
  };

/* =====================================================================
   Clocks
   ===================================================================== */
let lastShiftDraw = 0;
let lastDayCheck = 0;
function tick() {
  const t = now();
  if (t % 5000 < 1000) document.querySelectorAll('img[data-cam]').forEach(img => { const u = img.dataset.cam; img.src = u + (u.includes('?') ? '&' : '?') + '_t=' + t; });
  if (t - lastDayCheck > 60000) { lastDayCheck = t; maybeNewDay(); }
  const set = (k, v) => document.querySelectorAll(`[data-clock="${k}"]`).forEach(el => { if (el.textContent !== v) el.textContent = v; });
  set('now', hhmm(t));
  document.querySelectorAll('[data-since]').forEach(el => { const v = dur(t - Number(el.dataset.since)); if (el.textContent !== v) el.textContent = v; });
  if ((UI.view === 'shift' || UI.view === 'member') && !UI.sheet && t - lastShiftDraw > 20000) { lastShiftDraw = t; render(); return; }
  set('elapsed', S.fresh ? '--:--' : dur(t - S.incident.dispatchAt));
  const due = S.par.last + S.par.interval * 60000, left = due - t;
  set('par', left >= 0 ? dur(left) : '+' + dur(-left));
  set('par-lbl', left >= 0 ? 'PAR due in' : 'PAR overdue');
  const b = document.getElementById('par-btn');
  if (b) { b.classList.toggle('due', left >= 0 && left < 60000); b.classList.toggle('over', left < 0); }
}

/* Keep the screen awake while the board is open, where the browser allows it. */
let lock = null;
async function wake() {

}
