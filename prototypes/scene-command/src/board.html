  m.sections.forEach(sec => {
    heading(sec.h);
    if (sec.kv) {
      doc.autoTable({ ...base, startY: y, theme: 'plain', body: sec.kv.map(([k, v]) => [pdfText(k), pdfText(v)]), columnStyles: { 0: { fontStyle: 'bold', cellWidth: 130, textColor: [80, 90, 100] } }, styles: { ...base.styles, lineWidth: 0, cellPadding: 2.5 } });

      else {
        const colStyles = {};
        (sec.table.widths || []).forEach((w, i) => { if (w) colStyles[i] = { cellWidth: w }; });
        doc.autoTable({
          ...base, startY: y, theme: 'grid', head: [sec.table.head.map(pdfText)], body: sec.table.rows.map(r => r.map(pdfText)),
          headStyles: { fillColor: NAVY, textColor: [255, 255, 255], fontStyle: 'bold' }, alternateRowStyles: { fillColor: [244, 247, 250] }, columnStyles: colStyles,
          didParseCell: d => { if (sec.tri && d.section === 'body' && d.column.index === 0) { const k = sec.table.keys[d.row.index]; d.cell.styles.fillColor = TRI_RGB[k]; d.cell.styles.textColor = TRI_INK[k]; d.cell.styles.fontStyle = 'bold'; } },
        });

      }
    }
    if (sec.note) { doc.setFont('helvetica', 'italic'); doc.setFontSize(8.5); doc.setTextColor(110, 118, 126); doc.text(pdfText(sec.note), M, y + 8); y += 14; }

    y += 30; doc.setDrawColor(120, 128, 136); doc.setLineWidth(0.6); doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(90, 100, 110);
    const cw = (W - 2 * M - 40) / 3;
    ['Prepared by', 'Signature', 'Date'].forEach((l, i) => { const lx = M + i * (cw + 20); doc.line(lx, y, lx + cw, y); doc.text(l, lx, y + 12); });
  }
  const pages = doc.internal.getNumberOfPages(), made = pdfText(`Made with OpsBoard ${fmtDT(now())}`);
  for (let i = 1; i <= pages; i++) {
    doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(120, 128, 136);
    doc.text(pdfText(`${m.title} · ${made} · Practice data; not a patient care report`), M, H - 24);
    doc.text(`Page ${i} of ${pages}`, W - M, H - 24, { align: 'right' });
  }
  return doc;
}
async function saveReportPdf(kind) {
  const btn = document.getElementById('report-pdf');
  const busy = on => { if (btn) { btn.disabled = on; btn.innerHTML = on ? 'Making the PDF…' : `${icon('doc')} Save PDF`; } };
  busy(true);
  let jsPDF;
  try { jsPDF = pdfReady() ? window.jspdf.jsPDF : await loadPdfLib(); await prepLogo(); }
  catch (e) { busy(false); showToast('Couldn\'t load the PDF maker; it needs a connection the first time. Use Print: it can save a PDF too.', false); return; }
  const m = reportModel(kind), name = m.file + '.pdf';
  let blob;
  try { blob = buildPdf(jsPDF, m).output('blob'); }
  catch (e) { console.warn(e); busy(false); showToast('Couldn\'t make the PDF. Use Print instead.', false); return; }
  busy(false);
  // Inside Claude the page can't download on its own; the viewer's save prompt hands the file over.
  if (IN_CLAUDE) {
    const dl = await window.claude.use('downloads').catch(() => null);
    if (dl) {
      try { await dl.save({ filename: name, data: blob }); showToast(`Saved ${name}`, false); }
      catch (e) { if (!e || e.code !== 'declined') showToast('Couldn\'t save the PDF here. Use Print instead.', false); }
      return;
    }
  }
  const file = typeof File === 'function' ? new File([blob], name, { type: 'application/pdf' }) : null;
  const touch = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
  if (touch && file && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: m.title }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }   // closed the share sheet; otherwise fall through to a download
  }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 120000);
  showToast(`Saved ${name}`, false);
}
function printReport() {
  const done = () => { document.body.classList.remove('printing'); window.removeEventListener('afterprint', done); };
  document.body.classList.add('printing');
  window.addEventListener('afterprint', done);
  try { window.print(); } catch (e) { done(); showToast('This browser can\'t print from here. Use Save PDF.', false); }
}

function transportSheet() {
  const f = UI.form, units = readyUnits(), k = f.cat;
  const o = sceneLL();

/* Red, yellow and green at a glance: what each hospital can still take, in its triage color. */
function capPills(h, k) {
  const cap = hospCap(h.id);
  return `<span class="cps">${TX_CATS.map(c => {
    const s = hospSent(h.id, c), m = cap ? cap[c] : null, left = m != null ? Math.max(0, m - s) : null;
    return `<span class="cp c-${c}${k === c ? ' sel' : ''}${left === 0 ? ' zero' : ''}">${cat(c).color} ${left == null ? (s ? s + ' sent' : '—') : left + ' open'}</span>`;

/* Paste a list of units, one per line: "29-56 BLS Squad 29" or "MICU 9, ALS, RWJBH". */
function parseUnits(text) {
  const kinds = UNIT_KINDS.map(k => k.k);
  const guess = (id, rest) => {
    const all = (id + ' ' + rest).toUpperCase();
    const explicit = kinds.find(k => new RegExp(`(^|[\\s,;|])${k}($|[\\s,;|])`).test(all));
    if (explicit) return explicit;
    if (/^(M|MEDIC|MICU)[-\s]?\d/.test(id.toUpperCase()) || /^59-/.test(id) || /MEDIC|PARAMEDIC|MICU/.test(all)) return 'ALS';
    if (/^\d{2}-5[0-4]$/.test(id)) return 'SUP';
    if (/^\d{2}-55$/.test(id) || /^(RV|FR)[-\s]?\d/.test(id.toUpperCase()) || /RESPONSE|FLY ?CAR/.test(all)) return 'RV';   // county pattern: 50 captain/chief, 51-54 officers
    if (/^(E|ENG|ENGINE)[-\s]?\d/.test(id.toUpperCase())) return 'ENG';
    if (/^(L|T|TRK|TRUCK|LADDER|TOWER)[-\s]?\d/.test(id.toUpperCase())) return 'TRK';
    if (/^(R|RES|RESCUE)[-\s]?\d/.test(id.toUpperCase())) return 'RES';
    if (/HAZ/.test(all)) return 'HAZ';
    return 'BLS';
  };
  return text.split(/\n+/).map(l => l.trim()).filter(Boolean).map(line => {
    const parts = line.split(/[,\t;|]+/).map(s => s.trim()).filter(Boolean);
    let id, rest;
    if (parts.length > 1) { id = parts[0]; rest = parts.slice(1).join(' '); }
    else { const m = line.match(/^(\S+(?:\s\d[\w-]*)?)\s*(.*)$/); id = m[1]; rest = m[2]; }
    const kind = guess(id, rest);
    const agency = rest.split(/\s+/).filter(w => w.toUpperCase() !== kind).join(' ').trim();
    return { name: id.toUpperCase(), kind, agency: agency || 'Mutual aid' };
  });
}

        ${mciWs || w === 'home' ? (S.sample ? '<button class="opt tall" data-act="sheet" data-arg="inc-clear">Clear the sample incident<small>Back to an empty board</small></button>' : '<button class="opt tall" data-act="load-sample">Load the sample incident<small>Practice: bus crash, Ocean Township, 19 patients</small></button>') : ''}
      </div>

    foot: `<button class="btn primary" data-act="close">Done</button>`,

}

/* =====================================================================
   Shared boards. Every change is an event; each tablet keeps its own list
   of events and every tablet replays all of them over the board's starting
   state. Two tablets tapping at once can't overwrite each other, counts add
   up, and undo takes back one event.

   There are two boards, each its own stream of events: the MCI incident
   (scene command) and the everyday shift (supervisor).
   ===================================================================== */
let seq = 0;
const byTime = (a, b) => a.t - b.t || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);

function Stream(name, opts) {
  Object.assign(this, opts);              // root, pointer, key, R, label
  this.name = name;
  this.base = null; this.events = new Map(); this.state = null;
  this.id = null; this.shared = false; this.unsub = null;
  this.written = {}; this.writing = false; this.dirty = false; this.error = ''; this.booted = false;
}
Stream.prototype.undone = function () { return new Set([...this.events.values()].filter(e => e.type === 'undo').map(e => e.p.target)); };
Stream.prototype.rebuild = function () {
  const st = JSON.parse(JSON.stringify(this.base)), undone = this.undone();
  for (const e of [...this.events.values()].sort(byTime)) {
    if (undone.has(e.id)) continue;
    if (e.type !== 'undo' && this.R[e.type]) { try { this.R[e.type](st, e.p); } catch (err) { console.warn('Skipped an event that no longer applies', e.type, err); } }
    if (e.text) st.log.push({ t: e.t, kind: e.kind, text: e.text, role: e.role });
  }
  this.state = st;
  if (this.name === 'incident') S = st; else if (this.name === 'event') EV = st; else SH = st;
};
Stream.prototype.saveLocal = function () { write(this.key, this.base); write(K.ev(this.base.id), [...this.events.values()]); };
Stream.prototype.load = function (fallback) {
  const b = read(this.key);
  this.base = b && b.id ? b : fallback();
  this.events.clear();
  (read(K.ev(this.base.id)) || []).forEach(e => this.events.set(e.id, e));
  this.rebuild();
};
Stream.prototype.dispatch = function (type, p, text, kind = 'note', { toast = true } = {}) {
  const e = { id: `${DEV.id}.${Date.now().toString(36)}.${(seq++).toString(36)}`, dev: DEV.id, role: DEV.role, t: now(), type, p, text: text || '', kind };
  this.events.set(e.id, e);
  this.rebuild(); this.saveLocal(); render();
  if (toast && text) showToast(text, e.id);
  Sync.push(this);
  return e;
};
Stream.prototype.start = function (base) {
  this.base = base; this.events.clear(); this.rebuild(); this.saveLocal();
  if (Sync.db) Sync.announce(this);
};
Stream.prototype.mine = function () { return [...this.events.values()].filter(e => e.dev === DEV.id).sort(byTime); };
Stream.prototype.pending = function () {
  const mine = this.mine();
  let n = 0;
  for (let i = 0; i * CHUNK < mine.length; i++) n += Math.min(CHUNK, mine.length - i * CHUNK) - (this.written[`${this.id}:${i}`] || 0);
  return n;
};

const unitIn = (st, id) => st.units.find(u => u.id === id);
/* Reducers: how each event changes the incident. They depend only on the event, never on the clock. */
const R = {
  tri(st, p) { st.triage[p.k] = Math.max(0, (st.triage[p.k] || 0) + p.d); },
  retriage(st, p) { if ((st.triage[p.from] || 0) > 0) { st.triage[p.from]--; st.triage[p.to] = (st.triage[p.to] || 0) + 1; } },
  est(st, p) { st.incident.est = p.v; },
  bench(st, p) { if (p.on) st.bench[p.id] = p.at; else delete st.bench[p.id]; },
  mci(st, p) { st.incident.mciLevel = p.L; if (p.L >= 2 && !st.bench.mci) st.bench.mci = p.at; if (st.fresh && p.L) { st.fresh = false; st.incident.dispatchAt = p.at; } },
  method(st, p) { st.method = p.m; if (p.m !== 'SALT' && st.triage.X) { st.triage.B = (st.triage.B || 0) + st.triage.X; st.triage.X = 0; } },
  white(st, p) { st.white = p.on; },
  pin(st, p) { st.incident[p.field] = p.ll; },
  staging(st, p) { st.incident.staging = p.staging; st.incident.stagingLL = p.ll; if (!st.bench.staging) st.bench.staging = p.at; },
  tx(st, p) {
    st.transports.push({ id: p.id, cat: p.cat, n: p.n, tags: p.tags, age: p.age, unit: p.unit, hosp: p.hosp, t: p.at });
    const u = unitIn(st, p.unit);
    if (u) { u.status = 'transporting'; u.task = 'To ' + ((hosp(p.hosp) || {}).short || 'hospital'); u.t = p.at; }
  },
  par(st, p) { st.par.last = p.at; },
  parInterval(st, p) { st.par.interval = p.m; },
  unitStatus(st, p) { const u = unitIn(st, p.id); if (!u) return; u.status = p.st; u.t = p.at; if (p.clearTask) u.task = ''; },
  unitTask(st, p) { const u = unitIn(st, p.id); if (!u) return; u.task = p.task; if (p.task && u.status !== 'onscene') { u.status = 'onscene'; u.t = p.at; } },
  unitCrew(st, p) { const u = unitIn(st, p.id); if (u) u.crew = p.crew; },
  unitRemove(st, p) { st.units = st.units.filter(x => x.id !== p.id); },
  unitAdd(st, p) { p.units.forEach(u => { if (!st.units.some(x => x.name === u.name)) st.units.push({ ...u }); }); },
  personAdd(st, p) { if (!st.people.some(x => x.id === p.person.id)) st.people.push({ ...p.person }); },
  personEdit(st, p) { const x = st.people.find(q => q.id === p.id); if (x) Object.assign(x, p.fields); },
  personOut(st, p) { const x = st.people.find(q => q.id === p.id); if (x) x.out = p.at; },
  reqAdd(st, p) { st.requests.push({ ...p.req }); },
  reqStatus(st, p) { const r = st.requests.find(x => x.id === p.id); if (r) r.status = p.st; },
  icsSet(st, p) { st.ics[p.pos] = { who: p.who, t: p.at }; },
  pointAdd(st, p) { st.points = st.points || []; if (!st.points.some(x => x.id === p.point.id)) st.points.push({ ...p.point }); },
  pointEdit(st, p) { const x = (st.points || []).find(q => q.id === p.id); if (x) Object.assign(x, p.fields); },
  pointDel(st, p) { st.points = (st.points || []).filter(x => x.id !== p.id); },
  unitPar(st, p) { p.ids.forEach(id => { const u = unitIn(st, id); if (u) u.par = p.at; }); },
  icsClear(st, p) { delete st.ics[p.pos]; },
  hospNotify(st, p) { st.hospitals[p.id] = { ...(st.hospitals[p.id] || {}), notifiedAt: p.at }; },
  hospReport(st, p) { st.hospitals[p.id] = { ...(st.hospitals[p.id] || {}), cap: p.cap, beds: p.beds, ed: p.ed, capAt: p.at }; },
  incEdit(st, p) { Object.assign(st.incident, p.fields); if (st.fresh && p.at) { st.fresh = false; st.incident.dispatchAt = p.at; } },
  note() {},
};

/* Reducers for the everyday shift board. */
const callIn = (st, id) => st.calls.find(c => c.id === id);
const RS = {
  respAdd(st, p) {
    const c = callIn(st, p.id); if (!c) return;
    c.resp = c.resp || [];
    const again = c.resp.find(r => r.pid === p.r.pid);
    if (again) { if (again.st === 'clear') { again.st = 'enroute'; again.enroute = p.at; again.via = p.r.via; } return; }
    c.resp.push({ ...p.r, st: 'enroute', t: p.at, enroute: p.at });
    if (!c.times.enroute) c.times.enroute = p.at;
    if (c.status === 'disp') c.status = 'enroute';
  },
  respStep(st, p) {
    const c = callIn(st, p.id), r = c && (c.resp || []).find(x => x.pid === p.pid); if (!r) return;
    r.st = p.st; r[p.st] = p.at;
    if (p.st === 'onscene') {                      // the first member to arrive puts the call on scene
      if (!c.times.onscene) c.times.onscene = p.at;
      if (c.status === 'disp' || c.status === 'enroute') { c.status = 'onscene'; if (!c.times.enroute) c.times.enroute = p.at; }
    }
  },
  callReq(st, p) { const c = callIn(st, p.id); if (!c) return; c.reqs = c.reqs || []; c.reqs.push({ rid: p.rid, what: p.what, st: 'requested', t: p.at }); },
  callReqStep(st, p) { const c = callIn(st, p.id), q = c && (c.reqs || []).find(x => x.rid === p.rid); if (q) { q.st = p.st; q[p.st] = p.at; } },
  unitStatus(st, p) { const u = unitIn(st, p.id); if (u) { u.status = p.st; u.since = p.at; u.note = p.note || ''; } },
  unitAdd(st, p) { p.units.forEach(u => { if (!st.units.some(x => x.name === u.name)) st.units.push({ ...u }); }); },
  callAdd(st, p) { st.calls.push({ ...p.call }); },
  callStep(st, p) { const c = callIn(st, p.id); if (!c) return; c.status = p.st; c.times[p.st] = p.at; if (p.hosp) c.hosp = p.hosp; },
  callUnit(st, p) { const c = callIn(st, p.id); if (c) c.unit = p.unit; },
  callClose(st, p) { const c = callIn(st, p.id); if (!c) return; c.status = 'clear'; c.times.clear = p.at; c.outcome = p.outcome; c.mutualAid = p.ma || ''; },
  crewIn(st, p) { if (!st.crew.some(x => x.id === p.person.id)) st.crew.push({ ...p.person }); },
  crewEdit(st, p) { const x = st.crew.find(q => q.id === p.id); if (x) Object.assign(x, p.fields); },
  crewOut(st, p) { const x = st.crew.find(q => q.id === p.id); if (x) x.out = p.at; },
  note() {},
};

/* =====================================================================
   Event mode: a planned event rather than an emergency (a parade, the
   fireworks, a beach day, a race). Posts on the map, members and units
   assigned to them, who is at their post, and a simple patient log. Its
   own board, shared like the other two; one tap turns it into an MCI with
   everyone already placed.
   ===================================================================== */
const EVENT_TYPES = ['Parade', 'Fireworks', 'Concert', 'Festival', 'Sports', 'Beach', 'Race / walk', 'Other'];
const POST_KINDS = [
  { k: 'fixed', name: 'Post', code: '' },
  { k: 'aid',   name: 'First aid station', code: '+' },
  { k: 'cmd',   name: 'Command post', code: 'CP' },
  { k: 'roam',  name: 'Roaming · foot or bike', code: 'R' },
  { k: 'unit',  name: 'Ambulance standby', code: 'A' },
  { k: 'rehab', name: 'Cooling / rehab', code: 'C' },
  { k: 'gate',  name: 'Gate / entrance', code: 'G' },
];
const postKind = k => POST_KINDS.find(x => x.k === k) || POST_KINDS[0];
const EP_COMPLAINTS = ['Heat / dehydration', 'Fall / injury', 'Cut / bleeding', 'Breathing', 'Chest pain', 'Allergic reaction', 'Intoxication', 'Diabetic', 'Seizure', 'Lost child / person', 'Other'];
const EP_OUTCOMES = ['Treated & released', 'Transported', 'Refused (RMA)', 'Referred to own doctor'];
const PERSON_ST = { assigned: 'Assigned', atpost: 'At post', break: 'On break', off: 'Done' };

const newEventId = () => 'evt-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6);
function blankEvent(o = {}) {
  const t = now();
  return {
    v: 1, id: newEventId(), kind: 'event', startedAt: t, sample: false, none: !!o.none, ended: 0,
    event: { name: o.name || '', type: o.type || 'Other', location: o.location || '', ll: o.ll || null, start: o.start || '', end: o.end || '', channel: o.channel || '', notes: o.notes || '' },
    posts: [], people: [], units: [], pts: [],
    log: o.none ? [] : [{ t, kind: 'note', text: `Event started: ${o.name || 'event'}` }],
  };
}
function sampleEvent() {
  const T = now(), ago = m => T - m * 60000;
  const ev = blankEvent({ name: 'Summer concert on the beach', type: 'Concert', location: 'Ocean Ave & Laird St, Long Branch', ll: [40.2952, -73.9806], start: '18:00', end: '22:30', channel: 'EMS Countywide' });
  ev.sample = true; ev.startedAt = ago(95);
  const P = (id, name, kind, ll, notes = '') => ({ id, name, kind, ll, notes });
  ev.posts = [
    P('pcp', 'Command post · boardwalk ramp', 'cmd', [40.2952, -73.9800]),

  ];
  const M = (num, name, cert, post, st, m) => ({ id: 'e' + num, num, name, cert, post, st, t: ago(m), at: ago(m) });
  ev.people = [
    M('4101', 'Lt. R. Ramos', 'Officer', 'pcp', 'atpost', 90), M('4175', 'D. Patel', 'Paramedic', 'paid', 'atpost', 88),
    M('4127', 'K. Shah', 'EMT', 'paid', 'atpost', 88), M('4133', 'J. Ortiz', 'EMT', 'p1', 'atpost', 80),
    M('4140', 'M. Chen', 'EMT', 'p2', 'break', 80), M('4158', 'A. Russo', 'EMT', 'p3', 'assigned', 20),
    M('4180', 'L. Gomez', 'EMT', 'pr', 'atpost', 70), M('4190', 'Y. Klein', 'EMT', '', 'assigned', 5),
  ];
  ev.units = [{ id: 'eu1', name: '78-56', kind: 'BLS', post: 'pa' }, { id: 'eu2', name: '78-55', kind: 'RV', post: 'pcp' }];
  ev.pts = [
    { id: 'ep1', t: ago(60), post: 'paid', age: 'Adult', complaint: 'Heat / dehydration', outcome: 'Treated & released', hosp: '', unit: '', note: '' },
    { id: 'ep2', t: ago(35), post: 'p1', age: 'Child', complaint: 'Cut / bleeding', outcome: 'Treated & released', hosp: '', unit: '', note: '' },
    { id: 'ep3', t: ago(12), post: 'paid', age: 'Adult', complaint: 'Intoxication', outcome: 'Transported', hosp: 'mmc', unit: '78-56', note: '' },
  ];
  ev.log = [{ t: ago(95), kind: 'note', text: 'Event started: Summer concert on the beach (sample)' }];
  return ev;
}
const postIn = (st, id) => st && st.posts.find(po => po.id === id);
const eventLive = () => !!(EV && !EV.none && !EV.ended);
const postStaff = po => EV.people.filter(x => x.post === po.id && x.st !== 'off');
const postUnits = po => EV.units.filter(u => u.post === po.id);
const postName = id => { const po = postIn(EV, id); return po ? po.name : ''; };
function postLabel(po) {
  if (po.kind !== 'fixed') return postKind(po.kind).code;
  return String(EV.posts.filter(x => x.kind === 'fixed').indexOf(po) + 1);
}
/* Reducers for an event. Like the others, they depend only on the event, never on the clock. */
const RE = {
  evEdit(st, p) { Object.assign(st.event, p.fields); },
  evEnd(st, p) { st.ended = p.at; st.people.forEach(x => { if (x.st !== 'off') { x.st = 'off'; x.at = p.at; } }); },
  postAdd(st, p) { if (!postIn(st, p.post.id)) st.posts.push({ ...p.post }); },
  postEdit(st, p) { const x = postIn(st, p.id); if (x) Object.assign(x, p.fields); },
  postDel(st, p) { st.posts = st.posts.filter(x => x.id !== p.id); st.people.forEach(x => { if (x.post === p.id) x.post = ''; }); st.units.forEach(u => { if (u.post === p.id) u.post = ''; }); },
  personAdd(st, p) {
    const ex = p.person.num && st.people.find(x => x.num === p.person.num);
    if (ex) { if (p.person.post !== undefined) ex.post = p.person.post; if (ex.st === 'off') ex.st = 'assigned'; ex.at = p.person.at; return; }
    if (!st.people.some(x => x.id === p.person.id)) st.people.push({ ...p.person });
  },
  personPost(st, p) { const x = st.people.find(y => y.id === p.id); if (x) { x.post = p.post; if (x.st === 'off') x.st = 'assigned'; if (p.post && x.st === 'atpost') x.st = 'assigned'; x.at = p.at; } },
  personSt(st, p) { const x = st.people.find(y => y.id === p.id); if (x) { x.st = p.st; x.at = p.at; } },
  unitAdd(st, p) { if (!st.units.some(u => u.name === p.unit.name)) st.units.push({ ...p.unit }); else { const u = st.units.find(x => x.name === p.unit.name); u.post = p.unit.post; } },
  unitPost(st, p) { const u = st.units.find(x => x.id === p.id); if (u) u.post = p.post; },
  unitDel(st, p) { st.units = st.units.filter(u => u.id !== p.id); },
  ptAdd(st, p) { st.pts.push({ ...p.pt }); },
  ptDel(st, p) { st.pts = st.pts.filter(x => x.id !== p.id); },
  note() {},
};

const INC = new Stream('incident', { root: 'mci', pointer: 'now/incident', key: NS + 'incident', R, label: 'incident' });
const SHIFT = new Stream('shift', { root: 'days', pointer: 'now/day', key: NS + 'shift', R: RS, label: 'supervisor board' });
const EVS = new Stream('event', { root: 'evts', pointer: 'now/event', key: NS + 'event', R: RE, label: 'event' });
const STREAMS = [INC, SHIFT, EVS];
const dispatch = (...a) => INC.dispatch(...a);
const sdispatch = (...a) => SHIFT.dispatch(...a);
const edispatch = (...a) => EVS.dispatch(...a);
const streamOfView = () => { const w = wsNow(); return w === 'mci' ? INC : w === 'event' ? EVS : SHIFT; };

/* =====================================================================
   Sync between tablets, through this page's shared store.

   now/incident, now/day                  which incident and which day's board every tablet follows
   mci/<id>, days/<id>                    each one's starting state
   …/<id>/devices/<tablet>~<n>            that tablet's events, written only by it
   squad/config                           squad, unit roster, members, settings, extra numbers

   (Before the clean start these were live/…, incidents/…, shifts/… and
   config/agency; boards stored there are left behind.)

   Without the store (signed out, or the page opened somewhere else) the
   boards run on this tablet alone.
   ===================================================================== */
const CONFIG_DOC = 'squad/config';
const guestStream = str => !isGuest() || str !== SHIFT;   // a guest shares the incident and the event, not the day
const STOP_CODES = ['revoked', 'not_granted', 'capability_disabled', 'capability_removed'];
const CHUNK = 300;   // events per document, well under the store's 256 KiB per document
const Sync = {
  db: null, room: null, state: 'local', peers: [], cfgWriting: null,

  async start() {
    const use = IN_CLAUDE ? n => window.claude.use(n) : relayConn ? relayConn.use : null;
    if (!use) return;
    this.state = 'connecting'; syncChip();
    let db = null;
    try { db = await use('db'); } catch (e) { db = null; }
    if (!db) { this.state = 'local'; syncChip(); return; }
    this.db = db; this.state = 'ready';
    STREAMS.filter(guestStream).forEach(str => db.doc(str.pointer).onSnapshot(s => this.onPointer(str, s), e => this.stop(e)));
    if (!isGuest()) db.doc(CONFIG_DOC).onSnapshot(s => this.onConfig(s), () => {});
    syncChip();
    try {
      const room = await use('room');
      if (room) {
        this.room = room;
        room.presence({ role: DEV.role, dev: DEV.id }).catch(() => {});
        room.onPeers(ch => { this.peers = ch.peers; syncChip(); }, () => { this.room = null; this.peers = []; syncChip(); });
      }
    } catch (e) { this.room = null; }
  },

  onPointer(str, snap) {
    const d = snap.exists ? snap.data() : null, id = d && (d.id || d.incident);
    const booted = str.booted;
    str.booted = true;
    if (!id) { syncChip(); if (str === SHIFT) maybeNewDay(); return; }
    if (id === str.id) return;
    this.follow(str, id, booted);
  },

  async follow(str, id, announce) {
    str.id = id;
    if (str.unsub) { str.unsub(); str.unsub = null; }
    if (!str.base || str.base.id !== id) {
      let snap;

/* The supervisor's board has no shifts to start. It is one board per day, and
   the day turns over by itself at DAY_STARTS, carrying units, crew still on
   duty and any open call to the next one. Every tablet names a day's board the
   same way, so two tablets turning the day over at once land on the same board. */
const DAY_STARTS = 6;   // hours: the board's day runs 6 AM to 6 AM, like most EMS shifts
const dayKey = t => { const d = new Date(t - DAY_STARTS * 3600000); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

function blankShift(t = now()) {
  return {
    v: 1, id: 'day-' + dayKey(t), day: dayKey(t), kind: 'shift', startedAt: t, sample: false,
    units: C.roster.map(r => ({ id: uid(), name: r.name, kind: r.kind, status: 'in', since: t, note: '' })),
    calls: [], crew: [],
    log: [{ t, kind: 'note', text: `${C.agency.name} · ${new Date(t).toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' })}` }],
  };
}
function nextDay(prev, t = now()) {

  b.crew = JSON.parse(JSON.stringify(prev.crew.filter(p => !p.out)));
  b.calls = JSON.parse(JSON.stringify(prev.calls.filter(c => c.status !== 'clear')));
  const carried = [b.crew.length ? plural(b.crew.length, 'member') + ' still on duty' : '', b.calls.length ? plural(b.calls.length, 'open call') : ''].filter(Boolean);
  if (carried.length) b.log.push({ t, kind: 'note', text: `Carried over from ${dayKey(prev.startedAt)}: ${carried.join(', ')}` });
  return b;
}

  },
  'call-req'(arg) {
    const i = arg.indexOf('='), id = arg.slice(0, i), what = arg.slice(i + 1), c = SH.calls.find(x => x.id === id); if (!c) return;
    if ((c.reqs || []).some(q => q.what === what && q.st === 'requested')) { showToast(`${what} is already requested`, false); return; }
    sdispatch('callReq', { id, rid: uid(), what, at: now() }, `${what} requested for ${c.address}`, 'request');

  'call-step'(id) {

/* =====================================================================
   Squad sharing for the web address. Outside Claude, the board shares
   through the squad's own relay (server/worker.js): a WebSocket to a small
   document store with the same shape as the one Claude provides, so the
   sync code above runs unchanged on either.
   ===================================================================== */
const BAKED_RELAY_URL = /*@RELAY_URL*/'';
const RELAY_KEY = 'sc3:relay';
let RELAY = DEMO ? null : read(RELAY_KEY);   // { url, token, name, org, role } once this tablet has joined
const relayBase = u => String(u || '').trim().replace(/\/+$/, '');

function relayClient(url, token) {
  const wsUrl = relayBase(url).replace(/^http/i, 'ws') + '/v1/board';
  const peerId = 'p' + Math.random().toString(36).slice(2, 10);
  const subs = new Map();          // path -> { kind, cbs:Set, data, docs:Map, loaded }
  const pending = new Map();       // rid -> { resolve, reject, timer }
  const peerCbs = new Set();

  let waiters = [];

  const send = m => { if (ws && open) ws.send(JSON.stringify(m)); };
  const clone = v => (v == null ? v : JSON.parse(JSON.stringify(v)));
  const snapDoc = (path, data) => ({ id: path.split('/').pop(), exists: data != null, data: () => (data == null ? undefined : clone(data)), metadata: { fromCache: !open, hasPendingWrites: false } });
  const snapCol = s => { const docs = [...s.docs.entries()].sort(([a], [b]) => (a < b ? -1 : 1)).map(([p, d]) => snapDoc(p, d)); return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: { fromCache: !open, hasPendingWrites: false } }; };
  const fire = (path, s, only) => { const snap = s.kind === 'doc' ? snapDoc(path, s.data) : snapCol(s); (only ? [only] : [...s.cbs]).forEach(cb => { try { cb.next(snap); } catch (e) { console.warn(e); } }); };
  const shapePeers = () => peers.map(p => ({ peer: p.peer, kind: 'viewer', isMe: p.peer === peerId, sameTab: p.peer === peerId, guest: false, by: null, name: p.name, presence: { role: p.role, dev: p.dev }, updatedAt: p.at }));

  function whenOpen(ms = 8000) {
    if (refused) return Promise.reject({ code: refused, message: 'Not signed in to the squad' });
    if (open) return Promise.resolve();
    return new Promise((resolve, reject) => {
      const w = { resolve, reject };
      waiters.push(w);
      setTimeout(() => { waiters = waiters.filter(x => x !== w); reject({ code: 'unavailable', message: 'The relay is not reachable right now' }); }, ms);
    });
  }
  async function request(msg) {
    await whenOpen();
    return new Promise((resolve, reject) => {
      const id = ++rid;
      const timer = setTimeout(() => { pending.delete(id); reject({ code: 'unavailable', message: 'The relay did not answer' }); }, 10000);
      pending.set(id, { resolve, reject, timer });
      send({ ...msg, rid: id });
    });
  }
  function handle(m) {
    if (m.type === 'doc') {
      const s = subs.get(m.path);
      if (s && s.kind === 'doc') { s.data = m.data; s.loaded = true; fire(m.path, s); }
      const parent = m.path.split('/').slice(0, -1).join('/'), c = subs.get(parent);
      if (c && c.kind === 'col' && m.data != null) { c.docs.set(m.path, m.data); fire(parent, c); }
    } else if (m.type === 'col') {
      const s = subs.get(m.path);
      if (s) { s.docs = new Map(m.docs); s.loaded = true; fire(m.path, s); }
    } else if (m.type === 'welcome') {
      if (RELAY && m.plan) { RELAY.plan = m.plan; write(RELAY_KEY, RELAY); }
      planNotice(); syncChip();
    } else if (m.type === 'peers') {
      peers = m.peers || [];
      const ch = { peers: shapePeers(), joined: [], left: [], updated: [] };
      peerCbs.forEach(cb => { try { cb(ch); } catch (e) { console.warn(e); } });
    } else if (m.rid && pending.has(m.rid)) {
      const p = pending.get(m.rid); pending.delete(m.rid); clearTimeout(p.timer);

      waiters.forEach(w => w.resolve()); waiters = [];
      syncChip();
    };
    ws.onmessage = ev => { try { handle(JSON.parse(ev.data)); } catch (e) { console.warn(e); } };

      open = false; ws = null;
      pending.forEach(p => { clearTimeout(p.timer); p.reject({ code: 'unavailable', message: 'Connection lost' }); }); pending.clear();

        refused = ev.code === 4403 ? 'revoked' : ev.code === 4402 ? 'plan_ended' : 'not_granted';
        relayRefusal = ev.reason || 'This tablet is not signed in to the squad.';
        if (ev.code === 4402 && RELAY) {
          RELAY.plan = { ...(RELAY.plan || { tier: 'trial' }), active: false }; write(RELAY_KEY, RELAY);
          // The refusal says that the plan ended; the relay says which plan, and when.
          fetch(relayBase(url) + '/v1/me', { headers: { authorization: 'Bearer ' + token } })
            .then(r => (r.ok ? r.json() : null))
            .then(d => { if (d && d.boardPlan && RELAY) { RELAY.plan = d.boardPlan; write(RELAY_KEY, RELAY); syncChip(); if (UI.sheet === 'connect') render(); } })
            .catch(() => {});
        }
        waiters.forEach(w => w.reject({ code: refused })); waiters = [];
        subs.forEach(s => s.cbs.forEach(cb => cb.error && cb.error({ code: 'revoked', message: relayRefusal })));

      backoff = Math.min(backoff * 2, 15000);
    };
  }
  function subscribe(path, kind, next, error) {
    let s = subs.get(path);
    if (!s) { s = { kind, cbs: new Set(), data: undefined, docs: new Map(), loaded: false }; subs.set(path, s); send({ type: 'sub', path }); }
    const cb = { next, error };
    s.cbs.add(cb);

  }

  const db = {
    doc: path => ({
      path,
      get: () => request({ type: 'get', path }).then(r => snapDoc(path, r.data)),
      set: data => request({ type: 'set', path, data: clone(data) }).then(() => undefined),
      onSnapshot: (next, error) => subscribe(path, 'doc', next, error),
    }),
    collection: path => ({ path, onSnapshot: (next, error) => subscribe(path, 'col', next, error) }),
  };
  const room = {
    presence(patch) { presenceState = { ...presenceState, ...patch }; send({ type: 'presence', peer: peerId, ...presenceState }); return Promise.resolve(); },
    onPeers(cb) { peerCbs.add(cb); setTimeout(() => cb({ peers: shapePeers(), joined: [], left: [], updated: [] })); return () => peerCbs.delete(cb); },

}
let relayRefusal = '';
const relayConn = !IN_CLAUDE && RELAY && RELAY.token && RELAY.url ? relayClient(RELAY.url, RELAY.token) : null;

async function relayCall(path, body, headers = {}) {
  const url = relayBase(UI.form.rurl || (RELAY && RELAY.url) || BAKED_RELAY_URL);
  if (!/^https?:\/\//i.test(url)) throw new Error('Enter the relay address, starting with https://');
  let res;

    res = await fetch(url + path, { method: 'POST', headers: { 'content-type': 'application/json', ...headers }, body: JSON.stringify(body || {}) });

}

function planWords(p) {

  if (p.tier === 'trial') return `Free trial · ${plural(daysLeft(p.endsAt), 'day')} left`;

/* Opening an invite link fills in the join form. The fragment never reaches the web server. */
function takeInviteFromAddress() {
  const inv = parseInvite(location.href);
  if (!inv || IN_CLAUDE || DEMO) return;
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* not allowed here */ }

  clearTimeout(toastTimer);
  toastRoot.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${undoId ? `<button data-act="undo" data-arg="${esc(undoId)}">Undo</button>` : ''}</div>`;
  toastTimer = setTimeout(() => { toastRoot.innerHTML = ''; }, 5000);

function copyText(text, el) {
  const ok = () => showToast('Copied', false);
  const fallback = () => {
    if (el && el.id && el.id.startsWith('script-')) { const r = document.createRange(); r.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }
    showToast(text.length <= 48 ? `Couldn't copy here. ${text}` : "Couldn't copy here. The text is selected; use your copy command.", false);
  };
  try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (e) { fallback(); }
}
function formPath(name) {
  const path = name.split('.');

}

  },
  'units-load'() {
    const f = UI.form, parsed = parseUnits(f.text || '');
    if (!parsed.length) { showToast('Paste at least one unit first', false); return; }
    const have = new Set(S.units.map(u => u.name));
    const fresh = parsed.filter(p => !have.has(p.name));
    if (f.saveRoster) {
      const names = new Set(C.roster.map(r => r.name));
      C.roster = C.roster.concat(parsed.filter(p => !names.has(p.name)).map(p => ({ name: p.name, kind: p.kind })));
      saveConfig();
    }
    UI.sheet = null; UI.form = {};
    dispatch('unitAdd', { units: fresh.map(p => ({ id: uid(), ...p, crew: 2, status: f.into, task: '', t: now() })) },
      `Loaded ${plural(fresh.length, 'unit')} as ${statusName(f.into)}${parsed.length > fresh.length ? ` (${parsed.length - fresh.length} already on the board)` : ''}`, 'units');
  },

  /* agency */
  'ag-add'() {
    const f = UI.form, name = (f.unum || '').trim().toUpperCase();
    if (!name) { showToast('Type the unit number first', false); document.getElementById('ag-unit')?.focus(); return; }
    if (f.roster.some(r => r.name === name)) { showToast(`${name} is already in the list`, false); return; }
    f.roster.push({ name, kind: f.akind || 'BLS' }); f.unum = '';
    // Saved right away: a unit typed in and added is the squad's, whether or not Save is tapped after.
    C.roster = f.roster.map(r => ({ ...r })); saveConfig();
    if (!SH.units.some(u => u.name === name)) sdispatch('unitAdd', { units: [{ id: uid(), name, kind: f.akind || 'BLS', status: 'in', since: now(), note: '' }] }, `${name} added to the supervisor board`, 'units', { toast: false });
    render(); showToast(`${name} saved`, false);
    document.getElementById('ag-unit')?.focus();
  },
  'ag-del'(i) { const r = UI.form.roster.splice(Number(i), 1)[0]; C.roster = UI.form.roster.map(x => ({ ...x })); saveConfig(); render(); if (r) showToast(`${r.name} removed from your units`, false); },
  'ag-logo-del'() { UI.form.alogo = ''; render(); },
  'agency-save'(addNow) {
    const f = UI.form;
    C.agency = { ...C.agency, name: (f.aname || '').trim() || 'My agency', num: (f.anum || '').trim(), logo: logoOk(f.alogo) ? f.alogo : '', type: AGENCIES[f.atype] ? f.atype : 'ems' };
    if (fitRole()) { Sync.setRole(); UI.view = 'home'; saveUi(); }
    C.roster = f.roster.slice();
    saveConfig();
    UI.sheet = null; UI.form = {};
    const missing = C.roster.filter(r => !S.units.some(u => u.name === r.name));
    const smissing = C.roster.filter(r => !SH.units.some(u => u.name === r.name));
    if (smissing.length) sdispatch('unitAdd', { units: smissing.map(r => ({ id: uid(), name: r.name, kind: r.kind, status: 'in', since: now(), note: '' })) }, `${plural(smissing.length, 'unit')} added to the supervisor board`, 'units', { toast: false });
    if (addNow === 'add' && missing.length) {
      dispatch('unitAdd', { units: missing.map(r => ({ id: uid(), name: r.name, kind: r.kind, agency: C.agency.name, crew: 2, status: 'available', task: '', t: now() })) },
        `${C.agency.name}: ${plural(missing.length, 'unit')} added as Available`, 'units');
    } else { render(); showToast(`${C.agency.name} saved: ${plural(C.roster.length, 'unit')}`, false); }
  },

  /* people */
  'member-pick'(num) {
    const m = C.members.find(x => x.num === num); if (!m) return;
    Object.assign(UI.form, { num: m.num, name: m.name, cert: m.cert || UI.form.cert });
    render();
  },
  'person-save'(id) {
    const f = UI.form, num = memNum(f.num), name = (f.name || '').trim();
    if (!num && !name) { showToast('Enter a member number or a name', false); return; }
    const where = [f.unit, f.task].filter(Boolean).join(' · ');
    if (!id && S.people.some(p => !p.out && p.num && p.num === num)) { showToast(`#${num} is already checked in`, false); return; }
    UI.sheet = null; UI.form = {};
    if (id) {
      dispatch('personEdit', { id, fields: { num, name, cert: f.cert, unit: f.unit || '', task: f.task || '' } }, `${name || '#' + num}: ${where || 'unassigned'}`, 'people');
    } else {
      if (num && name && !C.members.some(m => m.num === num)) { C.members.push({ num, name, cert: f.cert }); saveConfig(); }
      dispatch('personAdd', { person: { id: uid(), num, name, cert: f.cert, unit: f.unit || '', task: f.task || '', t: now() } },
        `Checked in #${num || '?'} ${name} (${f.cert})${where ? ' → ' + where : ''}`, 'people');
    }
  },
  'person-out'(id) {
    const p = S.people.find(x => x.id === id); if (!p) return;
    UI.sheet = null; UI.form = {};
    dispatch('personOut', { id, at: now() }, `Checked out #${p.num} ${p.name}`, 'people');
  },
  'members-save'() {
    const lines = (UI.form.mtext || '').split(/\n+/).map(l => l.trim()).filter(Boolean);
    C.members = lines.map(l => { const [num, name, cert] = l.split(/[,\t;|]+/).map(s => s.trim()); return { num: memNum(num), name: name || '', cert: CERTS.find(c => c.toLowerCase() === (cert || '').toLowerCase()) || cert || 'EMT' }; }).filter(m => m.num || m.name);
    saveConfig(); UI.sheet = null; UI.form = {}; render();
    showToast(`Member roster saved: ${plural(C.members.length, 'member')}`, false);
  },

  /* requests */
  'req-save'() {
    const f = UI.form; if (!f.what) return;
    UI.sheet = null; UI.form = {};
    dispatch('reqAdd', { req: { id: uid(), what: f.what, qty: f.qty || 1, status: 'requested', t: now(), note: (f.note2 || '').trim() } },
      `Requested ${(f.qty || 1) > 1 ? f.qty + ' × ' : ''}${f.what}${f.note2 ? ' (' + f.note2 + ')' : ''}`, 'request');
  },
  'req-next'(id) {
    const r = S.requests.find(x => x.id === id); if (!r) return;
    const i = REQ_FLOW.indexOf(r.status); if (i < 0 || i === REQ_FLOW.length - 1) return;
    const nx = REQ_FLOW[i + 1];
    dispatch('reqStatus', { id, st: nx }, `${r.what}: ${reqStatusName(nx)}`, 'request');
  },

  /* ICS */
  'ics-save'(id) {
    const who = (UI.form.who || '').trim(), p = ICS_POSITIONS.find(x => x.id === id);
    if (!who) { showToast('Enter a name or pick someone', false); return; }
    UI.sheet = null; UI.form = {};
    dispatch('icsSet', { pos: id, who, at: now() }, `${p.label}: ${who}`, 'units');
  },
  'ics-clear'(id) {
    const p = ICS_POSITIONS.find(x => x.id === id);
    UI.sheet = null; UI.form = {};
    dispatch('icsClear', { pos: id }, `${p.label} vacated`, 'units');
  },

  /* hospitals */
  'hosp-notify'(id) { const h = hosp(id); dispatch('hospNotify', { id, at: now() }, `${h.short} notified`, 'note'); },
  'hosp-save'(id) {
    const h = hosp(id), c = UI.form.cap, beds = {};
    Object.entries(UI.form.beds || {}).forEach(([k, v]) => { if (v) beds[k] = v; });
    const ed = UI.form.ed || hospState(id).ed || '';
    UI.sheet = null; UI.form = {};
    dispatch('hospReport', { id, cap: { ...c }, beds, ed, at: now() },
      `${h.short} reports${ed ? ' ' + ed + ',' : ''} Red ${c.R}, Yellow ${c.Y}, Green ${c.G}${Object.keys(beds).length ? '; beds ' + Object.entries(beds).map(([k, v]) => `${BED_TYPES.find(b => b.k === k).name} ${v}`).join(', ') : ''}`, 'note');
  },

  /* phone */
  'contact-save'() {
    const f = UI.form, name = (f.cname || '').trim(), num = (f.cnum || '').trim();
    if (!name || !num) { showToast('Enter a name and a number', false); return; }
    C.contacts.push({ id: uid(), group: (f.cgroup || 'My agency').trim(), name, num, note: (f.cnote || '').trim() });
    saveConfig(); UI.sheet = null; UI.form = {}; render(); showToast(`Saved ${name}`, false);
  },
  'contact-del'(id) { C.contacts = C.contacts.filter(c => c.id !== id); saveConfig(); render(); },

  /* incident */
  'inc-save'() {
    const f = UI.form, fields = {};
    for (const k of ['type', 'location', 'municipality', 'commandName', 'ic', 'staging', 'access', 'hazards', 'lz', 'lzLocation']) fields[k] = typeof f[k] === 'string' ? f[k].trim() : f[k];
    UI.sheet = null; UI.form = {}; mapKind = null;
    dispatch('incEdit', { fields, at: now() }, 'Incident details updated', 'note');
  },
  'inc-new'() {
    const f = UI.form;
    const base = blankState({ ...f, location: (f.location || '').trim(), commandName: (f.commandName || '').trim(), ic: (f.ic || '').trim() });
    if (f.fromEvent && eventLive()) {
      const t = now(), cmdPost = EV.posts.find(po => po.kind === 'cmd' && po.ll);
      base.incident.ll = EV.event.ll || (cmdPost && cmdPost.ll) || null;
      EV.units.forEach(u => { const have = base.units.find(x => x.name === u.name); if (have) { have.status = 'onscene'; have.t = t; } else base.units.push({ id: uid(), name: u.name, kind: u.kind, agency: C.agency.name, crew: 2, status: 'onscene', task: u.post ? postName(u.post) : '', t }); });
      base.people = EV.people.filter(x => x.st !== 'off').map(x => ({ id: uid(), num: x.num, name: x.name, cert: x.cert, unit: '', task: x.post ? postName(x.post) : '', t }));
    }
    base.log[0].text = `Command established${base.incident.commandName ? ': ' + base.incident.commandName : ''}${base.incident.ic ? ', ' + base.incident.ic : ''}`;
    startIncident(base, 'New incident started. Clock running.');
    if (f.fromCall) {
      const c = SH.calls.find(x => x.id === f.fromCall);
      if (c) sdispatch('note', {}, `${c.type} at ${c.address} became an MCI`, 'note', { toast: false });
      setJob('command'); UI.view = 'board'; saveUi(); render();
      showToast('MCI started from the call. This tablet is now Command.', false);
    }
    if (f.fromEvent) {
      edispatch('note', {}, `The event became an MCI: ${base.incident.type || 'incident'}${base.incident.location ? ' at ' + base.incident.location : ''}`, 'note', { toast: false });
      setJob('command'); UI.view = 'board'; saveUi(); render();
      showToast(`MCI started with ${plural(base.people.length, 'member')} and ${plural(EV.units.length, 'unit')} from the event on scene. This tablet is now Command.`, false);
    }
  },
  'load-sample'() { startIncident(sampleState(), 'Sample incident loaded'); },
  'inc-clear'() { startIncident(freshIncident(), 'Sample cleared', { stay: true }); },

  'log-filter'(k) { UI.logFilter = k; render(); },
  'report-pdf'(kind) { saveReportPdf(kind); },
  'report-print'() { printReport(); },
  'offline-info'() { showToast('No internet right now. Everything you do is saved on this tablet and goes to the other tablets when it\'s back. Live ED status and aerial imagery need the internet; the built-in map works.', false); },
  'quick-note'(text) { logStream().dispatch('note', {}, text, 'note'); },
  copy(i) { const s = radioScripts()[Number(i)]; copyText(s.text, document.getElementById('script-' + i)); },
};

Object.assign(A, SHIFT_ACTIONS, RELAY_ACTIONS, MEMBER_ACTIONS, CAMERA_ACTIONS, FEED_ACTIONS, EVENT_ACTIONS);

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  if (act === 'backdrop' && e.target !== el) return;
  if (A[act]) { if (el.tagName !== 'A') e.preventDefault(); A[act](el.dataset.arg, el, e); }
  wake();
});
document.addEventListener('change', async e => {
  if (e.target.id !== 'ag-logo') return;
  const file = e.target.files && e.target.files[0];
  try { UI.form.alogo = await shrinkLogo(file); render(); } catch (err) { showToast(err.message, false); }
});
document.addEventListener('input', e => {
  const t = e.target, f = t.dataset && t.dataset.field;
  if (!f) return;
  UI.form[f] = t.value;
  if (t.id === 'units-text') { const p = document.getElementById('units-preview'); if (p) p.innerHTML = unitsPreview(parseUnits(t.value)); }
  if (t.id === 'p-num') {
    const q = memNum(t.value), box = document.getElementById('member-matches');
    if (box) box.innerHTML = memberMatches(q ? C.members.filter(m => memNum(m.num).startsWith(q) || m.name.toLowerCase().includes(q.toLowerCase())).slice(0, 8) : []);
    const exact = C.members.find(m => memNum(m.num) === q);
    if (exact) { UI.form.name = exact.name; UI.form.cert = exact.cert; const n = document.getElementById('p-name'); if (n) n.value = exact.name; }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && UI.sheet) closeSheet();
  if (e.key === 'Enter' && e.target && e.target.id === 'ag-unit') { e.preventDefault(); A['ag-add'](); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.getAttribute && e.target.getAttribute('role') === 'button' && e.target.dataset.act) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.dataset.form === 'note') {
    const text = (UI.form.note || '').trim();
    if (!text) return;
    UI.form.note = '';
    logStream().dispatch('note', {}, text, 'note');
    document.getElementById('note-input')?.focus();
  }
});

/* =====================================================================
   Clocks
   ===================================================================== */
let lastShiftDraw = 0;
let lastDayCheck = 0;
function tick() {
  const t = now();
  if (t % 5000 < 1000) document.querySelectorAll('img[data-cam]').forEach(img => { const u = img.dataset.cam; img.src = u + (u.includes('?') ? '&' : '?') + '_t=' + t; });
  if (t - lastDayCheck > 60000) { lastDayCheck = t; maybeNewDay(); if (document.visibilityState === 'visible') saveUi(); }
  const set = (k, v) => document.querySelectorAll(`[data-clock="${k}"]`).forEach(el => { if (el.textContent !== v) el.textContent = v; });
  set('now', hhmm(t));
  document.querySelectorAll('[data-since]').forEach(el => { const v = dur(t - Number(el.dataset.since)); if (el.textContent !== v) el.textContent = v; });
  if (['shift', 'member', 'event', 'home'].includes(UI.view) && !UI.sheet && t - lastShiftDraw > 20000) { lastShiftDraw = t; render(); return; }
  set('elapsed', S.fresh ? '--:--' : dur(t - S.incident.dispatchAt));
  const due = S.par.last + S.par.interval * 60000, left = due - t;
  set('par', left >= 0 ? dur(left) : '+' + dur(-left));
  set('par-lbl', left >= 0 ? 'PAR due in' : 'PAR overdue');
  const b = document.getElementById('par-btn');
  if (b) { b.classList.toggle('due', left >= 0 && left < 60000); b.classList.toggle('over', left < 0); }
}

/* Keep the screen awake while the board is open, where the browser allows it. */
let lock = null;
async function wake() {
  try { if (!lock && navigator.wakeLock && document.visibilityState === 'visible') { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } } catch (e) { /* not granted */ }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { wake(); tick(); Sync.flushAll(); if (!DIVERT || now() - DIVERT.fetched > 120000) loadDivert(); } });
window.addEventListener('online', () => { Sync.flushAll(); syncChip(); loadDivert(); showToast('Back online. Sending what was saved on this tablet.', false); });
window.addEventListener('offline', () => { syncChip(); showToast('No internet. Keep working: everything is saved on this tablet and goes out when it\'s back.', false); });
/* The site build keeps an offline copy of the app (sw.js), so it opens with no internet. Not inside Claude. */
if ('serviceWorker' in navigator && !IN_CLAUDE && document.querySelector('link[rel="manifest"]')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
window.addEventListener('resize', () => { if (MAP) MAP.invalidateSize(false); });

/* =====================================================================
   Boot
   ===================================================================== */
const before = DEMO ? null : read('sc3:device');   // keep this tablet's job and display from before the clean start
const phone = !!(window.matchMedia && matchMedia('(max-width: 700px)').matches);
DEV = read(K.dev) || { id: 't' + Math.random().toString(36).slice(2, 10), role: (before && before.role !== 'command' && before.role) || (phone ? 'member' : 'supervisor'), mode: (before && before.mode) || 'night', me: null, v: 2 };
// Tablets used to open as Command; the Supervisor board is now where every tablet starts. Once, for tablets set up before.
if ((DEV.v || 1) < 2) {
  if (DEV.role === 'command') { DEV.role = 'supervisor'; const u = read(K.ui) || {}; u.view = 'shift'; write(K.ui, u); }
  DEV.v = 2;
}
saveDev();
if (!DEMO) { try { Object.keys(localStorage).filter(k => k.startsWith('sc3:') && k !== RELAY_KEY).forEach(k => localStorage.removeItem(k)); } catch (e) { /* storage blocked */ } }
C = migrateConfig({ ...defaultConfig(), ...(read(K.cfg) || (DEMO ? sampleConfig() : {})) });
if (isGuest()) C.agency = { ...C.agency, name: RELAY.org || C.agency.name, logo: '' };   // a guest never reads the squad's settings
fitRole();
INC.load(DEMO ? sampleState : freshIncident);
SHIFT.load(DEMO ? sampleShift : () => blankShift());
EVS.load(DEMO ? sampleEvent : () => blankEvent({ none: true }));
loadUi();
render();
setInterval(tick, 1000);
{ const d = read(NS + 'divert'); if (d && d.byId && now() - (d.fetched || 0) < 12 * 3600000) DIVERT = d; }   // last seen, until the relay answers
loadDivert(); setInterval(loadDivert, 180000);
Sync.start();
takeInviteFromAddress();
})();
</script>
