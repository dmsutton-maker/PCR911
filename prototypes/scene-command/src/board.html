<title>OpsBoard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">

<style>
/* Layout: one-screen command board. Incident header with clocks across the top, a rail of views on the left,
   and panels that scroll inside themselves on a landscape tablet, then stack into one column on a phone.
   Night is the default (the PCR911 palette); Day is a high-contrast mode for direct sunlight. */
:root {
  --bg: #0B1B2B;
  --surface: #12293D;
  --raised: #183449;
  --line: #25506E;
  --fg: #EAF2F8;
  --muted: #9FB6C8;
  --faint: #6F8AA0;
  --accent: #4FA3E3;
  --accent-ink: #04121E;
  --ok: #4CC38A;
  --warn: #E8B14C;
  --crit: #E8695C;
  --scrim: rgb(2 8 14 / 0.62);
  --on-solid: #04121E;
  --ag-ems: #4FA3E3;
  --ag-fire: #F0703F;   /* unified command: each agency's color */
  --ag-pd: #7D8BFF;

  --red: #D7373F;     --red-ink: #FFFFFF;
  --yellow: #F2C230;  --yellow-ink: #1D1600;
  --green: #2DB86A;   --green-ink: #03180B;
  --black: #000000;   --black-ink: #FFFFFF;  --black-edge: #8DA3B5;
  --gray: #8B97A4;    --gray-ink: #0B1218;
  --white: #F4F6F8;   --white-ink: #06131F;

  /* map (built-in, offline) */
  --water: #07131E;
  --land: #10263A;
  --land-home: #17344B;
  --town-edge: #2B5878;
  --road-major: #E8B14C;
  --road: #8C7A52;

  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;

  --tap: 56px;
  --r: 12px;
  color-scheme: dark;
}
:root[data-mode="day"] {
  --bg: #FFFFFF;
  --surface: #F2F5F8;
  --raised: #E2E9F0;
  --line: #8EA4B8;
  --fg: #06131F;
  --muted: #2E4558;
  --faint: #536A7D;
  --accent: #0B5FA5;
  --accent-ink: #FFFFFF;
  --ok: #0E7A45;
  --warn: #8C5A00;
  --crit: #B3261E;
  --scrim: rgb(6 19 31 / 0.5);
  --on-solid: #FFFFFF;
  --ag-ems: #0B5FA5;
  --ag-fire: #B8401C;
  --ag-pd: #2B3FBF;
  --red: #C62828;     --red-ink: #FFFFFF;
  --yellow: #F2C230;  --yellow-ink: #1D1600;
  --green: #1E9E55;   --green-ink: #FFFFFF;
  --black: #000000;   --black-ink: #FFFFFF;  --black-edge: #000000;
  --gray: #6B7783;    --gray-ink: #FFFFFF;
  --white: #FFFFFF;   --white-ink: #06131F;
  --water: #C9DCEB;
  --land: #EEF2F5;
  --land-home: #FFFFFF;
  --town-edge: #9DB0C1;
  --road-major: #B56A00;
  --road: #9A8F7A;
  color-scheme: light;
}
/* A fire or police department's devices wear its color, so a glance says whose screen it is. */
:root[data-agency="fire"] { --accent: var(--ag-fire); --accent-ink: #1A0700; }
:root[data-agency="police"] { --accent: var(--ag-pd); --accent-ink: #070A24; }
:root[data-mode="day"][data-agency="fire"], :root[data-mode="day"][data-agency="police"] { --accent-ink: #FFFFFF; }

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 500 16px/1.4 var(--body);
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- shell ---------- */
.app {
  height: 100%;
  box-sizing: border-box;
  display: grid;
  grid-template-columns: 84px minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "head head" "rail main";
  gap: 12px;
  padding-inline: 16px;
  padding-block: 12px;
}
.head { grid-area: head; }
.rail { grid-area: rail; }
.main { grid-area: main; min-height: 0; overflow: auto; overscroll-behavior: contain; }

/* ---------- header ---------- */
.head { display: flex; align-items: stretch; gap: 16px; flex-wrap: wrap; }
.inc { flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 4px; justify-content: center; }
.inc-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.inc h1 { margin: 0; font: 700 27px/1.1 var(--display); letter-spacing: 0.01em; text-wrap: balance; }
.titlebtn { all: unset; cursor: pointer; border-radius: 6px; }
.titlebtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.inc-sub { color: var(--muted); font-size: 15px; }
.inc-sub b { color: var(--fg); font-weight: 600; }
.tag {
  display: inline-flex; align-items: center; gap: 6px;
  font: 700 13px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase;
  padding: 6px 9px; border-radius: 6px;
  border: 1.5px solid var(--line); color: var(--muted); background: transparent;
}
button.tag { min-height: 32px; }
.tag.mci { background: var(--crit); border-color: var(--crit); color: var(--on-solid); }
.tag.suggest { border-color: var(--warn); color: var(--warn); }
.tag.sample { border-style: dashed; }
.tag.live { border-color: var(--ok); color: var(--ok); }
.tag.role { border-color: var(--accent); color: var(--accent); }
.tag.role.r-fire { border-color: var(--ag-fire); color: var(--ag-fire); }
.tag.role.r-police { border-color: var(--ag-pd); color: var(--ag-pd); }
.agtag { display: inline-block; min-width: 54px; text-align: center; font: 700 12px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; padding: 5px 6px; border-radius: 5px; color: #fff; background: var(--accent); }
.agtag.fire { background: var(--ag-fire); } .agtag.police { background: var(--ag-pd); } .agtag.ems { background: var(--ag-ems); color: #04121E; }
:root[data-mode="day"] .agtag.ems { color: #fff; }
.ucrows { display: flex; flex-direction: column; gap: 6px; }
.ucrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 48px; padding: 6px 10px; border-radius: var(--r); border: 1.5px solid var(--line); background: transparent; text-align: left; }
.ucrow.me { border-color: var(--fg); }
.ucwho { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ucb .row { grid-template-columns: auto minmax(0, 1fr) auto; }
.stat.k-R { box-shadow: inset 4px 0 0 var(--red); } .stat.k-Y { box-shadow: inset 4px 0 0 var(--yellow); } .stat.k-G { box-shadow: inset 4px 0 0 var(--green); }
.pk.pt { background: var(--ag-pd); color: #fff; }
.pk.pt.k-closure, .pin.pt.k-closure { background: var(--crit); color: #fff; }
.pk.pt.k-reunif, .pin.pt.k-reunif { background: var(--green); color: var(--green-ink); }
.pk.pt.k-media, .pin.pt.k-media { background: var(--raised); color: var(--fg); }

.clocks { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
.clock, .par, .iconbtn {
  display: flex; flex-direction: column; justify-content: center; gap: 2px;
  min-width: 96px; padding: 8px 12px; border-radius: var(--r);
  background: var(--surface); border: 1px solid var(--line); text-align: left;
}
.clock .v, .par .v { font: 700 24px/1 var(--mono); font-variant-numeric: tabular-nums; }
.lbl { font: 600 12px/1 var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
.par { min-width: 118px; }
.par.due { border-color: var(--warn); }
.par.due .v { color: var(--warn); }
.par.over { background: var(--crit); border-color: var(--crit); }
.par.over .v, .par.over .lbl { color: var(--on-solid); }
.iconbtn { min-width: 64px; align-items: center; }
.iconbtn svg { width: 26px; height: 26px; }

/* ---------- rail ---------- */
.rail { display: flex; flex-direction: column; gap: 3px; min-height: 0; overflow: auto; }
.rail button {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  min-height: 56px; flex-shrink: 0; border-radius: var(--r);
  background: transparent; border: 1px solid transparent; color: var(--muted);
  font: 600 12px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase;
}
.rail button svg { width: 26px; height: 26px; }
.rail button[aria-current="page"] { background: var(--raised); border-color: var(--line); color: var(--fg); }
.rail button[aria-current="page"] svg { color: var(--accent); }
.rail .spacer { flex: 1; }
.badge {
  min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; box-sizing: border-box;
  background: var(--crit); color: var(--on-solid); font: 700 12px/20px var(--mono); text-align: center;
}
.rail .ico { position: relative; }
.rail .ico .badge { position: absolute; top: -6px; right: -14px; }
svg.i { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- panels ---------- */
.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0;
}
.ph { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.ph h2 { margin: 0; font: 700 15px/1 var(--display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.ph .meta { color: var(--faint); font-size: 14px; }
.empty { color: var(--faint); font-size: 15px; padding: 6px 0; }

.btn {
  min-height: var(--tap); padding: 0 18px; border-radius: 10px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--raised); border: 1.5px solid var(--line); color: var(--fg);
  font: 700 18px/1 var(--display); letter-spacing: 0.04em; text-decoration: none;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { border-color: var(--crit); color: var(--crit); background: transparent; }
.btn.small { min-height: 44px; font-size: 16px; padding: 0 14px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn svg { width: 22px; height: 22px; }

/* ---------- board ---------- */
.board {
  display: grid;
  grid-template-columns: minmax(300px, 1fr) minmax(300px, 1fr) minmax(330px, 1.15fr);
  gap: 12px; height: 100%; min-height: 0;
}
.col { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: auto; overscroll-behavior: contain; }

/* triage */
.tri-sum { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.tri-total { font: 700 44px/1 var(--display); }
.tri-total small { font: 600 16px/1 var(--body); color: var(--muted); margin-left: 6px; }
.est { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; }
.est button { width: 40px; height: 40px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--raised); font: 700 20px/1 var(--mono); }
.est .num { min-width: 2ch; text-align: center; font-weight: 700; color: var(--fg); }
.bar { height: 8px; border-radius: 4px; background: var(--raised); overflow: hidden; display: flex; }
.bar span { display: block; height: 100%; }

.tri {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px;
  padding: 10px 10px 10px 14px; border-radius: var(--r);
  border: 2px solid var(--c); background: color-mix(in srgb, var(--c) 14%, var(--surface));
}
.tri-R { --c: var(--red); --ink: var(--red-ink); }
.tri-Y { --c: var(--yellow); --ink: var(--yellow-ink); }
.tri-G { --c: var(--green); --ink: var(--green-ink); }
.tri-X { --c: var(--gray); --ink: var(--gray-ink); }
.tri-W { --c: var(--white); --ink: var(--white-ink); }
:root[data-mode="day"] .tri-W { --c: #6B7783; }
:root[data-mode="day"] .tri-W .swatch, :root[data-mode="day"] .tri-W .tri-btns button.plus { background: #FFFFFF; color: #06131F; border: 1.5px solid #6B7783; }
.tri-B { --c: var(--black-edge); --ink: var(--black-ink); background: color-mix(in srgb, var(--black) 55%, var(--surface)); }
:root[data-mode="day"] .tri-B { background: #2A2F35; color: #FFFFFF; }
:root[data-mode="day"] .tri-B .tri-sub { color: #D3DCE4; }
.tri-head { display: flex; align-items: center; gap: 8px; }
.swatch { font: 700 13px/1 var(--display); letter-spacing: 0.1em; text-transform: uppercase; padding: 5px 8px; border-radius: 5px; background: var(--c); color: var(--ink); }
.tri-B .swatch { background: var(--black); color: var(--black-ink); border: 1.5px solid var(--black-edge); }
:root[data-mode="day"] .tri-B .swatch { border-color: #FFFFFF; }
.tri-name { font: 700 19px/1.05 var(--display); letter-spacing: 0.04em; text-transform: uppercase; overflow-wrap: anywhere; }
.board .tri-btns button { width: 54px; height: 68px; }
.board .tri-head { flex-wrap: wrap; row-gap: 4px; }
.tri-count { font: 700 56px/0.95 var(--display); font-variant-numeric: tabular-nums; margin-top: 2px; }
.tri-sub { font-size: 14px; color: var(--muted); }
.tri-sub b { color: var(--fg); }
:root[data-mode="day"] .tri-B .tri-sub b { color: #FFFFFF; }
.tri-btns { display: flex; gap: 8px; }
.tri-btns button { width: 64px; height: 72px; border-radius: 10px; font: 700 34px/1 var(--display); border: 2px solid var(--c); background: var(--surface); color: var(--fg); }
.tri-btns button.plus { background: var(--c); color: var(--ink); }
.tri-B .tri-btns button.plus { background: var(--black); color: var(--black-ink); border-color: var(--black-edge); }
:root[data-mode="day"] .tri-B .tri-btns button { background: #000; color: #FFF; border-color: #FFF; }

/* key/value strip */
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 15px; margin: 0; }
.kv dt { color: var(--faint); font: 600 13px/1.6 var(--display); letter-spacing: 0.08em; text-transform: uppercase; }
.kv dd { margin: 0; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.hz { font: 600 14px/1 var(--display); letter-spacing: 0.04em; padding: 6px 9px; border-radius: 6px; border: 1.5px solid var(--warn); color: var(--warn); }

/* benchmarks */
.bench { display: flex; flex-direction: column; }
.bench button {
  display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px;
  min-height: 50px; padding: 4px; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--line);
}
.bench button:last-child { border-bottom: 0; }
.tick { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.tick svg { width: 18px; height: 18px; opacity: 0; }
.bench .done .tick { background: var(--ok); border-color: var(--ok); color: var(--on-solid); }
.bench .done .tick svg { opacity: 1; }
.bench .b-label { font-size: 16px; font-weight: 600; }
.bench .todo .b-label { color: var(--muted); font-weight: 500; }
.bench .ready .b-label { color: var(--warn); font-weight: 600; }
.bench .b-time { text-align: right; font: 700 15px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
.bench .b-time small { display: block; font-size: 12px; color: var(--faint); font-weight: 500; }
.bench .b-ready { font: 700 14px/1 var(--display); letter-spacing: 0.08em; color: var(--warn); }

/* stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(78px, 1fr)); gap: 8px; }
.stat { background: var(--raised); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat .v { font: 700 30px/1 var(--display); font-variant-numeric: tabular-nums; }
.stat.R { background: var(--red); color: var(--red-ink); }
.stat.Y { background: var(--yellow); color: var(--yellow-ink); }
.stat.G { background: var(--green); color: var(--green-ink); }
.stat.R .lbl, .stat.Y .lbl, .stat.G .lbl { color: inherit; opacity: 0.85; }

/* list rows */
.rows { display: flex; flex-direction: column; }
.row {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px;
  min-height: 52px; padding: 6px 2px; border: 0; border-bottom: 1px solid var(--line);
  background: transparent; text-align: left; width: 100%; box-sizing: border-box;
}
.row:last-child { border-bottom: 0; }
.row .t1 { font-weight: 600; }
.row .t2 { font-size: 14px; color: var(--muted); }
.row .r { text-align: right; }
.dot { width: 14px; height: 14px; border-radius: 4px; background: var(--c); border: 1.5px solid var(--c); }
.dot.B { background: var(--black); border-color: var(--black-edge); }
.c-R { --c: var(--red); } .c-Y { --c: var(--yellow); } .c-G { --c: var(--green); } .c-B { --c: var(--black-edge); }

.pill { display: inline-block; font: 700 12px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; padding: 5px 7px; border-radius: 5px; border: 1.5px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.requested { border-color: var(--warn); color: var(--warn); }
.pill.ack, .pill.enroute { border-color: var(--accent); color: var(--accent); }
.pill.onscene, .pill.done, .pill.open { border-color: var(--ok); color: var(--ok); }
.pill.diversion { border-color: var(--crit); color: var(--crit); }
.pill.advisory { border-color: var(--warn); color: var(--warn); }

/* hospital load */
.load { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 7px 0; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; width: 100%; }
.load:last-child { border-bottom: 0; }
.load .nm { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.load .ct { font: 600 14px/1 var(--mono); color: var(--muted); }
.load .bar { grid-column: 1 / -1; height: 8px; }
.load .why { grid-column: 1 / -1; display: flex; gap: 5px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }

/* ---------- map ---------- */
.mapcard { position: relative; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); background: var(--water); min-height: 0; }
.mapcard.mini { height: 270px; flex-shrink: 0; }
.mapslot, .mapbox { position: absolute; inset: 0; }
.map-park { position: fixed; left: -9999px; top: 0; width: 400px; height: 300px; visibility: hidden; }
.mapctl { position: absolute; z-index: 1100; display: flex; gap: 6px; }
.mapctl.tr { top: 8px; right: 8px; }
.mapctl.bl { bottom: 8px; left: 8px; right: 8px; flex-wrap: wrap; pointer-events: none; }
.mapctl.bl > * { pointer-events: auto; }
.mbtn {
  min-height: 44px; min-width: 44px; padding: 0 12px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1.5px solid var(--line); color: var(--fg);
  font: 700 15px/1 var(--display); letter-spacing: 0.05em; text-decoration: none;
  box-shadow: 0 2px 10px rgb(0 0 0 / 0.25);
}
.mbtn svg { width: 22px; height: 22px; }
.mbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.mchip { padding: 6px 9px; border-radius: 8px; background: color-mix(in srgb, var(--bg) 85%, transparent); border: 1px solid var(--line); font: 600 13px/1.2 var(--mono); color: var(--fg); }
.mchip.warn { color: var(--warn); border-color: var(--warn); font-family: var(--display); letter-spacing: 0.04em; }
.map-fallback { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; text-align: center; color: var(--muted); }

.leaflet-container { background: var(--water); font: 500 14px/1.3 var(--body); }
.leaflet-touch .leaflet-bar a { width: 44px; height: 44px; line-height: 44px; font-size: 22px; }
.leaflet-bar a, .leaflet-bar a:hover { background: var(--surface); color: var(--fg); border-bottom-color: var(--line); }
.leaflet-touch .leaflet-bar { border: 1.5px solid var(--line); }
.leaflet-control-attribution.leaflet-control { background: color-mix(in srgb, var(--bg) 75%, transparent); color: var(--faint); font-size: 10px; }
.leaflet-control-attribution a { color: var(--muted); }
.mapcard.mini .leaflet-control-zoom { display: none; }

.pin {
  width: 34px; height: 34px; box-sizing: border-box; border-radius: 50%;
  display: grid; place-items: center; font: 700 14px/1 var(--display); letter-spacing: 0.02em;
  border: 3px solid #FFFFFF; box-shadow: 0 2px 8px rgb(0 0 0 / 0.5);
}
.pin.scene { background: var(--crit); color: #FFFFFF; width: 40px; height: 40px; font-size: 13px; }
.pin.staging { background: var(--warn); color: #1D1600; }
.pin.cstage { background: var(--surface); color: var(--warn); border: 2.5px dashed var(--warn); width: 30px; height: 30px; font-size: 12px; }
.pin.lz { background: var(--accent); color: var(--accent-ink); }
.pin.me { background: #2F7BFF; width: 22px; height: 22px; }
.pin.hosp { border-radius: 7px; width: 28px; height: 28px; background: var(--surface); color: var(--fg); border: 2.5px solid var(--accent); font-size: 15px; }
.pin.hosp.trauma { background: var(--crit); color: #FFFFFF; border-color: #FFFFFF; }
.town-label { font: 700 12px/1 var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; text-shadow: 0 0 3px var(--bg), 0 0 3px var(--bg); pointer-events: none; transform: translate(-50%, -50%); }

.mapview { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; height: 100%; min-height: 0; }
.mapview .mapcard { height: 100%; min-height: 420px; }
.mapside { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: auto; }
.coord { font: 600 15px/1.5 var(--mono); }
.coord small { display: block; color: var(--faint); font: 500 12px/1.3 var(--body); }

/* ---------- generic view layouts ---------- */
.view { display: flex; flex-direction: column; gap: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: start; }
.grid-hosp { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; align-items: start; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar .grow { flex: 1; }
.view-title { margin: 0; font: 700 26px/1 var(--display); letter-spacing: 0.02em; }

/* units */
.lanes { display: grid; grid-template-columns: repeat(6, minmax(160px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.lane { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.lane h3 { margin: 0; display: flex; justify-content: space-between; font: 700 14px/1 var(--display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.unit { position: relative; display: flex; flex-direction: column; border-radius: 10px; background: var(--raised); border: 1.5px solid var(--line); }
.unit .open { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 10px; background: transparent; border: 0; min-height: var(--tap); }
.unit .u1 { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.unit .uid { font: 700 21px/1 var(--display); letter-spacing: 0.02em; }
.unit .ut { font-size: 14px; color: var(--muted); }
.unit .task { font: 600 14px/1.2 var(--body); color: var(--fg); }
.unit .quick { margin: 0 8px 8px; min-height: 44px; border-radius: 8px; border: 1.5px solid var(--accent); background: transparent; color: var(--accent); font: 700 15px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; }
.kind { font: 700 12px/1 var(--display); letter-spacing: 0.08em; padding: 4px 6px; border-radius: 4px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.kind.g-ems.ALS { color: var(--crit); border-color: var(--crit); }
.kind.SUP, .kind.MCI { color: var(--warn); border-color: var(--warn); }
.kind.g-fire { color: var(--crit); border-color: var(--crit); background: color-mix(in srgb, var(--crit) 12%, var(--bg)); }
.kind.g-spec { color: var(--warn); border-color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, var(--bg)); }
.ppl { width: 100%; border-collapse: collapse; font-size: 15px; }
.ppl th { text-align: left; font: 600 12px/1 var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); padding: 6px 8px; border-bottom: 1px solid var(--line); }
.ppl td { padding: 0; border-bottom: 1px solid var(--line); }
.ppl td button { all: unset; display: block; box-sizing: border-box; width: 100%; padding: 12px 8px; cursor: pointer; }
.ppl td button:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
.scroll-x { overflow-x: auto; }

/* hospitals */
.hosp { gap: 10px; text-align: left; }
.hosp[role="button"] { cursor: pointer; }
.hosp h3 { margin: 0; font: 700 21px/1.1 var(--display); }
.hosp .sub { color: var(--muted); font-size: 14px; }
.caps { display: flex; flex-wrap: wrap; gap: 5px; }
.cap { font: 600 13px/1 var(--display); letter-spacing: 0.04em; padding: 5px 7px; border-radius: 5px; background: var(--raised); color: var(--fg); }
.cap.trauma { background: var(--crit); color: var(--on-solid); }
.capgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.capcell { border-radius: 10px; padding: 8px; border: 2px solid var(--c); display: flex; flex-direction: column; gap: 2px; }
.capcell .v { font: 700 22px/1 var(--mono); font-variant-numeric: tabular-nums; }
.capcell.over { background: color-mix(in srgb, var(--crit) 22%, var(--surface)); }
.beds { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.bedcell { background: var(--raised); border-radius: 8px; padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; }
.bedcell .v { font: 700 18px/1 var(--mono); }
.bedcell .v.none { color: var(--faint); font-weight: 500; }
.dist { font: 700 15px/1 var(--mono); color: var(--fg); white-space: nowrap; }
.note { font-size: 14px; color: var(--faint); }
.note b { color: var(--muted); }
.ok-t { color: var(--ok); } .warn-t { color: var(--warn); } .crit-t { color: var(--crit); }

/* phone directory */
.phone { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--line); }
.phone:last-child { border-bottom: 0; }
.phone .pn { font-weight: 600; }
.phone .pnote { font-size: 13px; color: var(--muted); }
.phone .pnum { font: 700 19px/1.2 var(--mono); user-select: all; -webkit-user-select: all; }
.phone .pact { display: flex; gap: 6px; }
.phone .pnum.missing { font: 500 14px var(--body); color: var(--faint); user-select: none; }

/* ICS chart */
.ics { display: flex; flex-direction: column; gap: 14px; }
.tier { display: flex; flex-direction: column; gap: 8px; }
.tier > .lbl { padding-left: 2px; }
.tier-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.pos { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 10px 12px; border-radius: 10px; min-height: 64px; background: var(--surface); border: 1.5px solid var(--line); }
.pos .pn { font: 700 14px/1.1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.pos .pw { font: 600 18px/1.2 var(--body); }
.pos.vacant { border-style: dashed; }
.pos.vacant .pw { color: var(--faint); font-weight: 500; font-size: 15px; }
.pos.lead { border-color: var(--accent); }
.branch { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.branch-col { display: flex; flex-direction: column; gap: 8px; }
.branch-col .subs { display: flex; flex-direction: column; gap: 8px; padding-left: 12px; border-left: 2px solid var(--line); }

/* radio scripts */
.script { font: 500 19px/1.5 var(--body); margin: 0; white-space: pre-wrap; }
.script b { font-family: var(--display); letter-spacing: 0.06em; color: var(--accent); }
.script .k { display: inline-block; min-width: 1.4em; font: 700 19px/1 var(--display); color: var(--accent); }

/* log */
.log { display: flex; flex-direction: column; }
.log .entry { display: grid; grid-template-columns: 64px 92px minmax(0, 1fr); gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); align-items: baseline; }
.log .entry:last-child { border-bottom: 0; }
.log .lt { font: 700 15px/1 var(--mono); }
.log .lk { font: 700 12px/1.3 var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
.log .lk small { display: block; font-weight: 600; color: var(--muted); letter-spacing: 0.06em; }
.composer { display: flex; gap: 8px; }
.composer input { flex: 1; min-width: 0; }

/* inputs */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > .lbl { padding-left: 2px; }
input[type="text"], input[type="search"], input:not([type]), textarea {
  min-height: var(--tap); box-sizing: border-box; padding: 0 14px; border-radius: 10px;
  border: 1.5px solid var(--line); background: var(--bg); font-size: 18px; width: 100%;
}
textarea { padding: 12px 14px; min-height: 140px; resize: vertical; font: 500 16px/1.5 var(--mono); }
.opt {
  min-height: 52px; padding: 0 16px; border-radius: 10px; background: var(--raised); border: 1.5px solid var(--line);
  font: 700 17px/1.1 var(--display); letter-spacing: 0.03em; text-align: left; display: inline-flex; align-items: center; gap: 8px;
}
.opt[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt[aria-pressed="true"] .kind { background: transparent; color: inherit; border-color: currentColor; }
.opt small { font: 500 13px/1.2 var(--body); opacity: 0.85; letter-spacing: 0; }
.opt.tall { min-height: 64px; flex-direction: column; align-items: flex-start; justify-content: center; gap: 3px; padding: 8px 14px; }
.opt.cat-R { box-shadow: inset 8px 0 0 var(--red); }
.opt.cat-Y { box-shadow: inset 8px 0 0 var(--yellow); }
.opt.cat-G { box-shadow: inset 8px 0 0 var(--green); }
.cps { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.cp { font: 700 12px/1.5 var(--display); letter-spacing: 0.02em; padding: 1px 7px; border-radius: 5px; }
.cp.c-R { background: var(--red); color: var(--red-ink); }
.cp.c-Y { background: var(--yellow); color: var(--yellow-ink); }
.cp.c-G { background: var(--green); color: var(--green-ink); }
.cp.zero { opacity: 0.4; }
.cp.sel { outline: 2px solid var(--fg); outline-offset: 1px; }
.edlive { font-size: 14px; padding: 6px 10px; border-radius: 8px; border-left: 6px solid var(--line); background: var(--raised); text-align: left; }
.edlive.ed-green { border-left-color: var(--ok); }
.edlive.ed-red, .edlive.ed-black { border-left-color: var(--crit); }
.edlive.ed-red b, .edlive.ed-black b { color: var(--crit); }
.edlive.ed-yellow, .edlive.ed-orange, .edlive.ed-purple, .edlive.ed-blue { border-left-color: var(--warn); }
.btn.mci-up { border-color: var(--crit); color: var(--crit); }
.pin.cam { background: var(--surface); color: var(--fg); border: 2.5px solid var(--fg); border-radius: 6px; width: 30px; height: 30px; font-size: 10px; }
.camimg { width: 100%; border-radius: 10px; background: #000; min-height: 120px; object-fit: contain; }
.opt.cat-R[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: var(--red-ink); }
.opt.cat-Y[aria-pressed="true"] { background: var(--yellow); border-color: var(--yellow); color: var(--yellow-ink); }
.opt.cat-G[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--green-ink); }
.opt.small { min-height: 44px; font-size: 15px; padding: 0 12px; }
.opt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.opt-grid.wide { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.stepper { display: inline-flex; align-items: center; gap: 10px; }
.stepper button { width: 52px; height: 52px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--raised); font: 700 26px/1 var(--display); }
.stepper .v { min-width: 2.2em; text-align: center; font: 700 26px/1 var(--mono); }
.stepper.sm button { width: 44px; height: 44px; font-size: 22px; }
.stepper.sm .v { font-size: 20px; min-width: 1.8em; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: var(--tap); flex-wrap: wrap; }
.parse { font: 500 14px/1.5 var(--mono); color: var(--muted); }

/* sheet */
.sheet-wrap { position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center; background: var(--scrim); padding: 16px; }
.sheet {
  width: min(780px, 100%); max-height: 100%; box-sizing: border-box; overflow: auto; overscroll-behavior: contain;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px 20px;
  display: flex; flex-direction: column; gap: 16px;
}
.sheet-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; position: sticky; top: -18px; background: var(--surface); padding-block: 4px; z-index: 1; }
.sheet-h h2 { margin: 0; font: 700 26px/1.1 var(--display); }
.sheet-f { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; position: sticky; bottom: -20px; background: var(--surface); padding-block: 10px; }
.sheet-f .grow { flex: 1; }
.close { width: 52px; height: 52px; flex-shrink: 0; border-radius: 10px; border: 1.5px solid var(--line); background: var(--raised); display: grid; place-items: center; }
.close svg { width: 24px; height: 24px; }

/* toast */
.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  z-index: 3000; display: flex; align-items: center; gap: 14px; max-width: min(560px, calc(100% - 32px)); box-sizing: border-box;
  padding: 10px 10px 10px 18px; border-radius: 12px; background: var(--fg); color: var(--bg); font-weight: 600;
  box-shadow: 0 8px 30px rgb(0 0 0 / 0.35);
}
.toast button { min-height: 44px; padding: 0 16px; border-radius: 8px; border: 0; background: var(--accent); color: var(--accent-ink); font: 700 17px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; flex-shrink: 0; }
.toast span { min-width: 0; }

/* ---------- role screens ---------- */
.triview { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(300px, 1fr); gap: 12px; align-items: start; }
.tri-big .tri { padding: 14px 14px 14px 18px; }
.tri-big .tri-name { font-size: 22px; }
.tri-big .tri-count { font-size: 84px; }
.tri-big .tri-btns button { width: 92px; height: 104px; font-size: 46px; }
.opt.retri { justify-content: center; gap: 6px; }
.opt.retri .dot { flex-shrink: 0; }
.desk { display: grid; grid-template-columns: minmax(270px, 1fr) minmax(380px, 1.4fr) minmax(270px, 1fr); gap: 12px; height: 100%; min-height: 0; }
.desk .col { overflow: auto; }
.hgrid { display: flex; flex-direction: column; }
.hrow { display: grid; grid-template-columns: minmax(0, 1fr) repeat(3, 62px) 54px; gap: 6px; align-items: center; min-height: 58px; padding: 6px 2px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; width: 100%; }
.hrow:last-child { border-bottom: 0; }
.hrow.head { min-height: 0; padding-block: 4px 8px; font: 600 12px/1 var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
.hrow .hn { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.hrow .hn b { font-weight: 600; }
.hrow .hn small { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hrow .hc { border: 2px solid var(--c); border-radius: 8px; padding: 6px 4px; text-align: center; font: 600 14px/1 var(--mono); color: var(--muted); }
.hrow .hc b { color: var(--fg); font-size: 17px; }
.hrow .hc.full { background: color-mix(in srgb, var(--crit) 22%, var(--surface)); }
.hrow .ht { font: 600 13px/1 var(--mono); text-align: center; }

/* ---------- shift board ---------- */
.shift { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(340px, 1.25fr) minmax(280px, 1fr); gap: 12px; height: 100%; min-height: 0; }
.shift .col { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: auto; overscroll-behavior: contain; }
.sunits { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.sunit { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; text-align: left; padding: 10px; border-radius: 10px; background: var(--raised); border: 2px solid var(--line); min-height: 96px; }
.sunit .u1 { display: flex; justify-content: space-between; align-items: center; gap: 6px; width: 100%; }
.sunit .uid { font: 700 22px/1 var(--display); }
.sunit .sstat { font: 700 16px/1.15 var(--display); letter-spacing: 0.03em; }
.sunit .ut { font-size: 13px; color: var(--muted); }
.sunit .crewline { font-size: 13px; color: var(--fg); }
.sunit .crewline small { color: var(--faint); }
.sunit.st-in { border-color: var(--ok); }
.sunit.st-in .sstat { color: var(--ok); }
.sunit.st-busy { border-color: var(--accent); }
.sunit.st-busy .sstat { color: var(--accent); }
.sunit.st-oos { border-style: dashed; opacity: 0.85; }
.sunit.st-oos .sstat { color: var(--faint); }
.call { border: 1.5px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--raised); }
.call.al-crit { border-color: var(--crit); }
.call.al-warn { border-color: var(--warn); }
.call .ct { font: 700 21px/1.1 var(--display); }
.call .ca { color: var(--muted); font-size: 15px; }
.call .uid { font: 700 20px/1 var(--display); }
.csteps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.cs { display: flex; flex-direction: column; gap: 2px; padding: 5px 6px; border-radius: 6px; border: 1px solid var(--line); min-width: 0; }
.cs b { font: 700 11px/1.1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cs small { font: 600 13px/1 var(--mono); color: var(--muted); min-height: 13px; }
.cs.done { background: color-mix(in srgb, var(--ok) 14%, var(--surface)); border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); }
.cs.now { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--surface)); }
.cs.now b { color: var(--fg); }
.cline { font-size: 15px; }
.calert { font: 700 15px/1.2 var(--display); letter-spacing: 0.03em; padding: 8px 10px; border-radius: 8px; }
.calert.crit { background: var(--crit); color: var(--on-solid); }
.calert.warn { border: 1.5px solid var(--warn); color: var(--warn); }
.shift .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.resp { display: flex; flex-wrap: wrap; gap: 6px; }
.rchip { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 6px 10px; border-radius: 9px; border: 1.5px solid var(--accent); background: var(--surface); text-align: left; min-height: 48px; justify-content: center; }
.rchip b { font: 700 15px/1.1 var(--display); letter-spacing: 0.02em; }
.rchip small { font-size: 12px; color: var(--muted); }
.rchip .rst { font: 600 12px/1.2 var(--display); letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent); }
.rchip.st-onscene { border-color: var(--ok); }
.rchip.st-onscene .rst { color: var(--ok); }
.rchip.add { border-style: dashed; border-color: var(--line); flex-direction: row; align-items: center; gap: 6px; color: var(--muted); }
.rchip.add svg { width: 18px; height: 18px; }
.pill.pbtn { cursor: pointer; background: transparent; min-height: 32px; }
.mview { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 680px; margin-inline: auto; }
.mview .mh { margin: 0; font: 700 15px/1 var(--display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.mcall { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.mcall.need { border-color: var(--crit); }
.mcall .ct { font: 700 24px/1.1 var(--display); }
.mcall .ca { font-size: 17px; color: var(--fg); }
.mcall .uid { font: 700 20px/1 var(--display); }
.mcall .pill { align-self: flex-start; font-size: 13px; }
.btn.big { min-height: 68px; width: 100%; font-size: 24px; }
.head.mhead { flex-wrap: nowrap; align-items: flex-start; }
.mhead .clocks { width: auto; flex: 0 0 auto; }
.mhead .iconbtn { flex: 0 0 auto; min-width: 56px; padding: 8px; }
.osq { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
.alogo { height: 1.15em; width: auto; max-width: 2.4em; vertical-align: -0.2em; margin-right: 0.35em; border-radius: 6px; object-fit: contain; }
.alogo.sm { height: 22px; float: right; margin: 0 0 0 8px; }
.alogo.big { height: 72px; max-width: 144px; border-radius: 12px; background: var(--raised); display: inline-grid; place-items: center; }
.alogo.big.empty { width: 72px; font-size: 12px; color: var(--faint); border: 1.5px dashed var(--line); }
.logo-pick { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.logo-pick label.btn { cursor: pointer; }
.rbmark { border-radius: 22%; flex: none; display: block; }
.rail .brand { padding: 4px 0 8px; margin-bottom: 4px; border-bottom-color: var(--line); border-radius: var(--r) var(--r) 0 0; }
.rail .brand[aria-current="page"] { border-color: var(--line); }
.home { max-width: 1180px; }
.home-q { margin: 2px 0 2px; font: 700 26px/1.15 var(--display); }
.ws-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }

const player = typeof Audio === 'function' ? new Audio() : null;
let PLAYING = null;   // { id, name }
function playFeed(f) {
  if (!player) return;

  if (!url) { showToast('That feed has no usable link', false); return; }
  player.src = url; player.preload = 'none';

  player.play().then(() => { if (PLAYING && PLAYING.id === f.id) { PLAYING.state = 'live'; drawPlayer(); } }).catch(() => { stopFeed(); showToast(`Couldn't play ${f.name}. Check the link, or that you're online.`, false); });

const sentCat = k => S.transports.filter(t => t.cat === k).reduce((a, t) => a + t.n, 0);
const remaining = k => Math.max(0, S.triage[k] - sentCat(k));
const totalPts = () => PATIENT_KEYS.reduce((a, k) => a + (S.triage[k] || 0), 0);
const totalSent = () => S.transports.reduce((a, t) => a + t.n, 0);
const remainingTx = () => TX_CATS.reduce((a, k) => a + remaining(k), 0);
const hospSent = (id, k) => S.transports.filter(t => t.hosp === id && (!k || t.cat === k)).reduce((a, t) => a + t.n, 0);
const hospState = id => S.hospitals[id] || {};
const hospCap = id => hospState(id).cap || null;
const unitsBy = st => S.units.filter(u => u.status === st);
const openRequests = () => S.requests.filter(r => r.status !== 'onscene' && r.status !== 'cancelled');
const sceneLL = () => {
  const w = wsNow(), me = DEV.me && DEV.me.ll;
  if (w === 'event' && eventLive()) { const po = EV.posts.find(x => x.ll); return EV.event.ll || (po && po.ll) || me || S.incident.ll || null; }
  if (w === 'sup' || w === 'member' || w === 'home') return (mciLive() && S.incident.ll) || me || S.incident.ll || townLL(S.incident.municipality);
  return S.incident.ll || townLL(S.incident.municipality);
};
const hospMiles = h => miles(sceneLL(), h.ll);
const byDistance = list => { const o = sceneLL(); return o ? list.slice().sort((a, b) => miles(o, a.ll) - miles(o, b.ll)) : list.slice(); };

/* NJ Disaster Triage Tag guidance: tag when there are 4+ Red, 6+ mixed, or 8+ Green patients. */
const tagRuleMet = () => (S.triage.R || 0) >= 4 || Math.max(totalPts(), S.incident.est || 0) >= 6 || (S.triage.G || 0) >= 8;
const squadsInvolved = () => new Set(S.units.filter(u => kindOf(u.kind).g === 'ems' && !['available', 'released'].includes(u.status)).map(u => (u.agency || u.name).toLowerCase())).size;
function notices() {
  const out = [];
  if (tagRuleMet()) out.push('NJ tag rule met (4+ Red, 6+ patients, or 8+ Green): tag every patient.');
  const sq = squadsInvolved();
  if (sq >= 5) out.push(`${sq} EMS agencies on the board. County EMS Coordinator is notified at 5+ squads or 3+ towns.`);
  if (sq >= 6 && S.incident.mciLevel >= 2) out.push('Field Comm responds automatically to an MCI with 6+ squads.');
  return out;
}
const levelOf = lvl => MCI_LEVELS.find(x => x.level === lvl) || { label: `Level ${lvl}`, say: `level ${lvl}` };
const levelLabel = lvl => levelOf(lvl).label;

function benchReady(id) {
  if (S.bench[id]) return false;
  if (id === 'reds') return S.triage.R > 0 && remaining('R') === 0;
  if (id === 'allpts') return totalPts() > 0 && remainingTx() === 0;
  if (id === 'mci') return tagRuleMet();
  return false;
}

function triagePanel() {
  const n = totalPts(), est = S.incident.est || 0;
  const denom = Math.max(n, est, 1);
  const seg = catsList().filter(c => c.k !== 'W').map(c => `<span style="width:${((S.triage[c.k] || 0) / denom) * 100}%;background:var(--${COLOR_VAR[c.k]})"></span>`).join('');
  return `<section class="panel" aria-label="Triage counts">
    <div class="ph"><h2>Patients · triage</h2><button class="btn small" data-act="sheet" data-arg="menu">${esc(S.method || 'START')}</button></div>
    <div class="tri-sum">
      <div class="tri-total num">${n}<small>${n === 1 ? 'patient' : 'patients'}</small></div>
      <div class="est">Est. <button data-act="est" data-arg="-1" aria-label="Lower estimate">−</button><span class="num">${est}</span><button data-act="est" data-arg="1" aria-label="Raise estimate">+</button></div>
    </div>
    <div class="bar" role="img" aria-label="${n} of an estimated ${est} triaged">${seg}</div>
    ${catsList().map(triRow).join('')}

function triRow(c) {
  const count = S.triage[c.k] || 0;

    : c.k === 'W' ? 'Not counted as patients'
    : `${sentCat(c.k)} transported · <b>${remaining(c.k)} on scene</b>`;
  return `<div class="tri tri-${c.k}">
    <div>
      <div class="tri-head"><span class="swatch">${c.color}</span><span class="tri-name">${c.name}</span></div>
      <div class="tri-count num">${count}</div>
      <div class="tri-sub">${sub}</div>
    </div>
    <div class="tri-btns">
      <button data-act="tri" data-arg="${c.k}-" aria-label="Remove one ${c.name}">−</button>
      <button class="plus" data-act="tri" data-arg="${c.k}+" aria-label="Add one ${c.name}">+</button>
    </div>
  </div>`;
}

function scenePanel() {
  const I = S.incident;

    </dl>

}

function benchPanel() {
  const T0 = S.incident.dispatchAt;

  return `<section class="panel" aria-label="Benchmarks">
    <div class="ph"><h2>Benchmarks</h2><span class="meta">${done} of ${BENCHMARKS.length} · tap to stamp</span></div>

/* On the EMS board: what fire and police have stamped on their own tablets, newest first. */
function otherBench() {

/* ---------- Fire and police tablets: unified command on the same incident ---------- */
const isFireUnit = u => ['fire', 'spec'].includes(kindOf(u.kind).g);
const isPdUnit = u => u.kind === 'PD';
function ucPanel(me) {

  return `<section class="panel" aria-label="Unified command">
    <div class="ph"><h2>Unified command</h2><span class="meta">${esc(S.incident.commandName || '')}</span></div>

  </section>`;
}
function agencyBenchPanel(list, title) {
  const T0 = S.incident.dispatchAt, done = list.filter(b => S.bench[b.id]).length;

    }).join('')}</div>
  </section>`;
}
const agUnitRow = (u, extra = '') => `<button class="row" data-act="sheet" data-arg="unit:${u.id}"><span class="pill ${u.status}">${esc(statusName(u.status))}</span><div><div class="t1">${kindTag(u.kind)} ${esc(u.name)}</div><div class="t2">${[u.agency, u.crew ? 'crew ' + u.crew : '', u.par ? 'PAR ' + hhmm(u.par) : '', extra].filter(Boolean).map(esc).join(' · ')}</div></div><span class="r note">${mins(now() - u.t)}</span></button>`;
function apparatusPanel() {
  const units = S.units.filter(u => isFireUnit(u) && u.status !== 'released');
  const on = units.filter(u => u.status === 'onscene');
  const groups = FIRE_TASKS.map(t => ({ t, us: units.filter(u => u.task === t) })).filter(g => g.us.length);
  const free = units.filter(u => !FIRE_TASKS.includes(u.task));
  const lastPar = on.length && on.every(u => u.par) ? Math.min(...on.map(u => u.par)) : 0;
  return `<section class="panel" aria-label="Apparatus">
    <div class="ph"><h2>Apparatus · assignments</h2><button class="btn small" data-act="unit-add-as" data-arg="ENG">${icon('plus')} Add</button></div>

    ${free.length ? `<div class="lbl">Not assigned · ${free.length}</div><div class="rows">${free.map(u => agUnitRow(u)).join('')}</div>` : ''}
    ${units.length ? '' : '<div class="empty">No fire apparatus on the board yet. Add them here; tap one to set its status and assignment.</div>'}

}
function emsStatusPanel() {

    <div class="note">${totalPts() ? `${TX_CATS.map(k => remaining(k)).reduce((a, b) => a + b, 0)} still on scene. ` : ''}EMS Command: ${esc((S.ics['uc-ems'] || {}).who || S.incident.ic || 'not set')}${S.incident.staging ? ` · Staging: ${esc(S.incident.staging)}` : ''}</div>

}
function fireView() {

function pointsPanel() {

  return `<section class="panel" aria-label="Traffic and perimeter">

    <div class="rows">${list.map(pt => `<button class="row" data-act="sheet" data-arg="point:${esc(pt.id)}"><span class="pk pt k-${esc(pt.kind)}">${esc(pointKind(pt.kind).tag)}</span><div><div class="t1">${esc(pt.name)}</div><div class="t2">${esc(pointKind(pt.kind).name)}${pt.unit ? ' · ' + esc(pt.unit) : ' · <span class="warn-t">nobody assigned</span>'}${pt.ll ? '' : ' · not on the map'}${pt.notes ? ' · ' + esc(pt.notes) : ''}</div></div></button>`).join('') || '<div class="empty">No points yet. Add traffic control points, closures, the perimeter and routes in and out; they show on every tablet\'s map.</div>'}</div>

    <div class="note">Counts only, from EMS's transport log. No names on the board.</div>
  </section>`;
}
function policeView() {
  return `<div class="board agency">
    <div class="col c1" data-scroll="p1">${ucPanel('police')}${agencyBenchPanel(PD_BENCH, 'Police benchmarks')}</div>
    <div class="col c2" data-scroll="p2">${pointsPanel()}${pdUnitsPanel()}</div>
    <div class="col c3" data-scroll="p3">${miniMap()}${emsStatusPanel()}${txForPolicePanel()}</div>

}

function resourcesPanel() {
  const active = S.units.filter(u => u.status !== 'released' && u.status !== 'available');
  const ems = active.filter(u => kindOf(u.kind).g === 'ems');
  const others = active.filter(u => kindOf(u.kind).g !== 'ems' && (u.status === 'onscene' || u.status === 'staged' || u.status === 'enroute'));

      <div class="stat"><span class="lbl">Amb. on scene</span><span class="v num">${amb('onscene')}</span></div>
      <div class="stat"><span class="lbl">Staged</span><span class="v num">${amb('staged')}</span></div>
      <div class="stat"><span class="lbl">En route</span><span class="v num">${amb('enroute')}</span></div>

    </div>
    <div class="field"><span class="lbl">Fire, special ops & support</span>
      ${others.length ? `<div class="chips">${others.map(u => `<button class="opt small" data-act="sheet" data-arg="unit:${u.id}">${kindTag(u.kind)} ${esc(u.name)}${u.status !== 'onscene' ? ` <small>${statusName(u.status)}</small>` : ''}</button>`).join('')}</div>` : '<span class="empty">None on the board</span>'}
    </div>

function reqRow(r) {

    <span class="pill ${r.status}">${reqStatusName(r.status)}</span>

const REQ_FLOW = ['requested', 'ack', 'enroute', 'onscene'];
const reqStatusName = k => ({ requested: 'Requested', ack: 'Acknowledged', enroute: 'En route', onscene: 'On scene', cancelled: 'Cancelled' }[k] || k);

function miniMap() {
  return `<section class="mapcard mini" aria-label="Scene map">

function hospLoadPanel() {
  const list = byDistance(HOSPITALS).slice(0, 5);
  return `<section class="panel" aria-label="Nearest hospitals">

      const mi = hospMiles(h);
      return `<button class="load" data-act="sheet" data-arg="hosp:${h.id}">
        <span class="nm">${esc(h.short)} <span class="note">${esc(h.town)}</span></span>

const PIN_NAMES = { scene: 'Scene', staging: 'Staging', lz: 'LZ' };

function mapView() {

/* Cameras. New Jersey publishes no open feed of its traffic cameras, so the board doesn't pull them in by itself;
   511NJ shows them on its own map. The squad adds the cameras other organizations share with it: a town's, a
   school's, a business's. A link to a still image shows here and refreshes; anything else opens in a new tab. */
const CAM_511 = 'https://511nj.org/';
const camRef = () => S.incident.ll || (DEV.me && DEV.me.ll) || sceneLL();
const camIsImage = u => /\.(jpe?g|png|gif|webp)(\?|#|$)/i.test(u || '');
const safeUrl = u => (/^https?:\/\//i.test(u || '') ? u : '');
function camerasPanel() {
  const ref = camRef();
  const list = C.cameras.slice().sort((a, b) => (ref && a.ll ? miles(ref, a.ll) : 999) - (ref && b.ll ? miles(ref, b.ll) : 999));
  return `<section class="panel">
    <div class="ph"><h2>Cameras</h2><button class="btn small" data-act="sheet" data-arg="cam-add">${icon('plus')} Add</button></div>
    <div>${list.map(c => { const mi = ref && c.ll ? miles(ref, c.ll) : null; return `<div class="load"><span class="nm">${esc(c.name)} <span class="note">${esc(c.org || '')}</span></span><span class="dist">${mi != null ? mi.toFixed(1) + ' mi' : ''}</span><span class="why"><button class="btn small" data-act="sheet" data-arg="cam:${esc(c.id)}">View</button>${c.ll ? `<button class="btn small" data-act="map-goto" data-arg="${c.ll.join(',')}">Show</button>` : ''}</span></div>`; }).join('') || `<div class="note">No cameras added yet. Add ones other organizations share with your squad; every tablet sees them.</div>`}</div>
    <a class="btn small" href="${CAM_511}" target="_blank" rel="noopener">${icon('ext')} Traffic cameras on 511NJ</a>
  </section>`;
}
function camAddSheet() {
  const f = UI.form;
  if (!f._init) Object.assign(f, { cwhere: S.incident.ll ? 'scene' : DEV.me ? 'me' : 'coords', _init: true });
  return {
    title: 'Add a camera',
    body: `<div class="grid2">
        ${field('Name', input('cam-name', 'camname', f.camname, 'e.g. Main St & Ocean Ave'))}
        ${field('Whose camera', input('cam-org', 'camorg', f.camorg, 'e.g. Long Branch PD, a school, a business'))}
      </div>
      ${field('Link', input('cam-url', 'camurl', f.camurl, 'https://…', 'inputmode="url" autocapitalize="off"'))}
      <div class="note">A link to a still image (ending in .jpg or .png) shows here and refreshes every few seconds. Any other link (a stream or the camera's own page) opens in a new tab.</div>
      ${field('Where it is', `<div class="chips">${opt('f-set', 'cwhere=scene', f.cwhere === 'scene', 'At the scene pin', 'small')}${opt('f-set', 'cwhere=me', f.cwhere === 'me', 'Where I am', 'small')}${opt('f-set', 'cwhere=coords', f.cwhere === 'coords', 'Coordinates', 'small')}</div>`)}
      ${f.cwhere === 'coords' ? field('Coordinates', input('cam-ll', 'camll', f.camll, '40.2205, -74.0121', 'inputmode="decimal"')) : ''}
      <div class="note">Only add cameras you're allowed to use. Everyone signed in to the squad sees the list.</div>`,
    foot: `<button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="cam-save">Save camera</button>`,
  };
}
function camSheet(id) {
  const c = C.cameras.find(x => x.id === id);
  if (!c) return { title: 'Camera', body: '<div class="empty">This camera was removed.</div>' };
  const url = safeUrl(c.url), ref = camRef(), mi = ref && c.ll ? miles(ref, c.ll) : null;
  return {
    title: c.name,
    body: `<div class="note">${esc(c.org || 'Camera')}${mi != null ? ` · ${mi.toFixed(1)} mi from ${S.incident.ll ? 'the scene' : 'here'}` : ''}${c.ll ? ` · ${esc(fmtLL(c.ll))}` : ''}</div>
      ${url && camIsImage(url) ? `<img class="camimg" alt="${esc(c.name)}" src="${esc(url)}" data-cam="${esc(url)}">` : ''}
      ${url ? `<a class="btn" href="${esc(url)}" target="_blank" rel="noopener">${icon('ext')} Open the camera</a>` : '<div class="note crit-t">This camera has no usable link.</div>'}`,
    foot: `<button class="btn danger" data-act="cam-del" data-arg="${esc(c.id)}">Remove</button><span class="grow"></span>${c.ll ? `<button class="btn" data-act="cam-show" data-arg="${c.ll.join(',')}">Show on map</button>` : ''}<button class="btn primary" data-act="close">Done</button>`,
  };
}
const CAMERA_ACTIONS = {
  'cam-save'() {
    const f = UI.form, name = (f.camname || '').trim(), url = (f.camurl || '').trim();
    if (!name) { showToast('Give the camera a name', false); return; }
    if (!safeUrl(url)) { showToast('The link has to start with https://', false); return; }
    let ll = null;
    if (f.cwhere === 'scene') ll = S.incident.ll;
    else if (f.cwhere === 'me') ll = DEV.me && DEV.me.ll;
    else { const m = String(f.camll || '').match(/(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)/); if (m) ll = [Number(m[1]), Number(m[2])]; }
    if (!ll || !(Math.abs(ll[0]) <= 90 && Math.abs(ll[1]) <= 180)) { showToast(f.cwhere === 'me' ? 'Tap Locate me on the map first' : f.cwhere === 'scene' ? 'Pin the scene first, or enter coordinates' : 'Enter coordinates like 40.2205, -74.0121', false); return; }
    C.cameras.push({ id: uid(), name, org: (f.camorg || '').trim(), url, ll });
    saveConfig(); UI.sheet = null; UI.form = {}; render(); showToast(`Camera added: ${name}`, false);
  },
  'cam-del'(id) { C.cameras = C.cameras.filter(c => c.id !== id); saveConfig(); UI.sheet = null; UI.form = {}; render(); },
  'cam-show'(ll) { UI.sheet = null; UI.form = {}; UI.view = 'map'; render(); setTimeout(() => { if (MAP) MAP.setView(ll.split(',').map(Number), 16); }, 50); },
};

/* A squad's own logo, shown with its name on the Supervisor board, phones and the menu. It's redrawn on this
   tablet to at most 256 px and saved in the squad's settings, so every tablet gets it. Only an image this
   page made is ever shown, whatever the shared settings hold. */
const LOGO_RE = /^data:image\/(png|webp|jpeg);base64,[A-Za-z0-9+/=]+$/;
const logoOk = v => typeof v === 'string' && v.length < 120000 && LOGO_RE.test(v);
const agencyLogo = (cls = 'alogo') => logoOk(C.agency.logo) ? `<img class="${cls}" src="${C.agency.logo}" alt="">` : '';
function shrinkLogo(file) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) return reject(new Error('Pick a picture file'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      for (const size of [256, 192, 128]) {
        const k = Math.min(1, size / Math.max(img.width, img.height)), w = Math.max(1, Math.round(img.width * k)), h = Math.max(1, Math.round(img.height * k));
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        const webp = cv.toDataURL('image/webp', 0.9), png = cv.toDataURL('image/png');
        const best = /^data:image\/webp/.test(webp) && webp.length < png.length ? webp : png;
        if (best.length < 110000) return resolve(best);
      }
      reject(new Error('That picture is too detailed to use as a logo'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Couldn't read that picture")); };

/* =====================================================================

   full Map view, so it never reloads.
   ===================================================================== */
let MAP = null, mapKind = null;
const ML = {};
const mapBox = document.createElement('div');
mapBox.className = 'mapbox';
const mapPark = document.getElementById('map-park');
mapPark.appendChild(mapBox);
const NJ_ORTHO = 'https://maps.nj.gov/arcgis/rest/services/Basemap/Orthos_Natural_2020_NJ_WM/MapServer/tile/{z}/{y}/{x}';

const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const unpack = flat => { const out = []; for (let i = 0; i < flat.length; i += 2) out.push([flat[i] / 1e4, flat[i + 1] / 1e4]); return out; };
const insideSample = ll => !!(ll && SAMPLE_SCENE && L_ok() && L.latLngBounds(SAMPLE_SCENE.bounds).contains(ll));
const L_ok = () => typeof window.L !== 'undefined';
const roadLabel = n => n.replace('Garden State Pkwy', 'Garden State Parkway').replace('New Jersey Tpke', 'NJ Turnpike').replace(/^I- /, 'I-').replace(/^State (Rte|Hwy) /, 'Route ').replace(/^US Hwy /, 'US ');

function ensureMap() {
  if (MAP || !L_ok()) return;
  MAP = L.map(mapBox, { preferCanvas: true, zoomControl: true, attributionControl: true, minZoom: 8, maxZoom: 20, zoomSnap: 0.5, center: [40.27, -74.17], zoom: 10 });
  MAP.attributionControl.setPrefix(false);
  /* Leaflet draws vectors on a canvas that sits above image layers, so town fills get their own pane under the
     imagery (tiles are 200) and roads one above it. */
  MAP.createPane('towns').style.zIndex = 150;
  MAP.createPane('aerial').style.zIndex = 250;
  MAP.createPane('roads').style.zIndex = 300;
  const townCanvas = L.canvas({ padding: 0.3, pane: 'towns' });
  const roadCanvas = L.canvas({ padding: 0.3, pane: 'roads' });

  ML.vector = L.layerGroup().addTo(MAP);
  ML.roadLayer = L.layerGroup().addTo(MAP);
  if (GEO) {
    ML.towns = GEO.towns.map(t => L.polygon(t.r.map(unpack), { pane: 'towns', renderer: townCanvas, interactive: false, weight: t.m ? 1.2 : 0.6 }).addTo(ML.vector));
    ML.roads = GEO.roads.map(r => L.polyline(unpack(r.p), { pane: 'roads', renderer: roadCanvas, interactive: false, weight: r.k ? 3 : 1.6 }).addTo(ML.roadLayer));
    ML.labels = L.layerGroup(TOWNS.filter(t => t.home).map(t => L.marker(t.ll, { interactive: false, keyboard: false, icon: L.divIcon({ className: '', html: `<div class="town-label">${esc(t.name.replace(/ (Township|Borough|City|Village)$/, ''))}</div>`, iconSize: [0, 0] }) })));
    MAP.attributionControl.addAttribution('Boundaries & roads: US Census 2023');
  }
  if (SAMPLE_SCENE) ML.sample = L.imageOverlay(SAMPLE_SCENE.img, SAMPLE_SCENE.bounds, { pane: 'aerial', interactive: false, attribution: 'Aerial: NJ Office of GIS, 2020' });

  ML.live = L.tileLayer(NJ_ORTHO, { maxZoom: 20, maxNativeZoom: 20, attribution: 'Aerial: NJ Office of GIS, 2020', crossOrigin: false });
  ML.live.on('tileload', () => { if (UI.live !== 'ok') { UI.live = 'ok'; refreshChips(); syncRoads(); } });
  ML.live.on('tileerror', () => { if (UI.live === 'unknown') { UI.live = 'blocked'; refreshChips(); } });

  ML.pins = L.layerGroup().addTo(MAP);
  ML.hosp = L.layerGroup().addTo(MAP);

  MAP.on('zoomend', () => { syncLabels(); syncRoads(); });
  MAP.on('click', e => {
    if (!UI.pinMode) return;
    const k = UI.pinMode, ll = [+e.latlng.lat.toFixed(6), +e.latlng.lng.toFixed(6)];
    UI.pinMode = null;
    if (k === 'post') { const keep = UI.pendingPost || { pkind: 'fixed' }; UI.pendingPost = null; openSheet('post-new'); Object.assign(UI.form, keep, { pwhere: 'map', pll: ll, _init: true }); render(); return; }
    if (k === 'point') { const keep = UI.pendingPoint || { ptkind: 'tcp' }; UI.pendingPoint = null; openSheet('point-new'); Object.assign(UI.form, keep, { ptwhere: 'map', ptll: ll, _init: true }); render(); return; }
    if (k.startsWith('point-move:')) { const id = k.slice(11), pt = points().find(x => x.id === id); if (pt) dispatch('pointEdit', { id, fields: { ll } }, `${pt.name} moved on the map`, 'units'); render(); return; }
    if (k.startsWith('post-move:')) { const id = k.slice(10), po = postIn(EV, id); if (po) edispatch('postEdit', { id, fields: { ll } }, `${po.name} moved on the map`, 'units'); render(); return; }
    const field = k === 'scene' ? 'll' : k === 'staging' ? 'stagingLL' : 'lzLL';
    dispatch('pin', { field, ll }, `${k === 'scene' ? 'Scene' : k === 'staging' ? 'Staging' : 'LZ'} pinned at ${fmtLL(ll)}`, 'note');
  });
  styleMap();
  syncLayer();
}

function styleMap() {
  if (!MAP || !GEO) return;
  const land = css('--land'), home = css('--land-home'), edge = css('--town-edge'), major = css('--road-major'), road = css('--road');
  GEO.towns.forEach((t, i) => ML.towns[i].setStyle({ color: edge, fillColor: t.m ? home : land, fillOpacity: 1 }));
  GEO.roads.forEach((r, i) => ML.roads[i].setStyle({ color: r.k ? major : road, opacity: r.k ? 0.95 : 0.8 }));

function syncLayer() {
  if (!MAP) return;
  const sat = UI.mapLayer === 'sat';
  if (sat) { ML.live.addTo(MAP); if (ML.sample) ML.sample.addTo(MAP); }
  else { ML.live.remove(); if (ML.sample) ML.sample.remove(); }
  syncRoads();
}
/* Over imagery the simplified roads only add clutter once you are zoomed in to street level. */
function syncRoads() {
  if (!MAP || !ML.roadLayer) return;
  const show = UI.mapLayer !== 'sat' || MAP.getZoom() < 14;
  if (show && !MAP.hasLayer(ML.roadLayer)) ML.roadLayer.addTo(MAP);
  if (!show && MAP.hasLayer(ML.roadLayer)) ML.roadLayer.remove();
}
function syncLabels() {
  if (!MAP || !ML.labels) return;
  const show = MAP.getZoom() >= 11 && MAP.getZoom() <= 15;
  if (show && !MAP.hasLayer(ML.labels)) ML.labels.addTo(MAP);
  if (!show && MAP.hasLayer(ML.labels)) ML.labels.remove();
}
function pinIcon(cls, text, size) { return L.divIcon({ className: '', html: `<div class="pin ${cls}">${text}</div>`, iconSize: [size, size], iconAnchor: [size / 2, size / 2] }); }
function syncMarkers() {
  if (!MAP) return;

  if (showInc && I.stagingLL) L.marker(I.stagingLL, { icon: pinIcon('staging', 'S', 34), title: 'Staging' }).addTo(ML.pins);
  if (showInc && I.ll) L.marker(I.ll, { icon: pinIcon('scene', 'SCENE', 40), title: 'Scene', zIndexOffset: 1000 }).addTo(ML.pins);
  if (showInc) points().filter(pt => pt.ll).forEach(pt => L.marker(pt.ll, { icon: pinIcon(`pt k-${pt.kind}`, esc(pointKind(pt.kind).tag), 30), title: pt.name, zIndexOffset: 400 })
    .bindTooltip(`${esc(pt.name)}${pt.unit ? ' · ' + esc(pt.unit) : ''}`, { direction: 'top', offset: [0, -14] })
    .on('click', () => openSheet('point:' + pt.id)).addTo(ML.pins));
  COUNTY_STAGING.forEach(c => L.marker(c.ll, { icon: pinIcon('cstage', 'S', 30), title: c.name }).bindTooltip(`County staging: ${c.name}`, { direction: 'top', offset: [0, -14] }).addTo(ML.pins));
  C.cameras.filter(c => c.ll).forEach(c => L.marker(c.ll, { icon: pinIcon('cam', 'CAM', 30), title: c.name }).bindTooltip(`Camera: ${c.name}`, { direction: 'top', offset: [0, -14] }).on('click', () => openSheet('cam:' + c.id)).addTo(ML.pins));
  if (eventLive()) EV.posts.filter(po => po.ll).forEach(po => {
    const staff = postStaff(po);
    L.marker(po.ll, { icon: pinIcon(`post k-${po.kind}${staff.length ? '' : ' empty'}`, esc(postLabel(po)), 32), title: po.name, zIndexOffset: 500 })
      .bindTooltip(`${esc(po.name)}${staff.length ? ' · ' + staff.map(x => esc(x.name)).join(', ') : ' · nobody yet'}`, { direction: 'top', offset: [0, -16] })
      .on('click', () => openSheet('post:' + po.id)).addTo(ML.pins);
  });

    .bindTooltip(`${h.short}${hospMiles(h) != null ? ' · ' + hospMiles(h).toFixed(1) + ' mi' : ''}`, { direction: 'top', offset: [0, -14] }).addTo(ML.hosp));

function refreshChips() {
  document.querySelectorAll('.mapcard.mini:not(.evmap) .mapctl.bl').forEach(el => { el.innerHTML = pinChip() + mapChips(); });
  if (UI.view === 'map') render();

function parkMap() { if (mapBox.parentNode !== mapPark) mapPark.appendChild(mapBox); }
function placeMap() {
  const slot = document.querySelector('[data-map-slot]');
  if (!slot) return;
  if (!L_ok()) { slot.innerHTML = '<div class="map-fallback">The map library did not load. Check the connection; everything else on the board still works.</div>'; return; }
  ensureMap();
  slot.appendChild(mapBox);
  const kind = slot.dataset.mapSlot;
  MAP.invalidateSize(false);

}
function frameMap(kind) {
  const I = S.incident, w = wsNow();
  const center = sceneLL();
  const evPts = (kind === 'event' || (kind === 'full' && w === 'event')) && eventLive() ? EV.posts.map(po => po.ll).concat([EV.event.ll]).filter(Boolean) : [];
  if (evPts.length > 1) MAP.fitBounds(L.latLngBounds(evPts).pad(0.25), { maxZoom: 17.5 });
  else if (evPts.length === 1) MAP.setView(evPts[0], 16.5);
  else if (kind === 'mini' || kind === 'event') { if (center) MAP.setView(center, I.ll ? 16.5 : 13); else MAP.setView([40.27, -74.17], 10); }
  else {
    const pts = w === 'mci' || mciLive() ? [I.ll, I.stagingLL, I.lzLL].filter(Boolean) : [];
    if (pts.length > 1) MAP.fitBounds(L.latLngBounds(pts).pad(0.6), { maxZoom: 17.5 });
    else if (center) MAP.setView(center, I.ll && center === I.ll ? 17 : 13);
    else MAP.setView([40.27, -74.17], 10);
  }
  syncLabels();
}

/* =====================================================================
   Final reports. At the end of an MCI, an event or the day: a summary of
   everything on the board, shown here and saved as a PDF or printed.
   Each report is built as plain data (sections of facts and tables) so
   the preview and the PDF say the same thing.
   ===================================================================== */
const JSPDF_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
const AUTOTABLE_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js';
const fmtDT = t => (t ? new Date(t).toLocaleString(undefined, { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }) : '');
const fmtDay = t => new Date(t).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
const durWords = ms => { const m = Math.max(0, Math.round(ms / 60000)); return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${m % 60} min`; };
const roleName = r => (ROLES[r] || {}).name || r || '';
const logRows = log => log.slice().sort((a, b) => a.t - b.t).map(e => [hhmm(e.t), e.kind || 'note', e.text, roleName(e.role)]);
const logSection = log => ({ h: 'Timeline', table: { head: ['Time', 'Kind', 'Entry', 'Tablet'], rows: logRows(log), widths: [44, 62, 0, 70] }, empty: 'Nothing logged.' });
const hName = id => (id ? (hosp(id) || {}).short || id : '');
const fileSafe = s => String(s || '').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60);
const ymd = t => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

function incidentReport() {
  const I = S.incident, end = S.bench.clear || now();
  const sent = S.transports.reduce((a, x) => a + x.n, 0);
  const sections = [];
  sections.push({ h: 'Summary', kv: [
    ['Incident', I.type || 'Not recorded'],
    ['Location', [I.location, I.municipality].filter(Boolean).join(', ') || 'Not recorded'],
    I.ll && ['Coordinates', `${fmtLL(I.ll)} (${fmtDDM(I.ll)})`],
    ['Command', [I.commandName, I.ic && `EMS Command: ${I.ic}`].filter(Boolean).join(' · ') || 'Not recorded'],
    (S.ics['uc-fire'] || S.ics['uc-pd']) && ['Unified command', [['EMS', 'uc-ems'], ['Fire', 'uc-fire'], ['Police', 'uc-pd']].filter(([, k]) => S.ics[k]).map(([n, k]) => `${n}: ${S.ics[k].who}`).join(' · ')],
    ['MCI level', I.mciLevel ? levelLabel(I.mciLevel) : 'Not declared'],
    ['Dispatched', fmtDT(I.dispatchAt)],
    ['Scene clear', S.bench.clear ? fmtDT(S.bench.clear) : `Still open when this report was made (${hhmm(now())})`],
    ['Duration', durWords(end - I.dispatchAt)],
    ['Staging', I.staging || 'Not recorded'],
    ['Hazards', (I.hazards || []).join(', ') || 'None noted'],
    ['Triage method', S.method || 'START'],
    ['Patients', `${totalPts()} triaged · ${sent} transported`],
    ['Units', `${S.units.length} on the board · ${squadsInvolved()} EMS agencies`],
  ].filter(Boolean) });
  sections.push({ h: 'Patients by triage category', tri: true, table: {
    head: ['Category', 'Triaged', 'Transported', 'Left on scene'],
    rows: catsList().map(c => [`${c.color} · ${c.name}`, S.triage[c.k] || 0, TX_CATS.includes(c.k) ? sentCat(c.k) : '', TX_CATS.includes(c.k) ? remaining(c.k) : '']),
    keys: catsList().map(c => c.k),
  } });
  // fire's and police's lists are in the report once their tablets have stamped anything
  const bRow = (ag, b) => [ag, b.label, S.bench[b.id] ? hhmm(S.bench[b.id]) : 'Not marked', S.bench[b.id] ? durWords(S.bench[b.id] - I.dispatchAt) : ''];
  const fireB = FIRE_BENCH.filter(b => b.id !== 'extrication'), used = list => list.some(b => S.bench[b.id]);
  sections.push({ h: 'Benchmarks', table: { head: ['Agency', 'Benchmark', 'Time', 'After dispatch'], rows: [
    ...BENCHMARKS.map(b => bRow('EMS', b)), ...(used(fireB) ? fireB.map(b => bRow('Fire', b)) : []), ...(used(PD_BENCH) ? PD_BENCH.map(b => bRow('Police', b)) : []),
  ], widths: [52, 0, 70, 80] } });
  sections.push({ h: 'Transports', table: {
    head: ['Time', 'Unit', 'Category', 'Patients', 'Hospital', 'Tags · age'],
    rows: S.transports.slice().sort((a, b) => a.t - b.t).map(x => [hhmm(x.t), (unitIn(S, x.unit) || {}).name || x.unit || '', cat(x.cat).color, x.n, hName(x.hosp), [x.tags, x.age].filter(Boolean).join(' · ')]),
  }, empty: 'No transports logged.' });
  const hs = HOSPITALS.filter(h => S.hospitals[h.id] || hospSent(h.id));
  sections.push({ h: 'Hospitals', table: {
    head: ['Hospital', 'Notified', 'Red', 'Yellow', 'Green', 'ED status'],
    rows: hs.map(h => { const st = hospState(h.id), cap = st.cap || {}; return [h.short, st.notifiedAt ? hhmm(st.notifiedAt) : '', ...TX_CATS.map(k => `${hospSent(h.id, k)}${cap[k] != null ? ' / ' + cap[k] : ''}`), st.ed || '']; }),
  }, note: 'Sent / could take, as reported.', empty: 'No hospitals notified or sent patients.' });
  sections.push({ h: 'Units', table: {
    head: ['Unit', 'Agency', 'Type', 'Crew', 'Status at close', 'Task'],
    rows: S.units.map(u => [u.name, u.agency || '', u.kind || '', u.crew || '', (STATUSES.find(x => x.k === u.status) || {}).name || u.status || '', u.task || '']),
  }, empty: 'No units on the board.' });
  sections.push({ h: 'People checked in', table: {
    head: ['Member #', 'Name', 'Cert', 'Unit', 'Task', 'In', 'Out'],
    rows: S.people.map(x => [x.num || '', x.name || '', x.cert || '', (unitIn(S, x.unit) || {}).name || x.unit || '', x.task || '', hhmm(x.t), x.out ? hhmm(x.out) : '']),
  }, empty: 'Nobody checked in on the board.' });
  sections.push({ h: 'Resource requests', table: {
    head: ['Time', 'Request', 'Qty', 'Status', 'Note'],
    rows: S.requests.map(r => [hhmm(r.t), r.what, r.qty || 1, reqStatusName(r.status), r.note || '']),
  }, empty: 'No requests.' });
  if (points().length) sections.push({ h: 'Traffic and perimeter (police)', table: { head: ['Kind', 'Point', 'Unit', 'Where', 'Notes'], rows: points().map(pt => [pointKind(pt.kind).name, pt.name, pt.unit || '', pt.ll ? fmtLL(pt.ll) : '', pt.notes || '']) } });
  const ics = ICS_POSITIONS.filter(p => S.ics[p.id] && S.ics[p.id].who);
  sections.push({ h: 'Incident command (ICS)', table: { head: ['Position', 'Who', 'Since'], rows: ics.map(p => [p.label, S.ics[p.id].who, hhmm(S.ics[p.id].t)]) }, empty: 'No ICS positions filled.' });
  sections.push(logSection(S.log));
  return {
    kind: 'inc', title: 'MCI final report', sample: S.sample,
    subtitle: [I.type, [I.location, I.municipality].filter(Boolean).join(', '), fmtDay(I.dispatchAt)].filter(Boolean).join(' · '),
    file: `OpsBoard-MCI-${ymd(I.dispatchAt)}-${fileSafe(I.location || I.type || 'incident')}`,
    sections, sign: true,
  };
}

function eventReport() {
  const E = EV.event, end = EV.ended || now(), by = o => EV.pts.filter(x => x.outcome === o).length;
  const onFor = x => durWords((x.st === 'off' ? x.at : end) - x.t);
  const sections = [];
  sections.push({ h: 'Summary', kv: [

    ['Type', E.type || ''],

    ['Started', fmtDT(EV.startedAt)],
    ['Ended', EV.ended ? fmtDT(EV.ended) : `Still running when this report was made (${hhmm(now())})`],
    ['Duration', durWords(end - EV.startedAt)],
    E.channel && ['Radio channel', E.channel],
    E.notes && ['Notes', E.notes],
  ].filter(Boolean) });

/* The PDF. jsPDF is loaded from cdnjs the first time a report opens, so the board itself stays small. */
let pdfLoading = null, logoPng = null;
const loadScript = src => new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.async = true; el.onload = res; el.onerror = () => { el.remove(); rej(new Error('Could not load ' + src)); }; document.head.appendChild(el); });

function loadPdfLib() {
  if (pdfReady()) return Promise.resolve(window.jspdf.jsPDF);
  if (!pdfLoading) pdfLoading = (window.jspdf ? Promise.resolve() : loadScript(JSPDF_URL)).then(() => (pdfReady() ? null : loadScript(AUTOTABLE_URL))).then(() => {
    if (!pdfReady()) throw new Error('PDF maker did not start');

/* The squad's logo goes into the PDF as a PNG, redrawn once on a canvas. */
function prepLogo() {
  const src = logoOk(C.agency.logo) ? C.agency.logo : '';
  if (!src) { logoPng = null; return Promise.resolve(); }
  if (logoPng && logoPng.src === src) return Promise.resolve();
  return new Promise(res => {
    const img = new Image();
    img.onload = () => { try { const cv = document.createElement('canvas'); cv.width = img.naturalWidth; cv.height = img.naturalHeight; cv.getContext('2d').drawImage(img, 0, 0); logoPng = { src, data: cv.toDataURL('image/png'), w: img.naturalWidth, h: img.naturalHeight }; } catch (e) { logoPng = null; } res(); };
    img.onerror = () => { logoPng = null; res(); };
    img.src = src;
  });
}
function prepReport() { loadPdfLib().catch(() => {}); prepLogo(); }

/* The PDF's built-in fonts only have Western European letters; anything else is swapped for a plain one. */
const PDF_SWAP = { '→': '->', '←': '<-', '−': '-', '–': '-', '—': '-', '‘': "'", '’': "'", '“': '"', '”': '"', '′': "'", '★': '*', '☆': '*', '●': '', '…': '...', '≥': '>=', '≤': '<=', '×': 'x', '•': '·' };

const TRI_RGB = { R: [215, 55, 63], Y: [242, 194, 48], G: [45, 184, 106], X: [140, 146, 152], B: [20, 20, 20], W: [255, 255, 255] };
const TRI_INK = { R: [255, 255, 255], Y: [20, 20, 20], G: [255, 255, 255], X: [255, 255, 255], B: [255, 255, 255], W: [20, 20, 20] };
const NAVY = [11, 27, 43];
function buildPdf(jsPDF, m) {
  const doc = new jsPDF({ unit: 'pt', format: 'letter' });
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 40;
  doc.setProperties({ title: pdfText(`${m.title} · ${m.subtitle}`), subject: pdfText(m.title), creator: 'OpsBoard', author: pdfText(C.agency.name) });
  // header: the squad's logo (or the OpsBoard mark), the squad, the title
  let x = M;
  if (logoPng) { const h = 46, w = Math.min(92, h * (logoPng.w / logoPng.h || 1)); doc.addImage(logoPng.data, 'PNG', M, M - 6, w, h); x = M + w + 12; }
  else {
    const s = 46 / 512, at = (v, o) => o + v * s, oy = M - 6;
    doc.setFillColor(...NAVY); doc.roundedRect(M, oy, 46, 46, 10, 10, 'F');
    [[92, 92, [215, 55, 63]], [268, 92, [242, 194, 48]], [92, 268, [45, 184, 106]], [268, 268, [234, 242, 248]]].forEach(([rx, ry, c]) => { doc.setFillColor(...c); doc.roundedRect(at(rx, M), at(ry, oy), 152 * s, 152 * s, 30 * s, 30 * s, 'F'); });
    doc.setFillColor(...NAVY); doc.rect(at(331, M), at(302, oy), 26 * s, 84 * s, 'F'); doc.rect(at(302, M), at(331, oy), 84 * s, 26 * s, 'F');
    x = M + 58;
  }
  doc.setTextColor(90, 100, 110); doc.setFont('helvetica', 'bold'); doc.setFontSize(10);
  doc.text(pdfText(`${C.agency.name}${C.agency.num ? ' · squad ' + C.agency.num : ''}`).toUpperCase(), x, M + 4);
  doc.setTextColor(...NAVY); doc.setFontSize(20); doc.text(pdfText(m.title), x, M + 24);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5); doc.setTextColor(60, 70, 80);
  doc.text(doc.splitTextToSize(pdfText(m.subtitle), W - x - M), x, M + 38);
  let y = M + 58;
  doc.setDrawColor(...NAVY); doc.setLineWidth(1.2); doc.line(M, y, W - M, y); y += 8;
  if (m.sample) { doc.setFont('helvetica', 'bold'); doc.setTextColor(180, 40, 40); doc.setFontSize(10); doc.text('SAMPLE DATA · PRACTICE ONLY', M, y + 10); y += 16; }
  const heading = h => {
    if (y > H - 110) { doc.addPage(); y = M; }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(12.5); doc.setTextColor(...NAVY); doc.text(pdfText(h), M, y + 16); y += 22;
  };
