<title>Scene Command Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">

<style>
/* Layout: one-screen command board. Incident header with clocks across the top, a rail of views on the left,
   and panels that scroll inside themselves on a landscape tablet, then stack into one column on a phone.
   Night is the default (the PCR911 palette); Day is a high-contrast mode for direct sunlight. */
:root {
  --bg: #0B1B2B;
  --surface: #12293D;
  --raised: #183449;
  --line: #25506E;
  --fg: #EAF2F8;
  --muted: #9FB6C8;
  --faint: #6F8AA0;
  --accent: #4FA3E3;
  --accent-ink: #04121E;
  --ok: #4CC38A;
  --warn: #E8B14C;
  --crit: #E8695C;
  --scrim: rgb(2 8 14 / 0.62);
  --on-solid: #04121E;

  --red: #D7373F;     --red-ink: #FFFFFF;
  --yellow: #F2C230;  --yellow-ink: #1D1600;
  --green: #2DB86A;   --green-ink: #03180B;
  --black: #000000;   --black-ink: #FFFFFF;  --black-edge: #8DA3B5;
  --gray: #8B97A4;    --gray-ink: #0B1218;
  --white: #F4F6F8;   --white-ink: #06131F;

  /* map (built-in, offline) */
  --water: #07131E;
  --land: #10263A;
  --land-home: #17344B;
  --town-edge: #2B5878;
  --road-major: #E8B14C;
  --road: #8C7A52;

  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;

  --tap: 56px;
  --r: 12px;
  color-scheme: dark;
}
:root[data-mode="day"] {
  --bg: #FFFFFF;
  --surface: #F2F5F8;
  --raised: #E2E9F0;
  --line: #8EA4B8;
  --fg: #06131F;
  --muted: #2E4558;
  --faint: #536A7D;
  --accent: #0B5FA5;
  --accent-ink: #FFFFFF;
  --ok: #0E7A45;
  --warn: #8C5A00;
  --crit: #B3261E;
  --scrim: rgb(6 19 31 / 0.5);
  --on-solid: #FFFFFF;
  --red: #C62828;     --red-ink: #FFFFFF;
  --yellow: #F2C230;  --yellow-ink: #1D1600;
  --green: #1E9E55;   --green-ink: #FFFFFF;
  --black: #000000;   --black-ink: #FFFFFF;  --black-edge: #000000;
  --gray: #6B7783;    --gray-ink: #FFFFFF;
  --white: #FFFFFF;   --white-ink: #06131F;
  --water: #C9DCEB;
  --land: #EEF2F5;
  --land-home: #FFFFFF;
  --town-edge: #9DB0C1;
  --road-major: #B56A00;
  --road: #9A8F7A;
  color-scheme: light;
}

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 500 16px/1.4 var(--body);
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- shell ---------- */
.app {
  height: 100%;
  box-sizing: border-box;
  display: grid;
  grid-template-columns: 84px minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "head head" "rail main";
  gap: 12px;
  padding-inline: 16px;
  padding-block: 12px;
}
.head { grid-area: head; }
.rail { grid-area: rail; }
.main { grid-area: main; min-height: 0; overflow: auto; overscroll-behavior: contain; }

/* ---------- header ---------- */
.head { display: flex; align-items: stretch; gap: 16px; flex-wrap: wrap; }
.inc { flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 4px; justify-content: center; }
.inc-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.inc h1 { margin: 0; font: 700 27px/1.1 var(--display); letter-spacing: 0.01em; text-wrap: balance; }
.titlebtn { all: unset; cursor: pointer; border-radius: 6px; }
.titlebtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.inc-sub { color: var(--muted); font-size: 15px; }
.inc-sub b { color: var(--fg); font-weight: 600; }
.tag {
  display: inline-flex; align-items: center; gap: 6px;
  font: 700 13px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase;
  padding: 6px 9px; border-radius: 6px;
  border: 1.5px solid var(--line); color: var(--muted); background: transparent;
}
button.tag { min-height: 32px; }
.tag.mci { background: var(--crit); border-color: var(--crit); color: var(--on-solid); }
.tag.suggest { border-color: var(--warn); color: var(--warn); }
.tag.sample { border-style: dashed; }
.tag.live { border-color: var(--ok); color: var(--ok); }
.tag.role { border-color: var(--accent); color: var(--accent); }

.clocks { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
.clock, .par, .iconbtn {
  display: flex; flex-direction: column; justify-content: center; gap: 2px;
  min-width: 96px; padding: 8px 12px; border-radius: var(--r);
  background: var(--surface); border: 1px solid var(--line); text-align: left;
}
.clock .v, .par .v { font: 700 24px/1 var(--mono); font-variant-numeric: tabular-nums; }
.lbl { font: 600 12px/1 var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
.par { min-width: 118px; }
.par.due { border-color: var(--warn); }
.par.due .v { color: var(--warn); }
.par.over { background: var(--crit); border-color: var(--crit); }
.par.over .v, .par.over .lbl { color: var(--on-solid); }
.iconbtn { min-width: 64px; align-items: center; }
.iconbtn svg { width: 26px; height: 26px; }

/* ---------- rail ---------- */
.rail { display: flex; flex-direction: column; gap: 4px; min-height: 0; overflow: auto; }
.rail button {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  min-height: 60px; flex-shrink: 0; border-radius: var(--r);
  background: transparent; border: 1px solid transparent; color: var(--muted);
  font: 600 12px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase;
}
.rail button svg { width: 26px; height: 26px; }
.rail button[aria-current="page"] { background: var(--raised); border-color: var(--line); color: var(--fg); }
.rail button[aria-current="page"] svg { color: var(--accent); }
.rail .spacer { flex: 1; }
.badge {
  min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; box-sizing: border-box;
  background: var(--crit); color: var(--on-solid); font: 700 12px/20px var(--mono); text-align: center;
}
.rail .ico { position: relative; }
.rail .ico .badge { position: absolute; top: -6px; right: -14px; }
svg.i { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- panels ---------- */
.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0;
}
.ph { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.ph h2 { margin: 0; font: 700 15px/1 var(--display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.ph .meta { color: var(--faint); font-size: 14px; }
.empty { color: var(--faint); font-size: 15px; padding: 6px 0; }

.btn {
  min-height: var(--tap); padding: 0 18px; border-radius: 10px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--raised); border: 1.5px solid var(--line); color: var(--fg);
  font: 700 18px/1 var(--display); letter-spacing: 0.04em; text-decoration: none;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { border-color: var(--crit); color: var(--crit); background: transparent; }
.btn.small { min-height: 44px; font-size: 16px; padding: 0 14px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn svg { width: 22px; height: 22px; }

/* ---------- board ---------- */
.board {
  display: grid;
  grid-template-columns: minmax(300px, 1fr) minmax(300px, 1fr) minmax(330px, 1.15fr);
  gap: 12px; height: 100%; min-height: 0;
}
.col { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: auto; overscroll-behavior: contain; }

/* triage */
.tri-sum { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.tri-total { font: 700 44px/1 var(--display); }
.tri-total small { font: 600 16px/1 var(--body); color: var(--muted); margin-left: 6px; }
.est { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; }
.est button { width: 40px; height: 40px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--raised); font: 700 20px/1 var(--mono); }
.est .num { min-width: 2ch; text-align: center; font-weight: 700; color: var(--fg); }
.bar { height: 8px; border-radius: 4px; background: var(--raised); overflow: hidden; display: flex; }
.bar span { display: block; height: 100%; }

.tri {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px;
  padding: 10px 10px 10px 14px; border-radius: var(--r);
  border: 2px solid var(--c); background: color-mix(in srgb, var(--c) 14%, var(--surface));
}
.tri-R { --c: var(--red); --ink: var(--red-ink); }
.tri-Y { --c: var(--yellow); --ink: var(--yellow-ink); }
.tri-G { --c: var(--green); --ink: var(--green-ink); }
.tri-X { --c: var(--gray); --ink: var(--gray-ink); }
.tri-W { --c: var(--white); --ink: var(--white-ink); }
:root[data-mode="day"] .tri-W { --c: #6B7783; }
:root[data-mode="day"] .tri-W .swatch, :root[data-mode="day"] .tri-W .tri-btns button.plus { background: #FFFFFF; color: #06131F; border: 1.5px solid #6B7783; }
.tri-B { --c: var(--black-edge); --ink: var(--black-ink); background: color-mix(in srgb, var(--black) 55%, var(--surface)); }
:root[data-mode="day"] .tri-B { background: #2A2F35; color: #FFFFFF; }
:root[data-mode="day"] .tri-B .tri-sub { color: #D3DCE4; }
.tri-head { display: flex; align-items: center; gap: 8px; }
.swatch { font: 700 13px/1 var(--display); letter-spacing: 0.1em; text-transform: uppercase; padding: 5px 8px; border-radius: 5px; background: var(--c); color: var(--ink); }
.tri-B .swatch { background: var(--black); color: var(--black-ink); border: 1.5px solid var(--black-edge); }
:root[data-mode="day"] .tri-B .swatch { border-color: #FFFFFF; }
.tri-name { font: 700 19px/1.05 var(--display); letter-spacing: 0.04em; text-transform: uppercase; overflow-wrap: anywhere; }
.board .tri-btns button { width: 54px; height: 68px; }
.board .tri-head { flex-wrap: wrap; row-gap: 4px; }
.tri-count { font: 700 56px/0.95 var(--display); font-variant-numeric: tabular-nums; margin-top: 2px; }
.tri-sub { font-size: 14px; color: var(--muted); }
.tri-sub b { color: var(--fg); }
:root[data-mode="day"] .tri-B .tri-sub b { color: #FFFFFF; }
.tri-btns { display: flex; gap: 8px; }
.tri-btns button { width: 64px; height: 72px; border-radius: 10px; font: 700 34px/1 var(--display); border: 2px solid var(--c); background: var(--surface); color: var(--fg); }
.tri-btns button.plus { background: var(--c); color: var(--ink); }
.tri-B .tri-btns button.plus { background: var(--black); color: var(--black-ink); border-color: var(--black-edge); }
:root[data-mode="day"] .tri-B .tri-btns button { background: #000; color: #FFF; border-color: #FFF; }

/* key/value strip */
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 15px; margin: 0; }
.kv dt { color: var(--faint); font: 600 13px/1.6 var(--display); letter-spacing: 0.08em; text-transform: uppercase; }
.kv dd { margin: 0; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.hz { font: 600 14px/1 var(--display); letter-spacing: 0.04em; padding: 6px 9px; border-radius: 6px; border: 1.5px solid var(--warn); color: var(--warn); }

/* benchmarks */
.bench { display: flex; flex-direction: column; }
.bench button {
  display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px;
  min-height: 50px; padding: 4px; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--line);
}
.bench button:last-child { border-bottom: 0; }
.tick { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.tick svg { width: 18px; height: 18px; opacity: 0; }
.bench .done .tick { background: var(--ok); border-color: var(--ok); color: var(--on-solid); }
.bench .done .tick svg { opacity: 1; }
.bench .b-label { font-size: 16px; font-weight: 600; }
.bench .todo .b-label { color: var(--muted); font-weight: 500; }
.bench .ready .b-label { color: var(--warn); font-weight: 600; }
.bench .b-time { text-align: right; font: 700 15px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
.bench .b-time small { display: block; font-size: 12px; color: var(--faint); font-weight: 500; }
.bench .b-ready { font: 700 14px/1 var(--display); letter-spacing: 0.08em; color: var(--warn); }

/* stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(78px, 1fr)); gap: 8px; }
.stat { background: var(--raised); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat .v { font: 700 30px/1 var(--display); font-variant-numeric: tabular-nums; }
.stat.R { background: var(--red); color: var(--red-ink); }
.stat.Y { background: var(--yellow); color: var(--yellow-ink); }
.stat.G { background: var(--green); color: var(--green-ink); }
.stat.R .lbl, .stat.Y .lbl, .stat.G .lbl { color: inherit; opacity: 0.85; }

/* list rows */
.rows { display: flex; flex-direction: column; }
.row {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px;
  min-height: 52px; padding: 6px 2px; border: 0; border-bottom: 1px solid var(--line);
  background: transparent; text-align: left; width: 100%; box-sizing: border-box;
}
.row:last-child { border-bottom: 0; }
.row .t1 { font-weight: 600; }
.row .t2 { font-size: 14px; color: var(--muted); }
.row .r { text-align: right; }
.dot { width: 14px; height: 14px; border-radius: 4px; background: var(--c); border: 1.5px solid var(--c); }
.dot.B { background: var(--black); border-color: var(--black-edge); }
.c-R { --c: var(--red); } .c-Y { --c: var(--yellow); } .c-G { --c: var(--green); } .c-B { --c: var(--black-edge); }

.pill { display: inline-block; font: 700 12px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; padding: 5px 7px; border-radius: 5px; border: 1.5px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.requested { border-color: var(--warn); color: var(--warn); }
.pill.ack, .pill.enroute { border-color: var(--accent); color: var(--accent); }
.pill.onscene, .pill.done, .pill.open { border-color: var(--ok); color: var(--ok); }
.pill.diversion { border-color: var(--crit); color: var(--crit); }
.pill.advisory { border-color: var(--warn); color: var(--warn); }

/* hospital load */
.load { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 7px 0; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; width: 100%; }
.load:last-child { border-bottom: 0; }
.load .nm { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.load .ct { font: 600 14px/1 var(--mono); color: var(--muted); }
.load .bar { grid-column: 1 / -1; height: 8px; }
.load .why { grid-column: 1 / -1; display: flex; gap: 5px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }

/* ---------- map ---------- */
.mapcard { position: relative; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); background: var(--water); min-height: 0; }
.mapcard.mini { height: 270px; flex-shrink: 0; }
.mapslot, .mapbox { position: absolute; inset: 0; }
.map-park { position: fixed; left: -9999px; top: 0; width: 400px; height: 300px; visibility: hidden; }
.mapctl { position: absolute; z-index: 1100; display: flex; gap: 6px; }
.mapctl.tr { top: 8px; right: 8px; }
.mapctl.bl { bottom: 8px; left: 8px; right: 8px; flex-wrap: wrap; pointer-events: none; }
.mapctl.bl > * { pointer-events: auto; }
.mbtn {
  min-height: 44px; min-width: 44px; padding: 0 12px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1.5px solid var(--line); color: var(--fg);
  font: 700 15px/1 var(--display); letter-spacing: 0.05em; text-decoration: none;
  box-shadow: 0 2px 10px rgb(0 0 0 / 0.25);
}
.mbtn svg { width: 22px; height: 22px; }
.mbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.mchip { padding: 6px 9px; border-radius: 8px; background: color-mix(in srgb, var(--bg) 85%, transparent); border: 1px solid var(--line); font: 600 13px/1.2 var(--mono); color: var(--fg); }
.mchip.warn { color: var(--warn); border-color: var(--warn); font-family: var(--display); letter-spacing: 0.04em; }
.map-fallback { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; text-align: center; color: var(--muted); }

.leaflet-container { background: var(--water); font: 500 14px/1.3 var(--body); }
.leaflet-touch .leaflet-bar a { width: 44px; height: 44px; line-height: 44px; font-size: 22px; }
.leaflet-bar a, .leaflet-bar a:hover { background: var(--surface); color: var(--fg); border-bottom-color: var(--line); }
.leaflet-touch .leaflet-bar { border: 1.5px solid var(--line); }
.leaflet-control-attribution.leaflet-control { background: color-mix(in srgb, var(--bg) 75%, transparent); color: var(--faint); font-size: 10px; }
.leaflet-control-attribution a { color: var(--muted); }
.mapcard.mini .leaflet-control-zoom { display: none; }

.pin {
  width: 34px; height: 34px; box-sizing: border-box; border-radius: 50%;
  display: grid; place-items: center; font: 700 14px/1 var(--display); letter-spacing: 0.02em;
  border: 3px solid #FFFFFF; box-shadow: 0 2px 8px rgb(0 0 0 / 0.5);
}
.pin.scene { background: var(--crit); color: #FFFFFF; width: 40px; height: 40px; font-size: 13px; }
.pin.staging { background: var(--warn); color: #1D1600; }
.pin.cstage { background: var(--surface); color: var(--warn); border: 2.5px dashed var(--warn); width: 30px; height: 30px; font-size: 12px; }
.pin.lz { background: var(--accent); color: var(--accent-ink); }
.pin.me { background: #2F7BFF; width: 22px; height: 22px; }
.pin.hosp { border-radius: 7px; width: 28px; height: 28px; background: var(--surface); color: var(--fg); border: 2.5px solid var(--accent); font-size: 15px; }
.pin.hosp.trauma { background: var(--crit); color: #FFFFFF; border-color: #FFFFFF; }
.town-label { font: 700 12px/1 var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; text-shadow: 0 0 3px var(--bg), 0 0 3px var(--bg); pointer-events: none; transform: translate(-50%, -50%); }

.mapview { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; height: 100%; min-height: 0; }
.mapview .mapcard { height: 100%; min-height: 420px; }
.mapside { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: auto; }
.coord { font: 600 15px/1.5 var(--mono); }
.coord small { display: block; color: var(--faint); font: 500 12px/1.3 var(--body); }

/* ---------- generic view layouts ---------- */
.view { display: flex; flex-direction: column; gap: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: start; }
.grid-hosp { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; align-items: start; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar .grow { flex: 1; }
.view-title { margin: 0; font: 700 26px/1 var(--display); letter-spacing: 0.02em; }

/* units */
.lanes { display: grid; grid-template-columns: repeat(6, minmax(160px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.lane { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.lane h3 { margin: 0; display: flex; justify-content: space-between; font: 700 14px/1 var(--display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.unit { position: relative; display: flex; flex-direction: column; border-radius: 10px; background: var(--raised); border: 1.5px solid var(--line); }
.unit .open { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 10px; background: transparent; border: 0; min-height: var(--tap); }
.unit .u1 { display: flex; justify-content: space-between; align-items: center; gap: 6px; }

function read(key) { try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
function write(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) { /* in-memory only */ } }

/* =====================================================================
   Derived numbers
   ===================================================================== */
const sentCat = k => S.transports.filter(t => t.cat === k).reduce((a, t) => a + t.n, 0);
const remaining = k => Math.max(0, S.triage[k] - sentCat(k));
const totalPts = () => PATIENT_KEYS.reduce((a, k) => a + (S.triage[k] || 0), 0);
const totalSent = () => S.transports.reduce((a, t) => a + t.n, 0);
const remainingTx = () => TX_CATS.reduce((a, k) => a + remaining(k), 0);
const hospSent = (id, k) => S.transports.filter(t => t.hosp === id && (!k || t.cat === k)).reduce((a, t) => a + t.n, 0);
const hospState = id => S.hospitals[id] || {};
const hospCap = id => hospState(id).cap || null;
const unitsBy = st => S.units.filter(u => u.status === st);
const openRequests = () => S.requests.filter(r => r.status !== 'onscene' && r.status !== 'cancelled');
const sceneLL = () => S.incident.ll || townLL(S.incident.municipality);
const hospMiles = h => miles(sceneLL(), h.ll);
const byDistance = list => { const o = sceneLL(); return o ? list.slice().sort((a, b) => miles(o, a.ll) - miles(o, b.ll)) : list.slice(); };

/* NJ Disaster Triage Tag guidance: tag when there are 4+ Red, 6+ mixed, or 8+ Green patients. */
const tagRuleMet = () => (S.triage.R || 0) >= 4 || Math.max(totalPts(), S.incident.est || 0) >= 6 || (S.triage.G || 0) >= 8;
const squadsInvolved = () => new Set(S.units.filter(u => kindOf(u.kind).g === 'ems' && !['available', 'released'].includes(u.status)).map(u => (u.agency || u.name).toLowerCase())).size;
function notices() {
  const out = [];
  if (tagRuleMet()) out.push('NJ tag rule met (4+ Red, 6+ patients, or 8+ Green): tag every patient.');
  const sq = squadsInvolved();
  if (sq >= 5) out.push(`${sq} EMS agencies on the board. County EMS Coordinator is notified at 5+ squads or 3+ towns.`);
  if (sq >= 6 && S.incident.mciLevel >= 2) out.push('Field Comm responds automatically to an MCI with 6+ squads.');
  return out;
}
const levelOf = lvl => MCI_LEVELS.find(x => x.level === lvl) || { label: `Level ${lvl}`, say: `level ${lvl}` };
const levelLabel = lvl => levelOf(lvl).label;

function benchReady(id) {
  if (S.bench[id]) return false;
  if (id === 'reds') return S.triage.R > 0 && remaining('R') === 0;
  if (id === 'allpts') return totalPts() > 0 && remainingTx() === 0;
  if (id === 'mci') return tagRuleMet();
  return false;
}

const app = document.getElementById('app');

function render() {
  const scrolls = {};
  document.querySelectorAll('[data-scroll]').forEach(el => { scrolls[el.dataset.scroll] = [el.scrollTop, el.scrollLeft]; });
  document.documentElement.dataset.mode = DEV.mode;
  parkMap();

  app.innerHTML = header() + rail() + `<main class="main" data-scroll="main-${UI.view}">${view()}</main>`;
  sheetRoot.innerHTML = UI.sheet ? sheetHtml() : '';

  document.querySelectorAll('[data-scroll]').forEach(el => {
    const v = scrolls[el.dataset.scroll];
    if (v) { el.scrollTop = v[0]; el.scrollLeft = v[1]; }
  });
  placeMap();
  tick();
}

function header() {
  const I = S.incident;
  const lvl = I.mciLevel, nts = notices();
  const mci = lvl
    ? `<button class="tag ${lvl >= 2 ? 'mci' : 'suggest'}" data-act="sheet" data-arg="mci">${esc(levelLabel(lvl))}</button>`
    : `<button class="tag" data-act="sheet" data-arg="mci">No MCI declared</button>`;
  const suggest = !lvl && tagRuleMet() ? `<button class="tag suggest" data-act="sheet" data-arg="mci">Tag rule met · declare?</button>`
    : nts.length > 1 ? `<button class="tag suggest" data-act="sheet" data-arg="mci">${nts.length} notices</button>` : '';
  const sample = S.sample ? `<span class="tag sample">Sample incident</span>` : '';
  const title = [I.type, I.location].filter(Boolean).join(' · ') || 'New incident';
  const sub = [
    I.municipality && esc(I.municipality),
    I.commandName && `<b>${esc(I.commandName)}</b>`,
    I.ic && `EMS Command: ${esc(I.ic)}`,
  ].filter(Boolean).join(' · ');
  return `<header class="head">
    <div class="inc">
      <div class="inc-top"><button class="tag role" data-act="sheet" data-arg="role">${esc((ROLES[DEV.role] || ROLES.command).name)} tablet</button>${syncChipHtml()}${mci}${suggest}${sample}</div>
      <h1><button class="titlebtn" data-act="sheet" data-arg="incident">${esc(title)}</button></h1>
      <div class="inc-sub">${sub || 'Tap the title to fill in incident details'}</div>
    </div>
    <div class="clocks">

      ${parOn() ? `<button class="par" id="par-btn" data-act="sheet" data-arg="par"><span class="lbl" data-clock="par-lbl">PAR due</span><span class="v" data-clock="par">--:--</span></button>` : ''}
      <button class="iconbtn" data-act="mode" aria-label="Switch to ${DEV.mode === 'day' ? 'night' : 'day'} mode">${icon(DEV.mode === 'day' ? 'moon' : 'sun')}<span class="lbl">${DEV.mode === 'day' ? 'Night' : 'Day'}</span></button>
    </div>
  </header>`;
}

function rail() {
  const badge = id => {
    if (id === 'transport') { const r = remaining('R'); return r ? `<span class="badge" aria-label="${r} Immediate awaiting transport">${r}</span>` : ''; }
    if (id === 'units') { const n = S.requests.filter(r => r.status === 'requested').length; return n ? `<span class="badge" aria-label="${n} requests not acknowledged">${n}</span>` : ''; }
    return '';
  };
  return `<nav class="rail" aria-label="Views">
    ${(RAILS[DEV.role] || RAILS.command).map(id => VIEWS.find(v => v.id === id)).map(v => `<button data-act="view" data-arg="${v.id}" ${UI.view === v.id ? 'aria-current="page"' : ''}><span class="ico">${icon(v.icon)}${badge(v.id)}</span>${v.label}</button>`).join('')}

    <button data-act="sheet" data-arg="menu">${icon('menu')}Menu</button>

}

function triagePanel() {
  const n = totalPts(), est = S.incident.est || 0;
  const denom = Math.max(n, est, 1);
  const seg = catsList().filter(c => c.k !== 'W').map(c => `<span style="width:${((S.triage[c.k] || 0) / denom) * 100}%;background:var(--${COLOR_VAR[c.k]})"></span>`).join('');
  return `<section class="panel" aria-label="Triage counts">
    <div class="ph"><h2>Patients · triage</h2><button class="btn small" data-act="sheet" data-arg="menu">${esc(S.method || 'START')}</button></div>
    <div class="tri-sum">
      <div class="tri-total num">${n}<small>${n === 1 ? 'patient' : 'patients'}</small></div>
      <div class="est">Est. <button data-act="est" data-arg="-1" aria-label="Lower estimate">−</button><span class="num">${est}</span><button data-act="est" data-arg="1" aria-label="Raise estimate">+</button></div>
    </div>
    <div class="bar" role="img" aria-label="${n} of an estimated ${est} triaged">${seg}</div>
    ${catsList().map(triRow).join('')}
  </section>`;
}
function triRow(c) {
  const count = S.triage[c.k] || 0;
  const sub = c.k === 'B' ? (count ? 'Leave in place unless directed' : 'None')
    : c.k === 'X' ? (count ? 'Comfort care; move after Red when resources allow' : 'None')
    : c.k === 'W' ? 'Not counted as patients'
    : `${sentCat(c.k)} transported · <b>${remaining(c.k)} on scene</b>`;
  return `<div class="tri tri-${c.k}">
    <div>
      <div class="tri-head"><span class="swatch">${c.color}</span><span class="tri-name">${c.name}</span></div>
      <div class="tri-count num">${count}</div>
      <div class="tri-sub">${sub}</div>
    </div>
    <div class="tri-btns">
      <button data-act="tri" data-arg="${c.k}-" aria-label="Remove one ${c.name}">−</button>

function benchPanel() {

  return `<section class="panel" aria-label="Benchmarks">

        const right = t ? `<span class="b-time">${hhmm(t)}<small>+${dur(t - T0)}</small></span>` : cls === 'ready' ? `<span class="b-ready">READY</span>` : '<span></span>';
        return `<button class="${cls}" data-act="bench" data-arg="${b.id}" aria-pressed="${t ? 'true' : 'false'}"><span class="tick">${icon('check')}</span><span class="b-label">${b.label}</span>${right}</button>`;

function resourcesPanel() {
  const active = S.units.filter(u => u.status !== 'released' && u.status !== 'available');

  const others = active.filter(u => kindOf(u.kind).g !== 'ems' && (u.status === 'onscene' || u.status === 'staged' || u.status === 'enroute'));

  const reqs = openRequests();
  return `<section class="panel" aria-label="Resources">
    <div class="ph"><h2>Resources</h2><button class="btn small" data-act="view" data-arg="units">Units</button></div>
    <div class="stats">
      <div class="stat"><span class="lbl">Amb. on scene</span><span class="v num">${amb('onscene')}</span></div>
      <div class="stat"><span class="lbl">Staged</span><span class="v num">${amb('staged')}</span></div>
      <div class="stat"><span class="lbl">En route</span><span class="v num">${amb('enroute')}</span></div>
      <div class="stat"><span class="lbl">Available</span><span class="v num">${unitsBy('available').length}</span></div>
    </div>
    <div class="field"><span class="lbl">Fire, special ops & support</span>
      ${others.length ? `<div class="chips">${others.map(u => `<button class="opt small" data-act="sheet" data-arg="unit:${u.id}">${kindTag(u.kind)} ${esc(u.name)}${u.status !== 'onscene' ? ` <small>${statusName(u.status)}</small>` : ''}</button>`).join('')}</div>` : '<span class="empty">None on the board</span>'}
    </div>
    <div class="field"><span class="lbl">Needed · open requests</span>

    <button class="btn block" data-act="sheet" data-arg="request">${icon('plus')} Request resources</button>

}
function reqRow(r) {

const REQ_FLOW = ['requested', 'ack', 'enroute', 'onscene'];

function miniMap() {
  return `<section class="mapcard mini" aria-label="Scene map">

function mapChips() {

function transportSummary() {
  const recent = S.transports.slice(-3).reverse();
  return `<section class="panel" aria-label="Transport">

    <span class="r num">${hhmm(t.t)}</span>
  </div>`;
}

function hospLoadPanel() {
  const list = byDistance(HOSPITALS).slice(0, 5);
  return `<section class="panel" aria-label="Nearest hospitals">
    <div class="ph"><h2>Nearest hospitals</h2><button class="btn small" data-act="view" data-arg="hospitals">All</button></div>
    <div>${list.map(h => {
      const cap = hospCap(h.id), hs = hospState(h.id);
      const capTotal = cap ? cap.R + cap.Y + cap.G : 0;
      const sent = hospSent(h.id);
      const pct = capTotal ? Math.min(100, (sent / capTotal) * 100) : 0;
      const mi = hospMiles(h);
      return `<button class="load" data-act="sheet" data-arg="hosp:${h.id}">
        <span class="nm">${esc(h.short)} <span class="note">${esc(h.town)}</span></span>
        <span class="dist">${mi != null ? `${mi.toFixed(1)} mi · ~${estMin(mi)}′` : ''}</span>
        <span class="why">${h.trauma ? `<span class="cap trauma">${esc(h.trauma)}</span>` : ''}${isDivert(hs.ed) ? `<span class="pill diversion">${esc(hs.ed)}</span>` : ''}<span class="num">Sent ${TX_CATS.map(k => `${hospSent(h.id, k)}${cap ? '/' + cap[k] : ''}`).join(' · ')}</span></span>
        <div class="bar"><span style="width:${pct}%;background:${capTotal && sent >= capTotal ? 'var(--crit)' : 'var(--accent)'}"></span></div>
      </button>`;
    }).join('')}</div>
    <div class="note">Straight-line distance from the scene pin, rough drive minutes. Sent / capacity is Red · Yellow · Green.</div>
  </section>`;

        ${DEV.me ? `<button class="btn block" data-act="use-me">${icon('locate')} Use my location as the scene</button>` : ''}

function listCounts(get, cats = catsList().filter(c => c.k !== 'W')) {
  const parts = cats.map(c => ({ c, n: get(c.k) })).filter(x => x.n > 0).map(x => `${x.n} ${x.c.name}`);
  return parts.length ? parts.join(', ') : 'none';
}
function radioScripts() {
  const I = S.incident;
  const cmd = I.commandName || 'Command';
  const loc = [I.location, I.municipality].filter(Boolean).join(', ') || '[location]';
  const n = totalPts();
  const onScene = S.units.filter(u => u.status === 'onscene' || u.status === 'staged');
  const amb = onScene.filter(u => TRANSPORT_KINDS.includes(u.kind));
  const fireSpec = onScene.filter(u => ['fire', 'spec'].includes(kindOf(u.kind).g)).map(u => u.name);
  const reqs = openRequests();
  const reqText = reqs.length ? reqs.map(r => `${r.qty > 1 ? r.qty + ' ' : ''}${r.what} (${reqStatusName(r.status).toLowerCase()})`).join('; ') : 'nothing further at this time';
  const counts = n ? `${n} patients: ${listCounts(k => S.triage[k])}` : `estimated ${I.est || 'unknown number of'} patients, triage under way`;
  const mciLine = I.mciLevel ? `${cmd} is declaring ${levelOf(I.mciLevel).say}.` : 'No MCI declared at this time.';
  const coords = I.ll ? ` Coordinates ${fmtLL(I.ll)}.` : '';

  const methane = [
    ['M', 'Major incident', mciLine],
    ['E', 'Exact location', `${loc}.${coords}`],
    ['T', 'Type', `${I.type}.`],
    ['H', 'Hazards', I.hazards.length ? `${I.hazards.join(', ')}.` : 'None noted.'],
    ['A', 'Access', [I.access, I.staging && `Staging at ${I.staging}`].filter(Boolean).join('. ') + '.'],
    ['N', 'Number of casualties', `${counts}.`],
    ['E', 'Emergency services', `On scene: ${amb.length} transport units${fireSpec.length ? ', ' + fireSpec.join(', ') : ''}${onScene.some(u => u.kind === 'PD') ? ', police' : ''}. Requesting: ${reqText}.`],
  ];
  const txc = catsList().filter(c => TX_CATS.includes(c.k));
  const sentList = listCounts(sentCat, txc);
  const can = [
    ['C', 'Conditions', `${counts}. ${I.hazards.length ? 'Hazards: ' + I.hazards.join(', ') + '.' : ''}`],
    ['A', 'Actions', `${BENCHMARKS.filter(b => S.bench[b.id]).slice(-3).map(b => b.label + ' ' + hhmm(S.bench[b.id])).join('; ')}. Transported ${totalSent()} (${sentList}). Remaining on scene: ${listCounts(remaining, txc)}.`],
    ['N', 'Needs', `${reqText}.`],
  ];
  const hospLine = `This is ${cmd}. We have an MCI at ${loc}, ${I.type.toLowerCase()}. ${counts}. First patients are ${totalSent() ? 'already en route' : 'about to leave'}. How many Red, Yellow and Green can you accept right now? Our transport officer will call each unit in with a tag number.`;
  const handoff = `${cmd} · ${loc}\n${I.type}. Dispatched ${hhmm(I.dispatchAt)}, ${mins(now() - I.dispatchAt)} ago.\nEMS Command: ${I.ic || 'unassigned'}. ${I.mciLevel ? levelLabel(I.mciLevel) + '.' : 'No MCI declared.'}\nPatients: ${counts}. Transported ${totalSent()}; ${remainingTx()} awaiting transport.\nPositions: ${ICS_POSITIONS.filter(p => S.ics[p.id]).map(p => p.label + ' – ' + S.ics[p.id].who).join('; ') || 'none assigned'}.\nUnits: ${S.units.filter(u => !['released', 'available'].includes(u.status)).length} assigned (${unitsBy('onscene').length} on scene, ${unitsBy('staged').length} staged, ${unitsBy('enroute').length} en route, ${unitsBy('transporting').length} transporting). ${S.people.filter(p => !p.out).length} members checked in.\nOpen requests: ${reqText}.\nStaging: ${I.staging || 'not set'}. Hazards: ${I.hazards.join(', ') || 'none noted'}.`;

  const ambOnScene = amb.length + S.units.filter(u => TRANSPORT_KINDS.includes(u.kind) && u.status === 'enroute').length;
  const ambNeeded = Math.max(0, remainingTx() - ambOnScene);
  const alsNeeded = Math.max(0, remaining('R') - S.units.filter(u => u.kind === 'ALS' && ['onscene', 'staged', 'enroute'].includes(u.status)).length);
  const icUnit = (S.units.find(u => u.task === 'Command' && kindOf(u.kind).g === 'ems') || {}).name || '[your unit]';
  const mutual = [
    ['', 'From', `${icUnit}, ${cmd}`],
    ['', 'Location', loc],
    ['', 'Type', I.type],
    ['', 'Approximate patients', counts],
    ['', 'Ambulances needed', String(ambNeeded)],
    ['', 'MICUs needed', String(alsNeeded)],
    ['', 'Extrication', S.bench.extrication ? 'Complete' : S.units.some(u => u.task === 'Extrication') ? 'In progress' : 'None'],
    ['', 'Special services', openRequests().filter(r => !/ambulance|ALS|MICU/i.test(r.what)).map(r => r.what).join(', ') || 'None'],
    ['', 'Staging area', I.staging || 'Not set'],
  ];
  const lz = I.lzLL || I.ll;
  const air = [
    ['', 'Patients', `${remaining('R')} Immediate awaiting transport`],
    ['', 'LZ', `${I.lzLocation || 'Not set'}${lz ? '. ' + fmtDDM(lz) : ''}`],
    ['', 'Size and surface', 'About 100 × 100 ft, firm and level (some NJ departments use 110 × 110)'],
    ['', 'Hazards', 'Wires, poles, trees, loose debris. [check and state]'],
    ['', 'Wind', '[direction and speed]'],
    ['', 'Ground contact', `${(S.ics['uc-fire'] || {}).who || 'LZ officer'} on Fireground 3 or 4 [confirm]`],
  ];
  const triageRpt = `Triage to Command: triage is ${S.bench.triage ? 'complete' : 'in progress'}. ${n} total patients: ${listCounts(k => S.triage[k] || 0)}.`;
  const fmt = rows => rows.map(([k, label, text]) => `${k ? `<span class="k">${k}</span>` : ''}<b>${esc(label.toUpperCase())}</b> ${esc(text)}`).join('\n');
  const plain = rows => rows.map(([, label, text]) => `${label}: ${text}`).join('\n');
  return [
    { title: 'Initial report · METHANE', when: 'First arriving officer to dispatch. Send again if the picture changes a lot.', html: fmt(methane), text: plain(methane) },
    { title: 'Progress report · CAN', when: 'Every 10 to 15 minutes, or when asked for an update.', html: fmt(can), text: plain(can) },
    { title: 'Hospital MCI notification', when: 'Medical Communications to each receiving ED.', html: esc(hospLine), text: hospLine },
    { title: 'Mutual aid request · County Communications', when: 'The items County Communications asks for on a mutual aid request (county EMS plan). Need is counted from patients awaiting transport.', html: fmt(mutual), text: plain(mutual) },
    { title: 'Air medical request', when: 'In Monmouth, medevac is requested through County Communications. Fill in the bracketed items.', html: fmt(air), text: plain(air) },
    { title: 'Triage report', when: 'Triage Unit Leader to Command when the first pass is done.', html: esc(triageRpt), text: triageRpt },
    { title: 'Command transfer briefing', when: 'Read to the officer taking over command, or paste into the after-action file.', html: esc(handoff), text: handoff },
  ];
}

/* =====================================================================
   Map (Leaflet). One map instance moves between the board corner and the
   full Map view, so it never reloads.
   ===================================================================== */
let MAP = null, mapKind = null;
const ML = {};
const mapBox = document.createElement('div');
mapBox.className = 'mapbox';
const mapPark = document.getElementById('map-park');
mapPark.appendChild(mapBox);
const NJ_ORTHO = 'https://maps.nj.gov/arcgis/rest/services/Basemap/Orthos_Natural_2020_NJ_WM/MapServer/tile/{z}/{y}/{x}';

const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const unpack = flat => { const out = []; for (let i = 0; i < flat.length; i += 2) out.push([flat[i] / 1e4, flat[i + 1] / 1e4]); return out; };
const insideSample = ll => !!(ll && SAMPLE_SCENE && L_ok() && L.latLngBounds(SAMPLE_SCENE.bounds).contains(ll));
const L_ok = () => typeof window.L !== 'undefined';
const roadLabel = n => n.replace('Garden State Pkwy', 'Garden State Parkway').replace('New Jersey Tpke', 'NJ Turnpike').replace(/^I- /, 'I-').replace(/^State (Rte|Hwy) /, 'Route ').replace(/^US Hwy /, 'US ');

function ensureMap() {
  if (MAP || !L_ok()) return;
  MAP = L.map(mapBox, { preferCanvas: true, zoomControl: true, attributionControl: true, minZoom: 8, maxZoom: 20, zoomSnap: 0.5, center: [40.27, -74.17], zoom: 10 });
  MAP.attributionControl.setPrefix(false);
  /* Leaflet draws vectors on a canvas that sits above image layers, so town fills get their own pane under the
     imagery (tiles are 200) and roads one above it. */
  MAP.createPane('towns').style.zIndex = 150;
  MAP.createPane('aerial').style.zIndex = 250;
  MAP.createPane('roads').style.zIndex = 300;
  const townCanvas = L.canvas({ padding: 0.3, pane: 'towns' });
  const roadCanvas = L.canvas({ padding: 0.3, pane: 'roads' });

  ML.vector = L.layerGroup().addTo(MAP);
  ML.roadLayer = L.layerGroup().addTo(MAP);
  if (GEO) {
    ML.towns = GEO.towns.map(t => L.polygon(t.r.map(unpack), { pane: 'towns', renderer: townCanvas, interactive: false, weight: t.m ? 1.2 : 0.6 }).addTo(ML.vector));
    ML.roads = GEO.roads.map(r => L.polyline(unpack(r.p), { pane: 'roads', renderer: roadCanvas, interactive: false, weight: r.k ? 3 : 1.6 }).addTo(ML.roadLayer));
    ML.labels = L.layerGroup(TOWNS.filter(t => t.home).map(t => L.marker(t.ll, { interactive: false, keyboard: false, icon: L.divIcon({ className: '', html: `<div class="town-label">${esc(t.name.replace(/ (Township|Borough|City|Village)$/, ''))}</div>`, iconSize: [0, 0] }) })));
    MAP.attributionControl.addAttribution('Boundaries & roads: US Census 2023');
  }
  if (SAMPLE_SCENE) ML.sample = L.imageOverlay(SAMPLE_SCENE.img, SAMPLE_SCENE.bounds, { pane: 'aerial', interactive: false, attribution: 'Aerial: NJ Office of GIS, 2020' });

  ML.live = L.tileLayer(NJ_ORTHO, { maxZoom: 20, maxNativeZoom: 20, attribution: 'Aerial: NJ Office of GIS, 2020', crossOrigin: false });
  ML.live.on('tileload', () => { if (UI.live !== 'ok') { UI.live = 'ok'; refreshChips(); syncRoads(); } });
  ML.live.on('tileerror', () => { if (UI.live === 'unknown') { UI.live = 'blocked'; refreshChips(); } });

  ML.pins = L.layerGroup().addTo(MAP);

function hospRank(h, k, o) {

/* Paste a list of units, one per line: "29-56 BLS Squad 29" or "MICU 9, ALS, RWJBH". */
function parseUnits(text) {
  const kinds = UNIT_KINDS.map(k => k.k);
  const guess = (id, rest) => {
    const all = (id + ' ' + rest).toUpperCase();
    const explicit = kinds.find(k => new RegExp(`(^|[\\s,;|])${k}($|[\\s,;|])`).test(all));
    if (explicit) return explicit;
    if (/^(M|MEDIC|MICU)[-\s]?\d/.test(id.toUpperCase()) || /^59-/.test(id) || /MEDIC|PARAMEDIC|MICU/.test(all)) return 'ALS';
    if (/^\d{2}-5[0-4]$/.test(id)) return 'SUP';
    if (/^\d{2}-55$/.test(id) || /^(RV|FR)[-\s]?\d/.test(id.toUpperCase()) || /RESPONSE|FLY ?CAR/.test(all)) return 'RV';   // county pattern: 50 captain/chief, 51-54 officers
    if (/^(E|ENG|ENGINE)[-\s]?\d/.test(id.toUpperCase())) return 'ENG';
    if (/^(L|T|TRK|TRUCK|LADDER|TOWER)[-\s]?\d/.test(id.toUpperCase())) return 'TRK';
    if (/^(R|RES|RESCUE)[-\s]?\d/.test(id.toUpperCase())) return 'RES';
    if (/HAZ/.test(all)) return 'HAZ';
    return 'BLS';
  };
  return text.split(/\n+/).map(l => l.trim()).filter(Boolean).map(line => {
    const parts = line.split(/[,\t;|]+/).map(s => s.trim()).filter(Boolean);
    let id, rest;
    if (parts.length > 1) { id = parts[0]; rest = parts.slice(1).join(' '); }
    else { const m = line.match(/^(\S+(?:\s\d[\w-]*)?)\s*(.*)$/); id = m[1]; rest = m[2]; }
    const kind = guess(id, rest);
    const agency = rest.split(/\s+/).filter(w => w.toUpperCase() !== kind).join(' ').trim();
    return { name: id.toUpperCase(), kind, agency: agency || 'Mutual aid' };
  });
}

/* =====================================================================
   Shared incident. Every change is an event; each tablet keeps its own
   list of events and every tablet replays all of them over the incident's
   starting state. Two tablets tapping at once can't overwrite each other,
   counts add up, and undo takes back one event.
   ===================================================================== */
let BASE = null;              // the incident as it was when command was established
const EVENTS = new Map();     // every event from every tablet, by id
let seq = 0;

const byTime = (a, b) => a.t - b.t || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
const undoneIds = () => new Set([...EVENTS.values()].filter(e => e.type === 'undo').map(e => e.p.target));
function replay() {
  const st = JSON.parse(JSON.stringify(BASE));
  const undone = undoneIds();
  for (const e of [...EVENTS.values()].sort(byTime)) {
    if (undone.has(e.id)) continue;
    if (e.type !== 'undo' && R[e.type]) { try { R[e.type](st, e.p); } catch (err) { console.warn('Skipped an event that no longer applies', e.type, err); } }
    if (e.text) st.log.push({ t: e.t, kind: e.kind, text: e.text, role: e.role });
  }
  return st;
}
function rebuild() { S = replay(); }
function saveLocal() { write(K.inc, BASE); write(K.ev(BASE.id), [...EVENTS.values()]); }

function dispatch(type, p, text, kind = 'note', { toast = true } = {}) {
  const e = { id: `${DEV.id}.${Date.now().toString(36)}.${(seq++).toString(36)}`, dev: DEV.id, role: DEV.role, t: now(), type, p, text: text || '', kind };
  EVENTS.set(e.id, e);
  rebuild(); saveLocal(); render();
  if (toast && text) showToast(text, e.id);
  Sync.push();
  return e;
}

const unitIn = (st, id) => st.units.find(u => u.id === id);
/* Reducers: how each event changes the incident. They must depend only on the event, never on the clock. */
const R = {
  tri(st, p) { st.triage[p.k] = Math.max(0, (st.triage[p.k] || 0) + p.d); },
  retriage(st, p) { if ((st.triage[p.from] || 0) > 0) { st.triage[p.from]--; st.triage[p.to] = (st.triage[p.to] || 0) + 1; } },
  est(st, p) { st.incident.est = p.v; },
  bench(st, p) { if (p.on) st.bench[p.id] = p.at; else delete st.bench[p.id]; },
  mci(st, p) { st.incident.mciLevel = p.L; if (p.L >= 2 && !st.bench.mci) st.bench.mci = p.at; },
  method(st, p) { st.method = p.m; if (p.m !== 'SALT' && st.triage.X) { st.triage.B = (st.triage.B || 0) + st.triage.X; st.triage.X = 0; } },
  white(st, p) { st.white = p.on; },
  pin(st, p) { st.incident[p.field] = p.ll; },
  staging(st, p) { st.incident.staging = p.staging; st.incident.stagingLL = p.ll; if (!st.bench.staging) st.bench.staging = p.at; },
  tx(st, p) {
    st.transports.push({ id: p.id, cat: p.cat, n: p.n, tags: p.tags, age: p.age, unit: p.unit, hosp: p.hosp, t: p.at });
    const u = unitIn(st, p.unit);
    if (u) { u.status = 'transporting'; u.task = 'To ' + ((hosp(p.hosp) || {}).short || 'hospital'); u.t = p.at; }
  },
  par(st, p) { st.par.last = p.at; },
  parInterval(st, p) { st.par.interval = p.m; },
  unitStatus(st, p) { const u = unitIn(st, p.id); if (!u) return; u.status = p.st; u.t = p.at; if (p.clearTask) u.task = ''; },
  unitTask(st, p) { const u = unitIn(st, p.id); if (!u) return; u.task = p.task; if (p.task && u.status !== 'onscene') { u.status = 'onscene'; u.t = p.at; } },
  unitCrew(st, p) { const u = unitIn(st, p.id); if (u) u.crew = p.crew; },
  unitRemove(st, p) { st.units = st.units.filter(x => x.id !== p.id); },
  unitAdd(st, p) { p.units.forEach(u => { if (!st.units.some(x => x.name === u.name)) st.units.push({ ...u }); }); },
  personAdd(st, p) { if (!st.people.some(x => x.id === p.person.id)) st.people.push({ ...p.person }); },
  personEdit(st, p) { const x = st.people.find(q => q.id === p.id); if (x) Object.assign(x, p.fields); },
  personOut(st, p) { const x = st.people.find(q => q.id === p.id); if (x) x.out = p.at; },
  reqAdd(st, p) { st.requests.push({ ...p.req }); },
  reqStatus(st, p) { const r = st.requests.find(x => x.id === p.id); if (r) r.status = p.st; },
  icsSet(st, p) { st.ics[p.pos] = { who: p.who, t: p.at }; },
  icsClear(st, p) { delete st.ics[p.pos]; },
  hospNotify(st, p) { st.hospitals[p.id] = { ...(st.hospitals[p.id] || {}), notifiedAt: p.at }; },
  hospReport(st, p) { st.hospitals[p.id] = { ...(st.hospitals[p.id] || {}), cap: p.cap, beds: p.beds, ed: p.ed, capAt: p.at }; },
  incEdit(st, p) { Object.assign(st.incident, p.fields); },
  note() {},
};

/* =====================================================================
   Sync between tablets, through this page's shared store.

   live/current                         which incident every tablet follows
   incidents/<id>                       its starting state
   incidents/<id>/devices/<tablet>~<n>  that tablet's events, written only by it
   config/agency                        squad, unit roster, members, extra numbers

   Without the store (signed out, or the page opened somewhere else) the
   board runs on this tablet alone, exactly as before.
   ===================================================================== */
const STOP_CODES = ['revoked', 'not_granted', 'capability_disabled', 'capability_removed'];
const CHUNK = 300;   // events per document, well under the store's 256 KiB per document
const Sync = {
  db: null, room: null, state: 'local', incId: null, devUnsub: null,
  writing: false, dirty: false, written: {}, error: '', peers: [], booted: false, cfgWriting: null,

  async start() {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    this.state = 'connecting'; syncChip();
    let db = null;
    try { db = await window.claude.use('db'); } catch (e) { db = null; }
    if (!db) { this.state = 'local'; syncChip(); return; }
    this.db = db;
    db.doc('live/current').onSnapshot(s => this.onPointer(s), e => this.stop(e));
    db.doc('config/agency').onSnapshot(s => this.onConfig(s), () => {});
    try {
      const room = await window.claude.use('room');
      if (room) {
        this.room = room;
        room.presence({ role: DEV.role, dev: DEV.id }).catch(() => {});
        room.onPeers(ch => { this.peers = ch.peers; syncChip(); }, () => { this.room = null; this.peers = []; syncChip(); });
      }
    } catch (e) { this.room = null; }
  },

  onPointer(snap) {
    const d = snap.exists ? snap.data() : null;
    if (!d || !d.incident) {
      if (this.state !== 'live') { this.state = 'unshared'; syncChip(); }
      this.booted = true;
      return;
    }
    if (d.incident === this.incId) return;
    this.follow(d.incident, this.booted);
    this.booted = true;
  },

  async follow(id, announce) {
    this.incId = id;
    if (this.devUnsub) { this.devUnsub(); this.devUnsub = null; }
    if (!BASE || BASE.id !== id) {
      let snap;
      try { snap = await this.db.doc('incidents/' + id).get(); } catch (e) { return this.fail(e); }
      if (!snap.exists || this.incId !== id) return;
      BASE = snap.data().base;
      EVENTS.clear();
      (read(K.ev(id)) || []).forEach(e => EVENTS.set(e.id, e));
      UI.sheet = null; UI.form = {}; mapKind = null;
      rebuild(); saveLocal(); render();
      showToast(announce ? 'Another tablet started a new incident. This board now follows it.' : 'Joined the live incident.', false);
    }
    this.written = {};
    this.devUnsub = this.db.collection(`incidents/${id}/devices`).onSnapshot(qs => {
      let changed = false;
      qs.docs.forEach(d => {
        const b = d.data();
        ((b && b.events) || []).forEach(e => { if (!EVENTS.has(e.id)) { EVENTS.set(e.id, e); changed = true; } });
      });
      if (changed) { rebuild(); saveLocal(); render(); }
    }, e => this.stop(e));
    this.state = 'live'; syncChip();
    this.flush();
  },

  /* Make this tablet's incident the one every tablet follows. */
  async announce() {
    if (!this.db) return;
    const id = BASE.id;
    this.state = 'sharing'; syncChip();
    try {
      await this.db.doc('incidents/' + id).set({ base: BASE, createdAt: now(), by: DEV.id });
      this.incId = id;
      await this.db.doc('live/current').set({ incident: id, at: now(), by: DEV.id });
      this.follow(id, false);
    } catch (e) { this.fail(e); }
  },

  push() {
    if (!this.db) return;
    if (this.state === 'unshared') return this.announce();
    if (this.state === 'live') return this.flush();
  },

  mine() { return [...EVENTS.values()].filter(e => e.dev === DEV.id).sort(byTime); },
  pending() {
    const mine = this.mine();
    let n = 0;
    for (let i = 0; i * CHUNK < mine.length; i++) n += Math.min(CHUNK, mine.length - i * CHUNK) - (this.written[`${this.incId}:${i}`] || 0);
    return n;
  },

  /* One write at a time to each document; a burst of taps becomes one write. */
  async flush() {
    if (!this.db || this.state !== 'live' || !this.incId) return;
    if (this.writing) { this.dirty = true; return; }
    this.writing = true;
    try {
      do {
        this.dirty = false;
        const inc = this.incId, mine = this.mine();
        for (let i = 0; i * CHUNK < mine.length; i++) {
          const part = mine.slice(i * CHUNK, (i + 1) * CHUNK), key = `${inc}:${i}`;
          if (this.written[key] === part.length) continue;
          await this.db.doc(`incidents/${inc}/devices/${DEV.id}~${i}`).set({ dev: DEV.id, role: DEV.role, events: part, at: now() });
          this.written[key] = part.length;
        }
      } while (this.dirty);
      this.error = '';
    } catch (e) { this.fail(e); }
    this.writing = false;
    syncChip();
  },

  fail(e) {
    const code = (e && e.code) || 'unavailable';
    if (STOP_CODES.includes(code)) return this.stop(e);
    this.error = code;
    if (code === 'quota_exceeded') showToast('The shared board is full. Start a new incident to keep sharing.', false);
    clearTimeout(this.retry);
    this.retry = setTimeout(() => (this.state === 'unshared' || this.state === 'sharing' ? this.announce() : this.flush()), 4000 + Math.random() * 4000);
    syncChip();
  },
  stop() { this.state = 'local'; this.db = null; this.peers = []; syncChip(); },

  onConfig(snap) {
    if (!snap.exists) return;
    C = { ...defaultConfig(), ...snap.data() };
    write(K.cfg, C);
    if (!UI.sheet) render();
  },
  pushConfig() {
    if (!this.db) return;
    const go = () => this.db.doc('config/agency').set(JSON.parse(JSON.stringify(C))).catch(() => {});
    this.cfgWriting = (this.cfgWriting || Promise.resolve()).then(go);
  },
  setRole() { if (this.room) this.room.presence({ role: DEV.role, dev: DEV.id }).catch(() => {}); },
  tablets() { return this.peers.filter(p => p.kind !== 'agent'); },
};

function syncChipHtml() {
  const s = Sync.state, n = Sync.tablets().length, waiting = Sync.db ? Sync.pending() : 0;
  if (s === 'live' && Sync.error) return `<button class="tag suggest" id="sync-chip" data-act="sheet" data-arg="role">Sync paused · ${waiting} waiting</button>`;
  if (s === 'live') return `<button class="tag live" id="sync-chip" data-act="sheet" data-arg="role">● Live${n ? ' · ' + plural(n, 'tablet') : ''}</button>`;
  if (s === 'unshared') return `<button class="tag" id="sync-chip" data-act="share">Share this board</button>`;
  if (s === 'sharing' || s === 'connecting') return `<span class="tag" id="sync-chip">Connecting…</span>`;
  return `<button class="tag" id="sync-chip" data-act="sheet" data-arg="role">This tablet only</button>`;
}
function syncChip() { const el = document.getElementById('sync-chip'); if (el) el.outerHTML = syncChipHtml(); }

function startIncident(base, msg) {
  BASE = base; EVENTS.clear(); rebuild(); saveLocal();
  UI.sheet = null; UI.form = {}; UI.view = homeView(); mapKind = null;
  render(); showToast(msg, false);
  if (Sync.db) Sync.announce();
}

/* =====================================================================
   Actions
   ===================================================================== */
function openSheet(name) { UI.sheet = name; UI.form = {}; render(); }
function closeSheet() { UI.sheet = null; UI.form = {}; render(); }
function showToast(msg, undoId) {
  clearTimeout(toastTimer);
  toastRoot.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${undoId ? `<button data-act="undo" data-arg="${esc(undoId)}">Undo</button>` : ''}</div>`;
  toastTimer = setTimeout(() => { toastRoot.innerHTML = ''; }, 5000);
}
function copyText(text, el) {
  const ok = () => showToast('Copied', false);
  const fallback = () => {
    if (el && el.id && el.id.startsWith('script-')) { const r = document.createRange(); r.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }
    showToast(text.length <= 48 ? `Couldn't copy here. ${text}` : "Couldn't copy here. The text is selected; use your copy command.", false);
  };
  try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (e) { fallback(); }
}
function formPath(name) {
  const path = name.split('.');
  let obj = UI.form;
  for (let i = 0; i < path.length - 1; i++) obj = obj[path[i]] = obj[path[i]] || {};
  return [obj, path[path.length - 1]];
}
const triageReport = () => `${totalPts()} patients: ${listCounts(k => S.triage[k] || 0)}`;

const A = {
  view(id) { UI.view = id; UI.pinMode = null; saveUi(); render(); app.querySelector('.main')?.scrollTo?.(0, 0); },
  sheet(name) { openSheet(name); },
  close() { closeSheet(); },
  backdrop(_, el, e) { if (e.target === el) closeSheet(); },
  mode() { DEV.mode = DEV.mode === 'day' ? 'night' : 'day'; saveDev(); render(); styleMap(); },
  'mode-set'(m) { DEV.mode = m; saveDev(); render(); styleMap(); },
  undo(id) {
    const target = EVENTS.get(id);
    if (!target || undoneIds().has(id)) return;
    dispatch('undo', { target: id }, `Undid: ${target.text}`, target.kind, { toast: false });
    showToast('Undone', false);
  },
  share() { if (Sync.db) Sync.announce(); },
  role(r) {
    if (DEV.role === r) return;
    DEV.role = r; saveDev(); Sync.setRole();
    UI.sheet = null; UI.form = {}; UI.view = homeView(); saveUi(); render();
    showToast(`This tablet is now ${ROLES[r].name}.`, false);
  },

  tri(arg) {
    const k = arg[0], d = arg[1] === '+' ? 1 : -1, c = cat(k);
    const have = S.triage[k] || 0;
    if (d < 0 && have <= (TX_CATS.includes(k) ? sentCat(k) : 0)) {
      showToast(have ? `Can't go below the ${sentCat(k)} already transported` : `No ${c.name} to remove`, false);
      return;
    }
    dispatch('tri', { k, d }, `Triage ${d > 0 ? '+1' : '−1'} ${c.color} (${c.name}): now ${have + d}`, 'triage');
  },
  retriage(arg) {
    const [from, to] = arg.split('>'), a = cat(from), b = cat(to);
    const left = TX_CATS.includes(from) ? remaining(from) : (S.triage[from] || 0);
    if (left < 1) { showToast(`No ${a.name} patients on scene to move`, false); return; }
    dispatch('retriage', { from, to }, `Re-triage: 1 ${a.color} → ${b.color} (${b.name})`, 'triage');
  },
  'triage-done'() {
    if (S.bench.triage) dispatch('note', {}, `Triage update: ${triageReport()}`, 'triage');
    else dispatch('bench', { id: 'triage', on: true, at: now() }, `Primary triage complete: ${triageReport()}`, 'bench');
  },
  est(d) { dispatch('est', { v: Math.max(0, (S.incident.est || 0) + Number(d)) }, '', 'triage', { toast: false }); },
  bench(id) {
    const b = BENCHMARKS.find(x => x.id === id);
    if (S.bench[id]) dispatch('bench', { id, on: false }, `Benchmark cleared: ${b.label}`, 'bench');
    else dispatch('bench', { id, on: true, at: now() }, b.label, 'bench');
  },
  'mci-set'(lvl) {
    const L = Number(lvl);
    if (L === S.incident.mciLevel) return;
    dispatch('mci', { L, at: now() }, L ? `Declared ${levelOf(L).say}` : 'MCI stood down', 'bench');
  },

  'f-set'(arg) {
    const i = arg.indexOf('='), k = arg.slice(0, i), v = arg.slice(i + 1);
    const sticky = ['cat', 'type', 'kind', 'status', 'lz', 'into', 'cert', 'ed', 'akind'];
    UI.form[k] = UI.form[k] === v && !sticky.includes(k) ? '' : v;
    if (k === 'cat') UI.form.n = 1;
    render();
  },
  'f-toggle'(arg) {
    const i = arg.indexOf('='), k = arg.slice(0, i), v = arg.slice(i + 1);
    const a = UI.form[k] = (UI.form[k] || []).slice();
    const j = a.indexOf(v); if (j >= 0) a.splice(j, 1); else a.push(v);
    render();
  },
  'f-toggle-bool'(k) { UI.form[k] = !UI.form[k]; render(); },
  step(arg) {
    const [name, d, min, max] = arg.split(':');
    const [obj, key] = formPath(name);
    const def = name === 'n' || name === 'qty' ? 1 : name === 'crew' ? 2 : 0;
    obj[key] = Math.min(Number(max), Math.max(Number(min), (obj[key] ?? def) + Number(d)));
    render();
  },

  /* map */
  'map-layer'() { UI.mapLayer = UI.mapLayer === 'sat' ? 'map' : 'sat'; saveUi(); syncLayer(); render(); },
  'map-fit'() { if (MAP) { mapKind = null; placeMap(); } },
  'pin-mode'(k) { UI.pinMode = UI.pinMode === k ? null : k; render(); },
  'map-hosp'(id) { const h = hosp(id); if (MAP && h) MAP.setView(h.ll, 15); },
  locate() {
    if (!navigator.geolocation) { showToast("This device can't share its location. Tap the map to place the pin.", false); return; }
    showToast('Finding your location…', false);
    navigator.geolocation.getCurrentPosition(pos => {
      DEV.me = { ll: [+pos.coords.latitude.toFixed(6), +pos.coords.longitude.toFixed(6)], acc: Math.round(pos.coords.accuracy), t: now() };
      saveDev();
      if (UI.view !== 'map') UI.view = 'map';
      render();
      if (MAP) MAP.setView(DEV.me.ll, 17);
      showToast(`Located within ${DEV.me.acc} m. Tap "Use my location as the scene" to pin it.`, false);
    }, () => {
      showToast("Location isn't available here. Choose Scene on the Map and tap where you are.", false);
    }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 });
  },
  'use-cstage'(i) { const c = COUNTY_STAGING[Number(i)]; dispatch('staging', { staging: `${c.name}, ${c.note}`, ll: c.ll, at: now() }, `Staging set: ${c.name}`, 'bench'); },
  'map-goto'(ll) { if (MAP) MAP.setView(ll.split(',').map(Number), 15); },
  'use-me'() { if (!DEV.me) return; dispatch('pin', { field: 'll', ll: DEV.me.ll }, `Scene pinned at my location, ${fmtLL(DEV.me.ll)} (±${DEV.me.acc} m)`, 'note'); },
  'hosp-filter'(k) { const a = UI.hospFilter; const i = a.indexOf(k); if (i >= 0) a.splice(i, 1); else a.push(k); render(); },
  'copy-text'(text, el) { copyText(text, el); },

  /* transport */
  'tx-with'(unitId) { openSheet('transport'); UI.form.unit = unitId; UI.form.cat = TX_CATS.find(k => remaining(k) > 0); UI.form.n = 1; render(); },
  'tx-save'() {
    const f = UI.form, u = unitById(f.unit), h = hosp(f.hosp), n = Math.min(f.n || 1, remaining(f.cat));
    if (!u || !h || !f.cat || n < 1) return;
    UI.sheet = null; UI.form = {};
    dispatch('tx', { id: uid(), cat: f.cat, n, tags: (f.tags || '').trim(), age: f.age || '', unit: u.id, hosp: h.id, at: now() },
      `${u.name} departed: ${n} ${cat(f.cat).name}${f.age && f.age !== 'Adult' ? ' (' + f.age.toLowerCase() + ')' : ''} → ${h.short}${f.tags ? ` (tag ${f.tags})` : ''}`, 'transport');
  },

  /* PAR */
  'par-toggle'(id) { UI.form.par = UI.form.par || {}; UI.form.par[id] = !UI.form.par[id]; render(); },
  'par-all'() { UI.form.par = {}; S.units.filter(u => u.status === 'onscene' || u.status === 'staged').forEach(u => { UI.form.par[u.id] = true; }); render(); },
  'par-save'() {
    const units = S.units.filter(u => u.status === 'onscene' || u.status === 'staged');
    const ok = units.filter(u => UI.form.par && UI.form.par[u.id]);
    const missing = units.filter(u => !(UI.form.par && UI.form.par[u.id])).map(u => u.name);
    UI.sheet = null; UI.form = {};
    dispatch('par', { at: now() }, `PAR complete: ${ok.length} of ${units.length} units accounted for${missing.length ? '. NOT accounted: ' + missing.join(', ') : ''}`, 'par');
  },
  'par-feature'(v) {
    C.features = { ...(C.features || {}), par: v === 'on' };
    if (v === 'on') dispatch('par', { at: now() }, '', 'par', { toast: false });   // the clock starts when PAR is turned on
    saveConfig(); render();
    showToast(v === 'on' ? `PAR checks on: every ${S.par.interval} minutes` : 'PAR checks hidden', false);
  },
  'par-int'(m) { dispatch('parInterval', { m: Number(m) }, '', 'par', { toast: false }); },
  method(m) { if (S.method !== m) dispatch('method', { m }, `Triage method: ${m}`, 'triage'); },
  'white-toggle'() { dispatch('white', { on: !S.white }, '', 'triage', { toast: false }); },

  /* units */
  'unit-group'(g) { UI.unitGroup = g; render(); },
  'unit-quick'(arg) {
    const [id, st] = arg.split('='), u = unitById(id);
    if (u) dispatch('unitStatus', { id, st, at: now(), clearTask: st !== 'onscene' }, `${u.name}: ${statusName(st)}`, 'units');
  },
  'unit-status'(arg) {
    const [id, st] = arg.split('='), u = unitById(id);
    if (!u || u.status === st) return;
    dispatch('unitStatus', { id, st, at: now(), clearTask: ['released', 'staged', 'available', 'enroute'].includes(st) }, `${u.name}: ${statusName(st)}`, 'units');
  },
  'unit-task'(arg) {
    const i = arg.indexOf('='), id = arg.slice(0, i), task = arg.slice(i + 1), u = unitById(id);
    if (!u || u.task === task) return;
    dispatch('unitTask', { id, task, at: now() }, task ? `${u.name} assigned: ${task}` : `${u.name}: assignment cleared`, 'units');
  },
  'unit-crew'(arg) {
    const [id, d] = arg.split(':'), u = unitById(id); if (!u) return;
    dispatch('unitCrew', { id, crew: Math.max(0, Math.min(20, (u.crew || 0) + Number(d))) }, '', 'units', { toast: false });
  },
  'unit-remove'(id) {
    const u = unitById(id); if (!u) return;
    UI.sheet = null;
    dispatch('unitRemove', { id }, `${u.name} removed from the board`, 'units');
  },
  'unit-save'() {
    const f = UI.form, name = (f.name || '').trim().toUpperCase();
    if (!name) { showToast('Give the unit a number first', false); document.getElementById('unit-name')?.focus(); return; }
    if (S.units.some(u => u.name === name)) { showToast(`${name} is already on the board`, false); return; }
    UI.sheet = null; UI.form = {};
    dispatch('unitAdd', { units: [{ id: uid(), name, kind: f.kind, agency: (f.agency || '').trim() || 'Mutual aid', crew: f.crew ?? 2, status: f.status, task: '', t: now() }] },
      `${name} (${kindOf(f.kind).name}) added: ${statusName(f.status)}`, 'units');
  },
  'units-load'() {
    const f = UI.form, parsed = parseUnits(f.text || '');
    if (!parsed.length) { showToast('Paste at least one unit first', false); return; }
    const have = new Set(S.units.map(u => u.name));
    const fresh = parsed.filter(p => !have.has(p.name));
    if (f.saveRoster) {
      const names = new Set(C.roster.map(r => r.name));
      C.roster = C.roster.concat(parsed.filter(p => !names.has(p.name)).map(p => ({ name: p.name, kind: p.kind })));
      saveConfig();
    }
    UI.sheet = null; UI.form = {};
    dispatch('unitAdd', { units: fresh.map(p => ({ id: uid(), ...p, crew: 2, status: f.into, task: '', t: now() })) },
      `Loaded ${plural(fresh.length, 'unit')} as ${statusName(f.into)}${parsed.length > fresh.length ? ` (${parsed.length - fresh.length} already on the board)` : ''}`, 'units');
  },

  /* agency */
  'ag-add'() {
    const f = UI.form, name = (f.unum || '').trim().toUpperCase();
    if (!name) { showToast('Type the unit number first', false); document.getElementById('ag-unit')?.focus(); return; }
    if (f.roster.some(r => r.name === name)) { showToast(`${name} is already in the list`, false); return; }
    f.roster.push({ name, kind: f.akind || 'BLS' }); f.unum = '';
    render();
    document.getElementById('ag-unit')?.focus();
  },
  'ag-del'(i) { UI.form.roster.splice(Number(i), 1); render(); },
  'agency-save'(addNow) {
    const f = UI.form;
    C.agency = { ...C.agency, name: (f.aname || '').trim() || 'My squad' };
    C.roster = f.roster.slice();
    saveConfig();
    UI.sheet = null; UI.form = {};
    const missing = C.roster.filter(r => !S.units.some(u => u.name === r.name));
    if (addNow === 'add' && missing.length) {
      dispatch('unitAdd', { units: missing.map(r => ({ id: uid(), name: r.name, kind: r.kind, agency: C.agency.name, crew: 2, status: 'available', task: '', t: now() })) },
        `${C.agency.name}: ${plural(missing.length, 'unit')} added as Available`, 'units');
    } else { render(); showToast(`${C.agency.name} saved: ${plural(C.roster.length, 'unit')}`, false); }
  },

  /* people */
  'member-pick'(num) {
    const m = C.members.find(x => x.num === num); if (!m) return;
    Object.assign(UI.form, { num: m.num, name: m.name, cert: m.cert || UI.form.cert });
    render();
  },
  'person-save'(id) {
    const f = UI.form, num = (f.num || '').trim(), name = (f.name || '').trim();
    if (!num && !name) { showToast('Enter a member number or a name', false); return; }
    const where = [f.unit, f.task].filter(Boolean).join(' · ');
    if (!id && S.people.some(p => !p.out && p.num && p.num === num)) { showToast(`#${num} is already checked in`, false); return; }
    UI.sheet = null; UI.form = {};
    if (id) {
      dispatch('personEdit', { id, fields: { num, name, cert: f.cert, unit: f.unit || '', task: f.task || '' } }, `${name || '#' + num}: ${where || 'unassigned'}`, 'people');
    } else {
      if (num && name && !C.members.some(m => m.num === num)) { C.members.push({ num, name, cert: f.cert }); saveConfig(); }
      dispatch('personAdd', { person: { id: uid(), num, name, cert: f.cert, unit: f.unit || '', task: f.task || '', t: now() } },
        `Checked in #${num || '?'} ${name} (${f.cert})${where ? ' → ' + where : ''}`, 'people');
    }
  },
  'person-out'(id) {
    const p = S.people.find(x => x.id === id); if (!p) return;
    UI.sheet = null; UI.form = {};
    dispatch('personOut', { id, at: now() }, `Checked out #${p.num} ${p.name}`, 'people');
  },
  'members-save'() {
    const lines = (UI.form.mtext || '').split(/\n+/).map(l => l.trim()).filter(Boolean);
    C.members = lines.map(l => { const [num, name, cert] = l.split(/[,\t;|]+/).map(s => s.trim()); return { num: num || '', name: name || '', cert: CERTS.find(c => c.toLowerCase() === (cert || '').toLowerCase()) || cert || 'EMT' }; }).filter(m => m.num || m.name);
    saveConfig(); UI.sheet = null; UI.form = {}; render();
    showToast(`Member roster saved: ${plural(C.members.length, 'member')}`, false);
  },

  /* requests */
  'req-save'() {
    const f = UI.form; if (!f.what) return;
    UI.sheet = null; UI.form = {};
    dispatch('reqAdd', { req: { id: uid(), what: f.what, qty: f.qty || 1, status: 'requested', t: now(), note: (f.note2 || '').trim() } },
      `Requested ${(f.qty || 1) > 1 ? f.qty + ' × ' : ''}${f.what}${f.note2 ? ' (' + f.note2 + ')' : ''}`, 'request');
  },
  'req-next'(id) {
    const r = S.requests.find(x => x.id === id); if (!r) return;
    const i = REQ_FLOW.indexOf(r.status); if (i < 0 || i === REQ_FLOW.length - 1) return;
    const nx = REQ_FLOW[i + 1];
    dispatch('reqStatus', { id, st: nx }, `${r.what}: ${reqStatusName(nx)}`, 'request');
  },

  /* ICS */
  'ics-save'(id) {
    const who = (UI.form.who || '').trim(), p = ICS_POSITIONS.find(x => x.id === id);
    if (!who) { showToast('Enter a name or pick someone', false); return; }
    UI.sheet = null; UI.form = {};
    dispatch('icsSet', { pos: id, who, at: now() }, `${p.label}: ${who}`, 'units');
  },
  'ics-clear'(id) {
    const p = ICS_POSITIONS.find(x => x.id === id);
    UI.sheet = null; UI.form = {};
    dispatch('icsClear', { pos: id }, `${p.label} vacated`, 'units');
  },

  /* hospitals */
  'hosp-notify'(id) { const h = hosp(id); dispatch('hospNotify', { id, at: now() }, `${h.short} notified`, 'note'); },
  'hosp-save'(id) {
    const h = hosp(id), c = UI.form.cap, beds = {};
    Object.entries(UI.form.beds || {}).forEach(([k, v]) => { if (v) beds[k] = v; });
    const ed = UI.form.ed || hospState(id).ed || '';
    UI.sheet = null; UI.form = {};
    dispatch('hospReport', { id, cap: { ...c }, beds, ed, at: now() },
      `${h.short} reports${ed ? ' ' + ed + ',' : ''} Red ${c.R}, Yellow ${c.Y}, Green ${c.G}${Object.keys(beds).length ? '; beds ' + Object.entries(beds).map(([k, v]) => `${BED_TYPES.find(b => b.k === k).name} ${v}`).join(', ') : ''}`, 'note');
  },

  /* phone */
  'contact-save'() {
    const f = UI.form, name = (f.cname || '').trim(), num = (f.cnum || '').trim();
    if (!name || !num) { showToast('Enter a name and a number', false); return; }
    C.contacts.push({ id: uid(), group: (f.cgroup || 'My agency').trim(), name, num, note: (f.cnote || '').trim() });
    saveConfig(); UI.sheet = null; UI.form = {}; render(); showToast(`Saved ${name}`, false);
  },
  'contact-del'(id) { C.contacts = C.contacts.filter(c => c.id !== id); saveConfig(); render(); },

  /* incident */
  'inc-save'() {
    const f = UI.form, fields = {};
    for (const k of ['type', 'location', 'municipality', 'commandName', 'ic', 'staging', 'access', 'hazards', 'lz', 'lzLocation']) fields[k] = typeof f[k] === 'string' ? f[k].trim() : f[k];
    UI.sheet = null; UI.form = {}; mapKind = null;
    dispatch('incEdit', { fields }, 'Incident details updated', 'note');
  },
  'inc-new'() {
    const f = UI.form;
    const base = blankState({ ...f, location: (f.location || '').trim(), commandName: (f.commandName || '').trim(), ic: (f.ic || '').trim() });
    base.log[0].text = `Command established${base.incident.commandName ? ': ' + base.incident.commandName : ''}${base.incident.ic ? ', ' + base.incident.ic : ''}`;
    startIncident(base, 'New incident started. Clock running.');
  },
  'load-sample'() { startIncident(sampleState(), 'Sample incident loaded'); },

  'log-filter'(k) { UI.logFilter = k; render(); },
  'quick-note'(text) { dispatch('note', {}, text, 'note'); },
  copy(i) { const s = radioScripts()[Number(i)]; copyText(s.text, document.getElementById('script-' + i)); },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  if (act === 'backdrop' && e.target !== el) return;
  if (A[act]) { if (el.tagName !== 'A') e.preventDefault(); A[act](el.dataset.arg, el, e); }
  wake();
});
document.addEventListener('input', e => {
  const t = e.target, f = t.dataset && t.dataset.field;
  if (!f) return;
  UI.form[f] = t.value;
  if (t.id === 'units-text') { const p = document.getElementById('units-preview'); if (p) p.innerHTML = unitsPreview(parseUnits(t.value)); }
  if (t.id === 'p-num') {
    const q = t.value.trim(), box = document.getElementById('member-matches');
    if (box) box.innerHTML = memberMatches(q ? C.members.filter(m => m.num.startsWith(q) || m.name.toLowerCase().includes(q.toLowerCase())).slice(0, 8) : []);
    const exact = C.members.find(m => m.num === q);
    if (exact) { UI.form.name = exact.name; UI.form.cert = exact.cert; const n = document.getElementById('p-name'); if (n) n.value = exact.name; }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && UI.sheet) closeSheet();
  if (e.key === 'Enter' && e.target && e.target.id === 'ag-unit') { e.preventDefault(); A['ag-add'](); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.dataset.form === 'note') {
    const text = (UI.form.note || '').trim();
    if (!text) return;
    UI.form.note = '';
    dispatch('note', {}, text, 'note');
    document.getElementById('note-input')?.focus();
  }
});

/* =====================================================================
   Clocks
   ===================================================================== */
function tick() {
  const t = now();
  const set = (k, v) => document.querySelectorAll(`[data-clock="${k}"]`).forEach(el => { if (el.textContent !== v) el.textContent = v; });
  set('now', hhmm(t));
  set('elapsed', dur(t - S.incident.dispatchAt));
  const due = S.par.last + S.par.interval * 60000, left = due - t;
  set('par', left >= 0 ? dur(left) : '+' + dur(-left));
  set('par-lbl', left >= 0 ? 'PAR due in' : 'PAR overdue');
  const b = document.getElementById('par-btn');
  if (b) { b.classList.toggle('due', left >= 0 && left < 60000); b.classList.toggle('over', left < 0); }
}

/* Keep the screen awake while the board is open, where the browser allows it. */
let lock = null;
async function wake() {
  try { if (!lock && navigator.wakeLock && document.visibilityState === 'visible') { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } } catch (e) { /* not granted */ }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { wake(); tick(); Sync.flush(); } });
window.addEventListener('online', () => Sync.flush());
window.addEventListener('resize', () => { if (MAP) MAP.invalidateSize(false); });

/* =====================================================================
   Boot
   ===================================================================== */
DEV = read(K.dev) || { id: 't' + Math.random().toString(36).slice(2, 10), role: 'command', mode: 'night', me: null };
saveDev();
C = { ...defaultConfig(), ...(read(K.cfg) || sampleConfig()) };
BASE = read(K.inc);
if (!BASE || !BASE.id) BASE = sampleState();
(read(K.ev(BASE.id)) || []).forEach(e => EVENTS.set(e.id, e));
rebuild();
loadUi();
render();
setInterval(tick, 1000);
Sync.start();
})();
</script>
