<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1B2B">
<title>OpsBoard Owner Console</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" integrity="sha512-ZDSPMa/JM1D+7kdg2x3BsruQ6T/JpJo3jWDWkCZsP+5yVyp1KfESqLI+7RqB5k24F7p2cV7i2YHh/890y6P6Sw==" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
<style>
/* OpsBoard owner console: every agency on the relay, its plan, its setup and how it is being used.
   Same colors as the board: night by default, day for bright rooms. */
:root {
  --bg: #0B1B2B; --surface: #12293D; --raised: #183449; --line: #25506E;
  --fg: #EAF2F8; --muted: #9FB6C8; --faint: #6F8AA0;
  --accent: #4FA3E3; --accent-ink: #04121E; --ok: #4CC38A; --warn: #E8B14C; --crit: #E8695C;
  --ag-ems: #4FA3E3; --ag-fire: #F0703F; --ag-pd: #7D8BFF;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 12px;
  color-scheme: dark;
}
:root[data-mode="day"] {
  --bg: #FFFFFF; --surface: #F2F5F8; --raised: #E2E9F0; --line: #8EA4B8;
  --fg: #06131F; --muted: #2E4558; --faint: #536A7D;
  --accent: #0B5FA5; --accent-ink: #FFFFFF; --ok: #0E7A45; --warn: #8C5A00; --crit: #B3261E;
  --ag-ems: #0B5FA5; --ag-fire: #B8401C; --ag-pd: #2B3FBF;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 500 16px/1.4 var(--body); -webkit-text-size-adjust: 100%;
  padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
.wrap { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.top h1 { margin: 0; font: 700 28px/1 var(--display); letter-spacing: 0.01em; }
.top .sub { color: var(--muted); font-size: 14px; }
.grow { flex: 1; }
.mark { width: 40px; height: 40px; border-radius: 22%; flex: none; }
.btn { min-height: 44px; padding: 0 14px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--raised); border: 1.5px solid var(--line); color: var(--fg); font: 700 16px/1 var(--display); letter-spacing: 0.04em; text-decoration: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { background: transparent; border-color: var(--crit); color: var(--crit); }
.btn.sm { min-height: 36px; font-size: 14px; padding: 0 10px; }
.btn:disabled { opacity: 0.45; cursor: wait; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.lbl { font: 600 12px/1 var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
.note { color: var(--muted); font-size: 14px; }
.err { color: var(--crit); font-weight: 600; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
input[type=text], input[type=password], input[type=date], input[type=search] { min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); width: 100%; }
input:focus-visible, .btn:focus-visible, .row:focus-visible, .chip:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.signin { max-width: 560px; display: flex; flex-direction: column; gap: 12px; }
.h { margin: 0; font: 700 20px/1.1 var(--display); }
details summary { cursor: pointer; }
details .field { margin-top: 8px; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.stat .v { font: 700 28px/1 var(--mono); font-variant-numeric: tabular-nums; }
.stat.warn .v { color: var(--warn); } .stat.crit .v { color: var(--crit); } .stat.ok .v { color: var(--ok); }
.bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.bar input[type=search] { max-width: 280px; }
.chip { min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; color: var(--muted); font: 700 13px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.list { display: flex; flex-direction: column; gap: 8px; }
.row { display: grid; grid-template-columns: minmax(200px, 1.4fr) minmax(150px, 1fr) minmax(120px, 0.8fr) minmax(170px, 1.2fr) minmax(150px, 1fr); gap: 12px; align-items: center;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); padding: 12px 14px; text-align: left; width: 100%; }
.row:hover { border-color: var(--accent); }
.row.head { background: transparent; border: 0; padding: 0 14px; }
.cell { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.cell b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell small { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
.ag { display: inline-block; font: 700 11px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 6px; border-radius: 5px; color: #fff; background: var(--ag-ems); vertical-align: 2px; margin-right: 6px; }
.ag.fire { background: var(--ag-fire); } .ag.police { background: var(--ag-pd); } .ag.ems { color: #04121E; }
:root[data-mode="day"] .ag.ems { color: #fff; }
.pill { display: inline-block; font: 700 12px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; padding: 5px 7px; border-radius: 5px; border: 1.5px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.ok { border-color: var(--ok); color: var(--ok); } .pill.warn { border-color: var(--warn); color: var(--warn); } .pill.crit { border-color: var(--crit); color: var(--crit); }
.pill.live { background: var(--crit); border-color: var(--crit); color: #fff; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 5px; vertical-align: 1px; }
.empty { color: var(--faint); padding: 18px 4px; }
/* one agency, in full */
.scrim { position: fixed; inset: 0; background: rgb(2 8 14 / 0.6); z-index: 20; display: flex; justify-content: flex-end; }
.drawer { width: min(720px, 100%); height: 100%; overflow: auto; background: var(--bg); border-left: 1px solid var(--line); padding: 18px 18px 40px; display: flex; flex-direction: column; gap: 14px; }
.drawer h2 { margin: 0; font: 700 26px/1.1 var(--display); }
.drawer h3 { margin: 0 0 8px; font: 700 15px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.kv { display: grid; grid-template-columns: minmax(120px, 170px) minmax(0, 1fr); gap: 6px 12px; margin: 0; }
.kv dt { color: var(--muted); font-weight: 600; } .kv dd { margin: 0; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font: 600 12px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); padding: 6px 8px; border-bottom: 1px solid var(--line); }
td { padding: 7px 8px; border-bottom: 1px solid color-mix(in srgb, var(--line) 50%, transparent); vertical-align: top; }
.tw { overflow-x: auto; }
.plans { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
.plans .field { width: 170px; }
.toast { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 30; max-width: calc(100vw - 32px); }
[hidden] { display: none !important; }
/* sharing a link: a QR code to scan, and the ways to send it */
.share { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.share .sharebody { flex: 1; min-width: 240px; display: flex; flex-direction: column; gap: 10px; }
.qr { background: #fff; padding: 8px; border-radius: 10px; width: 176px; flex: none; }
.qr svg { display: block; width: 100%; height: auto; }
.qr:empty { display: none; }
ol.steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
.codes { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; font: 700 16px/1 var(--mono); letter-spacing: 0.04em; }
.codes span { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; text-align: center; }
.key { font: 700 16px/1.4 var(--mono); letter-spacing: 0.08em; word-break: break-all; }
.nudge { border-color: var(--warn); }
input.code { font: 700 22px/1 var(--mono); letter-spacing: 0.2em; max-width: 220px; }
@media (max-width: 900px) {
  .row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .row.head { display: none; }
}
@media (max-width: 560px) {
  .row { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .kv { grid-template-columns: minmax(0, 1fr); } .kv dd { margin-bottom: 6px; }
  .top h1 { font-size: 24px; }
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="drawer-root"></div>
<div id="toast-root"></div>
<script>
(() => {
'use strict';
const BAKED_RELAY = /*@RELAY_URL*/'';
const MARK = '<svg class="mark" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" fill="#0B1B2B"/><rect x="92" y="92" width="152" height="152" rx="30" fill="#D7373F"/><rect x="268" y="92" width="152" height="152" rx="30" fill="#F2C230"/><rect x="92" y="268" width="152" height="152" rx="30" fill="#2DB86A"/><rect x="268" y="268" width="152" height="152" rx="30" fill="#EAF2F8"/><rect x="331" y="302" width="26" height="84" rx="5.2" fill="#0B1B2B"/><rect x="302" y="331" width="84" height="26" rx="5.2" fill="#0B1B2B"/></svg>';
const AG = { ems: 'EMS', fire: 'Fire', police: 'Police' };
const JOB = { command: 'EMS', triage: 'EMS', transport: 'EMS', supervisor: 'EMS', member: 'EMS', fire: 'Fire', police: 'Police', oem: 'Unified command', display: 'Big screen', event: 'Event' };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ss = { get: k => { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} } };
const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
const base = u => String(u || '').trim().replace(/\/+$/, '');
const t = v => (typeof v === 'number' ? v : Date.parse(v || ''));
const ago = v => { const ms = Date.now() - t(v); if (!Number.isFinite(ms)) return 'never'; const m = Math.round(ms / 60000); if (m < 2) return 'just now'; if (m < 60) return m + ' min ago'; const h = Math.round(m / 60); if (h < 36) return h + ' h ago'; const d = Math.round(h / 24); return d + (d === 1 ? ' day ago' : ' days ago'); };
const date = v => { const n = t(v); return Number.isFinite(n) ? new Date(n).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : ''; };
const dt = v => { const n = t(v); return Number.isFinite(n) ? new Date(n).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }) : ''; };
const daysLeft = v => Math.ceil((t(v) - Date.now()) / 86400000);
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const today = v => Number.isFinite(t(v)) && Date.now() - t(v) < 86400000;

const S = {
  relay: base(ls.get('owner:relay') || BAKED_RELAY),
  token: ls.get('owner:session') || '',   // the owner's sign-in, 30 days; Sign out ends it
  email: ls.get('owner:email') || '',
  code: ss.get('owner:code') || '',       // the setup code, if used instead: this tab only
  way: 'login', panel: null, made: null, perr: '',
  squads: null, at: null, err: '', busy: false, filter: 'all', q: '', open: null, detail: null, paid: '',
};
const signedIn = () => !!(S.token || S.code);
document.documentElement.dataset.mode = ls.get('owner:mode') || 'night';
{ const d = new Date(); d.setFullYear(d.getFullYear() + 1); S.paid = d.toISOString().slice(0, 10); }

async function call(path, body, headers) {
  const auth = headers || (S.token ? { authorization: 'Bearer ' + S.token } : S.code ? { 'x-bootstrap-code': S.code } : {});
  const r = await fetch(S.relay + path, { method: 'POST', headers: { 'content-type': 'application/json', ...auth }, body: JSON.stringify(body || {}) });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && S.token && !headers) { endSession(); }
  if (!r.ok) { const err = new Error((data.error && data.error.message) || `The relay answered ${r.status}.`); err.code = data.error && data.error.code; throw err; }
  return data;
}
function endSession() { S.token = ''; ls.set('owner:session', ''); S.squads = null; S.open = null; S.twoStep = null; S.tf = null; S.recovery = null; renderDrawer(); }
function startSession(d) { S.token = d.token; S.email = d.email || S.email; if ('twoStep' in d) S.twoStep = d.twoStep; S.code = ''; ss.set('owner:code', null); ls.set('owner:session', d.token); ls.set('owner:email', d.email); ls.set('owner:relay', S.relay); }
async function load(quiet) {
  if (!signedIn() || !S.relay || S.mustChange) return;
  S.busy = true; if (!quiet) render();
  if (S.token && S.twoStep == null) { try { const m = await call('/v1/owner/me', {}); S.twoStep = m.twoStep; S.recoveryLeft = m.recoveryLeft; } catch (e) { /* the list below says why */ } }
  try { const d = await call('/v1/owner/squads', {}); S.squads = d.squads; S.at = d.at; S.err = ''; }
  catch (e) { S.err = e.message; if (!S.squads) S.squads = null; }
  S.busy = false; render();
  if (S.open) openSquad(S.open, true);
}
async function openSquad(id, quiet) {
  S.open = id; if (!quiet) { S.detail = null; renderDrawer(); }
  try { S.detail = await call('/v1/owner/squad', { orgId: id }); } catch (e) { S.detail = { error: e.message }; }
  renderDrawer();
}
function toast(msg) { const r = document.getElementById('toast-root'); r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t = setTimeout(() => { r.innerHTML = ''; }, 4000); }

/* ---------- what a squad is doing, in words ---------- */
const kind = sq => (sq.board && sq.board.config && sq.board.config.type) || 'ems';
function planInfo(p) {
  if (!p) return { label: 'Trial not started', note: 'Starts the first time a tablet shares', cls: '' };
  if (p.tier === 'comp') return { label: 'No end date', note: 'Comp', cls: 'ok' };
  if (p.tier === 'off') return { label: 'Sharing off', note: 'Turned off by the owner', cls: 'crit' };
  if (p.tier === 'squad') return p.active ? { label: p.grace ? 'Payment due' : 'Paying', note: p.paidThrough ? 'Paid through ' + date(p.paidThrough) : 'Active', cls: p.grace ? 'warn' : 'ok' } : { label: 'Lapsed', note: 'Paid through ' + date(p.paidThrough), cls: 'crit' };
  if (!p.active) return { label: 'Trial ended', note: 'Ended ' + date(p.endsAt), cls: 'crit' };
  const d = daysLeft(p.endsAt);
  return { label: 'Trial', note: `${plural(d, 'day')} left · ends ${date(p.endsAt)}`, cls: d <= 14 ? 'warn' : '' };
}
const mciLive = sq => { const i = sq.board && sq.board.incident; return !!(i && !i.clear && !i.sample); };
const eventLive = sq => { const e = sq.board && sq.board.event; return !!(e && !e.endedAt && !e.sample); };
const ending = sq => { const p = sq.plan; return !!(p && p.active && ((p.tier === 'trial' && daysLeft(p.endsAt) <= 14) || (p.tier === 'squad' && p.grace))); };
const lapsed = sq => !!(sq.plan && !sq.plan.active);
const FILTERS = [
  ['all', 'All', () => true],
  ['today', 'Active today', sq => today(sq.lastActiveAt)],
  ['live', 'MCI or event running', sq => mciLive(sq) || eventLive(sq)],
  ['trial', 'On trial', sq => !sq.plan || sq.plan.tier === 'trial'],
  ['paying', 'Paying', sq => sq.plan && (sq.plan.tier === 'squad' || sq.plan.tier === 'comp') && sq.plan.active],
  ['ending', 'Ending soon', ending],
  ['lapsed', 'Lapsed or off', lapsed],
  ['fire', 'Fire', sq => kind(sq) === 'fire'],
  ['police', 'Police', sq => kind(sq) === 'police'],
];
function nowText(sq) {
  const b = sq.board || {}, out = [];
  if (mciLive(sq)) out.push(`<span class="pill live">MCI</span> ${esc(b.incident.type || 'Incident')}${b.incident.place ? ' · ' + esc(b.incident.place) : ''} · ${plural(b.incident.patients, 'patient')}`);
  if (eventLive(sq)) out.push(`<span class="pill ok">Event</span> ${esc(b.event.name)} · ${plural(b.event.people, 'member')}`);
  if (b.day && !b.day.sample) out.push(`${plural(b.day.calls, 'call')} today · ${b.day.crew} on duty`);
  return out.join('<br>') || '<span class="note">Nothing running</span>';
}
function setupText(sq) {
  const c = sq.board && sq.board.config;
  if (!c) return '<span class="note">Not set up yet</span>';
  const bits = [plural(c.units, 'unit'), c.members + ' on roster', c.cameras && plural(c.cameras, 'camera'), c.feeds && plural(c.feeds, 'feed'), c.logo && 'logo', c.par && 'PAR'].filter(Boolean);
  return esc(bits.join(' · '));
}

/* ---------- sharing a link ---------- */
const APP_URL = new URL('./', location.href).href;
const qrSvg = text => { try { const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); } catch (e) { return ''; } };
const MSG = {};   // what Send, Text and Email say, by link
function adminMessage(orgName, link, code) {
  return `Here is the OpsBoard admin link for ${orgName}:\n${link}\n\n`
    + `1. Open it on the iPad your agency will run OpsBoard on. On an iPad or iPhone, first add the page to the Home Screen (Share, then Add to Home Screen), open it from there, and tap Join.\n`
    + `2. That iPad is now your agency's admin. From it, Menu > Squad sharing makes links for your other tablets and your members' phones.\n`
    + `3. To set up your agency from a computer (name, logo, units, roster), on the admin iPad: Menu > Squad sharing > Web login. Then sign in at ${APP_URL}agency.html\n\n`
    + `Invite code, if it asks: ${code}\nAnyone with this link becomes an admin, so keep it to yourselves.`;
}
const shareInstructions = () => `<ol class="steps"><li>They open the link on the iPad the agency will use (on an iPad, Add to Home Screen first, then open it from there) and tap <b>Join</b>. That iPad is the agency's admin.</li>
  <li>From it, Menu → Squad sharing makes links for their other tablets and members' phones, and a web login for the agency console on a computer.</li>
  <li>Anyone with this link becomes an admin. If it's lost or sent to the wrong person, make a new one from the agency's row here: the old one stops working.</li></ol>`;
function shareBox(link, { code, subject, message }) {
  MSG[link] = { subject, message };
  return `<div class="share"><div class="qr" role="img" aria-label="QR code for this link">${qrSvg(link)}</div>
    <div class="sharebody">
      <div class="field"><span class="lbl">Link</span><input type="text" readonly value="${esc(link)}" id="f-link" aria-label="Link"></div>
      <div class="bar"><button class="btn sm primary" data-act="copy" data-arg="${esc(link)}">Copy link</button>${code ? `<button class="btn sm" data-act="copy" data-arg="${esc(code)}">Copy code ${esc(code)}</button>` : ''}
        ${navigator.share ? `<button class="btn sm" data-act="send" data-arg="${esc(link)}">Send…</button>` : ''}
        <a class="btn sm" href="sms:?&body=${encodeURIComponent(message)}">Text</a>
        <a class="btn sm" href="mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(message)}">Email</a></div>
      <p class="note">They can also point the iPad's camera at the QR code.</p>
    </div></div>`;
}

/* ---------- two-step sign-in ---------- */
function twoStepPanel() {
  if (S.recovery) return `<h3 class="h">Save your recovery codes</h3>
    <p class="note">Each one signs you in once if you don't have your phone. Keep them somewhere safe, apart from your phone: printed, or in a password manager. They won't be shown again.</p>
    <div class="codes">${S.recovery.map(c => `<span>${esc(c)}</span>`).join('')}</div>
    <div class="bar"><button class="btn sm" data-act="copy" data-arg="${esc(S.recovery.join('\n'))}">Copy them</button><button class="btn sm" data-act="codes-file">Download</button><button class="btn sm primary" data-act="codes-done">I saved them</button></div>`;
  if (S.tf) return `<h3 class="h">Turn on two-step sign-in</h3>
    <ol class="steps"><li>On your phone, open an authenticator app: the iPhone's <b>Passwords</b> app (Codes), <b>Google Authenticator</b> or <b>Microsoft Authenticator</b>.</li>

const app = document.getElementById('app'), drawerRoot = document.getElementById('drawer-root');
function render() {
  const focus = document.activeElement && document.activeElement.id, sel = focus && document.activeElement.selectionStart;
  app.innerHTML = S.mustChange && S.token ? choosePassword() : signedIn() && S.squads ? main() : signin();
  if (focus) { const el = document.getElementById(focus); if (el) { el.focus(); try { if (sel != null) el.setSelectionRange(sel, sel); } catch (e) {} } }
}
function renderDrawer() { drawerRoot.innerHTML = S.open ? drawer() : ''; }

function csv() {
  const rows = [['Agency', 'Kind', 'County', 'Plan', 'Plan detail', 'Members', 'Admins', 'Guests', 'Devices', 'Online', 'Last active', 'MCI running', 'Event running', 'Calls today', 'Units', 'Roster', 'Created', 'ID']];
  for (const sq of S.squads || []) {
    const b = sq.board || {}, c = b.config || {}, pi = planInfo(sq.plan);
    rows.push([sq.name, AG[kind(sq)], c.num || '', pi.label, pi.note, sq.members.active, sq.members.admins, sq.members.guests, (b.devices || []).length, (b.online || []).length, sq.lastActiveAt ? new Date(sq.lastActiveAt).toISOString() : '', mciLive(sq) ? 'yes' : '', eventLive(sq) ? 'yes' : '', b.day ? b.day.calls : '', c.units ?? '', c.members ?? '', sq.createdAt || '', sq.id]);
  }
  const text = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv' })); a.download = `opsboard-agencies-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}

const ACT = {
  async signin() {
    S.relay = base(document.getElementById('f-relay').value); S.code = document.getElementById('f-code').value.trim(); S.token = '';
    if (!S.relay || !S.code) { S.err = 'The relay address and the setup code are both needed.'; S.code = ''; return render(); }
    S.squads = null; await load();
    if (S.squads) { ls.set('owner:relay', S.relay); ss.set('owner:code', S.code); } else S.code = '';
    render();
  },
  async login() {
    S.relay = base(document.getElementById('f-relay').value);
    const codeEl = document.getElementById('f-code2');
    const email = codeEl ? S.email : document.getElementById('f-email').value.trim(), password = codeEl ? S.pass : document.getElementById('f-pass').value;
    const code = codeEl ? codeEl.value.trim() : '';
    S.email = email; S.err = ''; S.busy = true; render();
    try {
      const d = await call('/v1/owner/login', { email, password, ...(code ? { code } : {}) }, {});
      S.need = false; S.pass = ''; startSession(d); S.busy = false;
      if (d.mustChange) { S.mustChange = true; S.firstPass = password; return render(); }
      if (d.recoveryLeft !== undefined) toast(`Signed in with a recovery code. ${plural(d.recoveryLeft, 'code')} left.`);
      await load();
    } catch (e) {
      S.busy = false;
      if (e.code === 'need_code') { S.need = true; S.pass = password; S.err = ''; } else S.err = e.message;
      render();
    }
  },
  'code-back'() { S.need = false; S.pass = ''; S.err = ''; render(); },
  async 'tf-start'() {
    S.perr = '';
    try { S.tf = await call('/v1/owner/2fa/start', {}); } catch (e) { S.perr = e.message; }
    render();
  },
  'tf-cancel'() { S.tf = null; S.perr = ''; render(); },
  async 'tf-confirm'() {
    const code = document.getElementById('f-tfcode').value.trim(); S.perr = '';
    try {
      const d = await call('/v1/owner/2fa/confirm', { code });
      startSession({ token: d.token, twoStep: true }); S.tf = null; S.recovery = d.recovery; S.recoveryLeft = d.recovery.length;
      toast('Two-step sign-in is on.');
    } catch (e) { S.perr = e.message; }
    render();
  },
  async 'tf-recovery'() {
    const code = document.getElementById('f-tfcode').value.trim(); S.perr = '';
    try { const d = await call('/v1/owner/2fa/recovery', { code }); S.recovery = d.recovery; S.recoveryLeft = d.recovery.length; } catch (e) { S.perr = e.message; }
    render();
  },
  async 'tf-off'() {
    const code = document.getElementById('f-tfcode').value.trim(), password = document.getElementById('f-tfpass').value; S.perr = '';
    if (!confirm('Turn off two-step sign-in? Your password alone will open the owner console.')) return;
    try { await call('/v1/owner/2fa/off', { code, password }); S.twoStep = false; toast('Two-step sign-in is off.'); } catch (e) { S.perr = e.message; }
    render();
  },
  'codes-done'() { S.recovery = null; render(); },
  'codes-file'() {
    const text = `OpsBoard owner recovery codes for ${S.email}\nEach works once. Made ${new Date().toLocaleString()}.\n\n${S.recovery.join('\n')}\n`;
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' })); a.download = 'opsboard-recovery-codes.txt';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  },
  async 'owner-invite'() {
    try {
      const d = await call('/v1/owner/invite', { orgId: S.open });
      S.inv = { ...d, link: `${APP_URL}#join=1&u=${encodeURIComponent(S.relay)}&i=${encodeURIComponent(d.inviteCode)}` };
      renderDrawer(); toast('New admin link made. The one before stops working.');
    } catch (e) { toast(e.message); }
  },
  dkind(k) { S.dkind = k; render(); },
  async choose() {
    const a = document.getElementById('f-new1').value, b = document.getElementById('f-new2').value;
    S.err = '';
    if (a.length < 10) { S.err = 'The password needs at least 10 characters.'; return render(); }
    if (a !== b) { S.err = 'The two passwords don\'t match.'; return render(); }
    try {
      const d = await call('/v1/owner/password', { current: S.firstPass, next: a });
      startSession({ token: d.token, email: S.email }); S.mustChange = false; S.firstPass = '';
      toast('Password set. You\'re signed in.'); await load();
    } catch (e) { S.err = e.message; render(); }
  },
  async 'act-as'() {
    const sq = (S.squads || []).find(x => x.id === S.open);
    try {
      const d = await call('/v1/owner/act-as', { orgId: S.open });
      window.open(`agency.html#owner=1&relay=${encodeURIComponent(S.relay)}&session=${encodeURIComponent(d.token)}`, '_blank', 'noopener');
      toast(`Opened ${sq ? sq.name : 'the agency'}'s console. It shows in their activity log.`);
    } catch (e) { toast(e.message); }
  },
  async reset() {
    S.relay = base(document.getElementById('f-relay').value);
    const email = document.getElementById('f-email').value.trim(), password = document.getElementById('f-pass').value, code = document.getElementById('f-code').value.trim();
    S.email = email; S.err = '';
    if (!code) { S.err = 'Enter the setup code.'; return render(); }
    S.busy = true; render();
    try { startSession(await call('/v1/owner/claim', { email, password }, { 'x-bootstrap-code': code })); S.busy = false; S.way = 'login'; toast('Owner login saved.'); await load(); }
    catch (e) { S.busy = false; S.err = e.message; render(); }
  },
  way(k) { S.way = k; S.err = ''; render(); },
  panel(k) { S.panel = k || null; S.made = null; S.perr = ''; S.pwerr = ''; S.tf = null; render(); },
  kind(k) { S.kind = k; render(); },
  newplan(k) { S.newplan = k; render(); },
  'add-again'() { S.made = null; render(); },
  async create() {
    const orgName = document.getElementById('f-org').value.trim();
    if (!orgName) { S.perr = 'The agency needs a name.'; return render(); }
    try {
      const d = await call('/v1/owner/create', { orgName, kind: S.kind || 'ems', plan: S.newplan === 'comp' ? 'comp' : 'trial' });
      S.made = { ...d, link: `${APP_URL}#join=1&u=${encodeURIComponent(S.relay)}&i=${encodeURIComponent(d.inviteCode)}` };
      S.perr = ''; S.orgName = ''; render(); load(true);
    } catch (e) { S.perr = e.message; render(); }
  },
  async password() {
    const current = document.getElementById('f-cur').value, next = document.getElementById('f-new').value;
    try { const d = await call('/v1/owner/password', { current, next }); if (d.token) startSession({ token: d.token }); S.pwerr = ''; S.panel = null; render(); toast('Password changed. Every other sign-in has ended.'); }
    catch (e) { S.pwerr = e.message; render(); }
  },
  copy(text) { navigator.clipboard.writeText(text).then(() => toast('Copied'), () => { const el = document.getElementById('f-link'); if (el) { el.select(); } toast('Select it and copy.'); }); },
  send(link) { const m = MSG[link]; if (m && navigator.share) navigator.share({ title: m.subject, text: m.message.replace(link, '').trim(), url: link }).catch(() => {}); },
  refresh() { load(); },
  async signout() {
    if (S.token) { try { await call('/v1/owner/logout', {}); } catch (e) { /* ends locally anyway */ } }
    endSession(); ss.set('owner:code', null); S.code = ''; S.err = ''; S.panel = null; S.way = 'login'; render();
  },
  mode() { const m = document.documentElement.dataset.mode === 'day' ? 'night' : 'day'; document.documentElement.dataset.mode = m; ls.set('owner:mode', m); render(); renderDrawer(); },
  filter(k) { S.filter = k; render(); },
  open(id) { openSquad(id); },
  close() { S.open = null; S.detail = null; S.inv = null; renderDrawer(); },
  'close-bg'(_, e) { if (e.target.classList.contains('scrim')) ACT.close(); },
  csv() { csv(); },
  async plan(tier, e) {
    const btn = e.target.closest('button'); btn.disabled = true;
    S.paid = (document.getElementById('f-paid') || {}).value || S.paid;
    try {
      const r = await call('/v1/owner/plan', { orgId: S.open, tier, paidThrough: S.paid });
      const sq = (S.squads || []).find(x => x.id === S.open); if (sq) sq.plan = r.plan;
      if (S.detail) S.detail.plan = r.plan;
      toast(`${r.name}: ${planInfo(r.plan).label}`);
      render(); renderDrawer();
    } catch (err) { toast(err.message); btn.disabled = false; }
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.dataset.act === 'close-bg' && e.target !== el) return;
  fn(el.dataset.arg, e);
});
document.addEventListener('input', e => {
  if (e.target.id === 'f-q') { S.q = e.target.value; render(); }
  if (e.target.id === 'f-org') S.orgName = e.target.value;   // kept across redraws, like picking the kind
  if (e.target.id === 'f-dname') { S.dname = e.target.value; render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.open) ACT.close();
  if (e.key === 'Enter' && S.mustChange && e.target.id === 'f-new2') ACT.choose();
  if (e.key === 'Enter' && e.target.id === 'f-tfcode' && S.tf) ACT['tf-confirm']();
  if (e.key === 'Enter' && !signedIn()) { if (S.way === 'login' && (e.target.id === 'f-pass' || e.target.id === 'f-email' || e.target.id === 'f-code2')) ACT.login(); else if (S.way === 'code' && e.target.id === 'f-code') ACT.signin(); else if (S.way === 'reset' && e.target.id === 'f-code') ACT.reset(); }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.squads && Date.now() - t(S.at) > 120000) load(true); });
setInterval(() => { if (document.visibilityState === 'visible' && S.squads && !S.busy) load(true); }, 300000);   // every 5 minutes: each refresh counts against the free plan's daily lookups
render();
if (signedIn()) load();
})();
</script>
</body>
</html>
